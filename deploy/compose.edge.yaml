# Caddy edge: satu-satunya proses yang membuka port 80/443 di VPS. Melayani HTTPS untuk host production
# dan staging lalu meneruskan ke container di jaringan balans-edge (Technical Guideline 9.4, 14.2).
#   docker network create balans-edge   (sekali saat setup VPS)
#   docker compose -p balans-edge -f compose.edge.yaml --env-file /opt/balans/edge.env up -d

services:
  caddy:
    image: caddy:2.11.4-alpine
    env_file: ${ENV_FILE:?ENV_FILE wajib diisi}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - edge

networks:
  edge:
    external: true
    name: balans-edge

volumes:
  caddy-data: {}
  caddy-config: {}
