# File ini dihasilkan oleh: go run ./tools/lintconfig > .golangci.yml
# Jangan diedit langsung; ubah tools/lintconfig/main.go.
version: "2"
run:
  tests: true
linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - gosec
    - depguard
    - gocritic
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - contextcheck
    - nilerr
    - unused
    - ineffassign
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
    gosec:
      excludes:
        - G104 # sudah ditangani errcheck
    depguard:
      rules:
        platform:
          list-mode: lax
          files:
            - "**/internal/platform/**"
