components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token EdDSA 15 menit (Technical Guideline 9.1).
  schemas:
    Problem:
      $ref: "./components/problem.yaml#/Problem"
    ErrorCode:
      $ref: "./components/problem.yaml#/ErrorCode"
