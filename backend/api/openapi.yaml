openapi: 3.0.3
info:
  title: Balans Platform API
  version: 0.0.0
  description: |
    Kontrak API back-office Balans. File ini adalah sumber kebenaran (Technical Guideline 8.1).
    Server Go dan client TypeScript digenerate dari spec ini. Path dipecah per modul di folder paths/.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: system
    description: Kesehatan proses dan informasi sistem
  - name: sales
    description: Penjualan, termasuk webhook payment gateway
  - name: logistics
    description: Pengiriman, termasuk webhook kurir
  - name: identity
    description: Sesi, pengguna, dan permission (R1.1)
  - name: audit
    description: Riwayat perubahan (audit trail)
  - name: catalog
    description: Master produk, packaging, material, bundling (R1.1)
  - name: warehouse
    description: Gudang dan lokasi stok (R1.1)
paths:
  /healthz:
    $ref: "./paths/system.yaml#/healthz"
  /readyz:
    $ref: "./paths/system.yaml#/readyz"
  /api/v1/system/info:
    $ref: "./paths/system.yaml#/systemInfo"
  /api/v1/webhooks/midtrans:
    $ref: "./paths/sales.yaml#/midtransWebhook"
  /api/v1/webhooks/biteship:
    $ref: "./paths/logistics.yaml#/biteshipWebhook"
  /api/v1/auth/login:
    $ref: "./paths/identity.yaml#/login"
  /api/v1/auth/refresh:
    $ref: "./paths/identity.yaml#/refresh"
  /api/v1/auth/logout:
    $ref: "./paths/identity.yaml#/logout"
  /api/v1/auth/reauth:
    $ref: "./paths/identity.yaml#/reauth"
  /api/v1/auth/password/forgot:
    $ref: "./paths/identity.yaml#/passwordForgot"
  /api/v1/auth/password/token:
    $ref: "./paths/identity.yaml#/passwordToken"
  /api/v1/auth/password/setup:
    $ref: "./paths/identity.yaml#/passwordSetup"
  /api/v1/auth/password/change:
    $ref: "./paths/identity.yaml#/passwordChange"
  /api/v1/auth/mfa/setup:
    $ref: "./paths/identity.yaml#/mfaSetup"
  /api/v1/auth/mfa/activate:
    $ref: "./paths/identity.yaml#/mfaActivate"
  /api/v1/me:
    $ref: "./paths/identity.yaml#/me"
  /api/v1/users:
    $ref: "./paths/identity.yaml#/users"
  /api/v1/users/{id}:
    $ref: "./paths/identity.yaml#/user"
  /api/v1/users/{id}/activate:
    $ref: "./paths/identity.yaml#/userActivate"
  /api/v1/users/{id}/deactivate:
    $ref: "./paths/identity.yaml#/userDeactivate"
  /api/v1/users/{id}/resend-invitation:
    $ref: "./paths/identity.yaml#/userResendInvitation"
  /api/v1/users/{id}/reset-mfa:
    $ref: "./paths/identity.yaml#/userResetMfa"
  /api/v1/roles:
    $ref: "./paths/identity.yaml#/roles"
  /api/v1/roles/{id}/permissions:
    $ref: "./paths/identity.yaml#/rolePermissions"
  /api/v1/permissions:
    $ref: "./paths/identity.yaml#/permissions"
  /api/v1/audit-logs:
    $ref: "./paths/audit.yaml#/auditLogs"
  /api/v1/products:
    $ref: "./paths/catalog.yaml#/products"
  /api/v1/products/{id}:
    $ref: "./paths/catalog.yaml#/product"
  /api/v1/warehouses:
    $ref: "./paths/warehouse.yaml#/warehouses"
  /api/v1/locations:
    $ref: "./paths/warehouse.yaml#/locations"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token EdDSA 15 menit (Technical Guideline 9.1).
  schemas:
    Problem:
      $ref: "./components/problem.yaml#/Problem"
    ErrorCode:
      $ref: "./components/problem.yaml#/ErrorCode"
