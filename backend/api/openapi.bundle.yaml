        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Search'
        - name: supplierType
          in: query
          schema:
            $ref: '#/components/schemas/SupplierType'
      responses:
        '200':
          description: Daftar pemasok; field sort yang diizinkan `code`, `name`, `createdAt`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createSupplier
      tags:
        - party
      summary: Membuat pemasok atau maklon
      description: Kode unik permanen (`DUPLICATE_CODE`). NPWP dan nomor rekening dienkripsi (NFR-04).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierInput'
      responses:
        '201':
          description: Pemasok dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/suppliers/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getSupplier
      tags:
        - party
      summary: Detail pemasok; NPWP dan rekening ditampilkan tersamar
      responses:
        '200':
          description: Pemasok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updateSupplier
      tags:
        - party
      summary: Mengubah pemasok
      description: |
        Kode tidak bisa diubah. `npwp` tidak dikirim = tidak berubah. Rekening dengan `id` tanpa `accountNumber`
        mempertahankan nomor lama; rekening yang tidak dikirim dihapus.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SupplierInput'
                - $ref: '#/components/schemas/VersionInput'
      responses:
        '200':
          description: Pemasok diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteSupplier
      tags:
        - party
      summary: Menghapus pemasok (soft delete)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/PartyVersion'
      responses:
        '204':
          description: Pemasok dihapus
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/party/user-options:
    get:
      operationId: listPartyUserOptions
      tags:
        - party
      summary: Pengguna aktif untuk dipilih sebagai Sales atau Merchandiser mitra
      parameters:
        - $ref: '#/components/parameters/Search'
        - name: role
          in: query
          description: Batasi ke pemegang role, mis. `merchandiser` atau `sales_mt`.
          schema:
            type: string
      responses:
        '200':
          description: Maksimal 20 pengguna
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PartyUserOption'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/employees:
    get:
      operationId: listEmployees
      tags:
        - hris
      summary: Data karyawan dasar (HR-01)
      description: |
        `q` mencari nomor karyawan atau nama. `nik` mencari persis lewat hash HMAC (NIK tidak pernah dicari
        sebagai teks, Technical Guideline 6.7).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Search'
        - name: nik
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/EmploymentStatus'
      responses:
        '200':
          description: Daftar karyawan; field sort yang diizinkan `employeeNumber`, `fullName`, `joinDate`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createEmployee
      tags:
        - hris
      summary: Menambah karyawan
      description: Nomor karyawan unik permanen (`DUPLICATE_CODE`); NIK dienkripsi AES-256-GCM.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeInput'
      responses:
        '201':
          description: Karyawan dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/employees/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getEmployee
      tags:
        - hris
      summary: Detail karyawan; NIK ditampilkan tersamar
      responses:
        '200':
          description: Karyawan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updateEmployee
      tags:
        - hris
      summary: Mengubah data karyawan
      description: Nomor karyawan tidak bisa diubah. `nik` tidak dikirim = tidak berubah; string kosong = dihapus.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/EmployeeInput'
                - $ref: '#/components/schemas/VersionInput'
      responses:
        '200':
          description: Karyawan diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/employees/{id}/resign:
    post:
      operationId: resignEmployee
      tags:
        - hris
      summary: Mencatat resign karyawan
      description: |
        Mulai tanggal resign karyawan tidak lagi aktif; pelanggan yang tertaut otomatis kehilangan harga karyawan
        (HR-03). Tanggal boleh di masa depan (resign terjadwal).
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeResignInput'
      responses:
        '200':
          description: Resign tercatat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/employee-options:
    get:
      operationId: listEmployeeOptions
      tags:
        - hris
      summary: Pilihan karyawan untuk ditautkan ke pelanggan
      description: |
        Hanya nomor, nama, dan status (tanpa data pribadi). Terbuka untuk `hris.employee.read` atau
        `party.customer.write` (CS menautkan pelanggan ke karyawan).
      parameters:
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Maksimal 20 karyawan aktif
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmployeeOption'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/files:
    post:
      operationId: createFileUpload
      tags:
        - filestore
      summary: Meminta URL upload file (Technical Guideline 5.16)
      description: |
        Backend memeriksa permission tulis pemilik (`ownerType`), ukuran, dan tipe file lalu mengembalikan URL
        upload bertanda tangan yang berlaku 15 menit. Browser mengirim isi file dengan `PUT uploadUrl`, lalu
        mengirim `fileId` di request bisnis (mis. PKS mitra) yang memvalidasi dan menautkan file ke pemiliknya.
        Ukuran berlebih ditolak `FILE_TOO_LARGE`, tipe lain `FILE_TYPE_NOT_ALLOWED`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileUploadInput'
      responses:
        '201':
          description: URL upload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadTarget'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/files/{id}:
    get:
      operationId: getFile
      tags:
        - filestore
      summary: Metadata file
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Metadata file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileObject'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/files/{id}/download-url:
    get:
      operationId: getFileDownloadUrl
      tags:
        - filestore
      summary: URL unduhan bertanda tangan berumur 5 menit
      description: |
        File yang sudah ditautkan hanya bisa diunduh pemegang permission baca pemiliknya (mis.
        `party.partner_agreement.read`); file yang belum ditautkan hanya oleh pengunggahnya.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: URL unduhan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileDownloadTarget'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/file-content/{id}:
    put:
      operationId: putFileContent
      tags:
        - filestore
      summary: Mengunggah isi file ke URL bertanda tangan
      description: |
        Dipanggil browser dengan `uploadUrl` dari `createFileUpload`, tanpa header Authorization dan tanpa
        Idempotency-Key (setara presigned PUT object storage). Ukuran harus sama dengan yang dideklarasikan dan
        isi file harus sesuai tipenya.
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/FileExpires'
        - $ref: '#/components/parameters/FileSignature'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: File tersimpan
        default:
          $ref: '#/components/responses/Problem'
    get:
      operationId: getFileContent
      tags:
        - filestore
      summary: Mengunduh isi file dengan URL bertanda tangan
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/FileExpires'
        - $ref: '#/components/parameters/FileSignature'
      responses:
        '200':
          description: Isi file dengan Content-Type aslinya
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token EdDSA 15 menit (Technical Guideline 9.1).
  schemas:
    Problem:
      type: object
      description: Format error RFC 7807 (Technical Guideline 8.3). Field code adalah kontrak stabil untuk FE.
      required:
        - type
        - title
        - status
        - code
        - detail
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          $ref: '#/components/schemas/ErrorCode'
        detail:
          type: string
          description: Pesan Bahasa Indonesia yang aman ditampilkan ke user.
        fields:
          type: object
          additionalProperties:
            type: string
        requestId:
          type: string
    ErrorCode:
      type: string
      description: Katalog kode error (Technical Guideline Lampiran A).
      enum:
        - VALIDATION_FAILED
        - AUTH_INVALID_CREDENTIALS
        - AUTH_ACCOUNT_LOCKED
        - AUTH_MFA_REQUIRED
        - AUTH_MFA_INVALID
        - AUTH_TOKEN_EXPIRED
        - AUTH_SESSION_EXPIRED
        - AUTH_REAUTH_REQUIRED
        - AUTH_MFA_ENROLLMENT_REQUIRED
        - AUTH_PASSWORD_TOKEN_INVALID
        - FORBIDDEN
        - NOT_FOUND
        - VERSION_CONFLICT
        - INVALID_STATE_TRANSITION
        - IDEMPOTENCY_KEY_REQUIRED
        - IDEMPOTENCY_IN_PROGRESS
        - IDEMPOTENCY_KEY_REUSED
        - DUPLICATE_CODE
        - PERIOD_LOCKED
        - STOCK_INSUFFICIENT
        - BATCH_SHELF_LIFE_TOO_SHORT
        - APPROVAL_REQUIRED
        - APPROVAL_POLICY_MISSING
        - DISCOUNT_LIMIT_EXCEEDED
        - CREDIT_LIMIT_EXCEEDED
        - THREE_WAY_MATCH_FAILED
        - DEPOSIT_INSUFFICIENT
        - OUTSIDE_ATTENDANCE_RADIUS
        - FILE_TOO_LARGE
        - FILE_TYPE_NOT_ALLOWED
        - IMPORT_ALREADY_PROCESSED
        - RATE_LIMITED
        - PROVIDER_UNAVAILABLE
        - BAD_REQUEST
        - INTERNAL_ERROR
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    ReadinessCheck:
      type: object
      required:
        - name
        - status
      properties:
        name:
          type: string
          example: database
        status:
          type: string
          enum:
            - ok
            - failed
        detail:
          type: string
    ReadinessStatus:
      type: object
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum:
            - ready
            - not_ready
        checks:
          type: array
          items:
            $ref: '#/components/schemas/ReadinessCheck'
    DatabaseInfo:
      type: object
      required:
        - status
        - schemaVersion
        - latestSchemaVersion
      properties:
        status:
          type: string
          enum:
            - ok
            - failed
        schemaVersion:
          type: integer
          format: int64
        latestSchemaVersion:
          type: integer
          format: int64
    SystemInfo:
      type: object
      required:
        - version
        - commit
        - environment
        - enabledModules
        - mockActive
        - serverTime
        - database
      properties:
        version:
          type: string
          example: v1.0.0
        commit:
          type: string
        environment:
          type: string
          enum:
            - local
            - staging
            - production
        enabledModules:
          type: array
          items:
            type: string
        mockActive:
          type: boolean
          description: True jika minimal satu adapter pihak ketiga memakai mock.
        serverTime:
          type: string
          format: date-time
        database:
          $ref: '#/components/schemas/DatabaseInfo'
    MidtransNotification:
      type: object
      description: Payload HTTP notification Midtrans (nama field milik Midtrans).
      required:
        - order_id
        - status_code
        - gross_amount
        - signature_key
        - transaction_status
        - transaction_id
      properties:
        order_id:
          type: string
        status_code:
          type: string
        gross_amount:
          type: string
        signature_key:
          type: string
        transaction_status:
          type: string
        transaction_id:
          type: string
        fraud_status:
          type: string
    WebhookAck:
      type: object
      required:
        - received
        - duplicate
      properties:
        received:
          type: boolean
        duplicate:
          type: boolean
    BiteshipNotification:
      type: object
      description: Payload webhook status order Biteship (nama field milik Biteship).
      required:
        - event
        - order_id
        - status
      properties:
        event:
          type: string
          example: order.status
        order_id:
          type: string
        courier_waybill_id:
          type: string
        status:
          type: string
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
        totpCode:
          type: string
          pattern: ^[0-9]{6}$
    AccessToken:
      type: object
      required:
        - accessToken
        - expiresAt
      properties:
        accessToken:
          type: string
        expiresAt:
          type: string
          format: date-time
    ReauthRequest:
      type: object
      properties:
        password:
          type: string
        totpCode:
          type: string
          pattern: ^[0-9]{6}$
    PasswordForgotRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
    PasswordTokenInfo:
      type: object
      required:
        - email
        - fullName
        - purpose
      properties:
        email:
          type: string
        fullName:
          type: string
        purpose:
          type: string
          enum:
            - invite
            - reset
    PasswordSetupRequest:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 10
          maxLength: 128
    PasswordChangeRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 10
          maxLength: 128
    MfaSetup:
      type: object
      required:
        - secret
        - otpauthUrl
        - qrCodeDataUrl
      properties:
        secret:
          type: string
        otpauthUrl:
          type: string
        qrCodeDataUrl:
          type: string
          description: Gambar PNG QR code dalam format data URL.
    MfaActivateRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          pattern: ^[0-9]{6}$
    CurrentUser:
      type: object
      required:
        - id
        - email
        - fullName
        - roles
        - permissions
        - isMfaEnabled
        - mfaEnrollmentRequired
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        fullName:
          type: string
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
          example:
            - catalog.product.read
            - catalog.product.write
        isMfaEnabled:
          type: boolean
        mfaEnrollmentRequired:
          type: boolean
          description: Role user mewajibkan MFA tetapi MFA belum aktif; semua menu lain terkunci sampai MFA aktif.
    Pagination:
      type: object
      description: Metadata pagination standar (Technical Guideline 8.2).
      required:
        - page
        - pageSize
        - totalItems
        - totalPages
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 200
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
    UserRoleAssignment:
      type: object
      required:
        - code
      properties:
        code:
          type: string
        name:
          type: string
          readOnly: true
        scopeDivisionId:
          type: string
          format: uuid
          nullable: true
    User:
      type: object
      required:
        - id
        - email
        - fullName
        - roles
        - isActive
        - isMfaEnabled
        - hasPassword
        - createdAt
        - updatedAt
        - version
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        fullName:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/UserRoleAssignment'
        divisionId:
          type: string
          format: uuid
          nullable: true
        employeeId:
          type: string
          format: uuid
          nullable: true
        isActive:
          type: boolean
        isMfaEnabled:
          type: boolean
        hasPassword:
          type: boolean
          description: false berarti undangan belum diterima.
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
    UserList:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/User'
    UserInput:
      type: object
      required:
        - email
        - fullName
        - roles
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        fullName:
          type: string
          minLength: 1
          maxLength: 120
        roles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/UserRoleAssignment'
        divisionId:
          type: string
          format: uuid
          nullable: true
        employeeId:
          type: string
          format: uuid
          nullable: true
    UserUpdate:
      type: object
      required:
        - fullName
        - roles
        - version
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 120
        roles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/UserRoleAssignment'
        divisionId:
          type: string
          format: uuid
          nullable: true
        employeeId:
          type: string
          format: uuid
          nullable: true
        version:
          type: integer
    VersionInput:
      type: object
      required:
        - version
      properties:
        version:
          type: integer
          description: Versi terakhir yang dilihat user (optimistic locking).
    Role:
      type: object
      required:
        - id
        - code
        - name
        - description
        - requiresMfa
        - hasDivisionScope
        - permissions
        - version
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type: string
        requiresMfa:
          type: boolean
        hasDivisionScope:
          type: boolean
        permissions:
          type: array
          items:
            type: string
        version:
          type: integer
    RolePermissionsInput:
      type: object
      required:
        - permissions
        - version
      properties:
        permissions:
          type: array
          items:
            type: string
        version:
          type: integer
    Permission:
      type: object
      required:
        - code
        - module
        - description
        - requiresReauth
      properties:
        code:
          type: string
        module:
          type: string
        description:
          type: string
        requiresReauth:
          type: boolean
    AuditAction:
      type: string
      enum:
        - create
        - update
        - delete
        - restore
        - status_change
        - approve
        - reject
        - submit
        - post
        - cancel
        - login
        - login_failed
        - logout
        - import
        - export
    AuditChange:
      type: object
      properties:
        from: {}
        to: {}
    AuditLog:
      type: object
      required:
        - id
        - actorId
        - actorName
        - action
        - entityType
        - entityId
        - entityLabel
        - changes
        - note
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
        actorName:
          type: string
        action:
          $ref: '#/components/schemas/AuditAction'
        entityType:
          type: string
        entityId:
          type: string
          format: uuid
        entityLabel:
          type: string
        changes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AuditChange'
        note:
          type: string
        ip:
          type: string
        createdAt:
          type: string
          format: date-time
