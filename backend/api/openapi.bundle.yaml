      description: |
        Stock count harus berjenis konsinyasi, Selesai, di lokasi konsinyasi mitra, dan bertanggal paling jauh 7 hari
        dari cut-off. Satu rekonsiliasi terbuka per mitra.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
