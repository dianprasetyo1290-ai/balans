      description: |
        Qty lulus pindah Karantina → Tersedia di lokasi tujuan; qty ditolak tetap Karantina (ditahan di Inbound untuk
        barang pemasok/maklon, atau pindah ke Gudang Retur). Qty lulus + ditolak = qty baris. Permission
        `warehouse.inbound.post`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
