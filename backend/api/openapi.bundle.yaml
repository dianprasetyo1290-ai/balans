    post:
      operationId: createApprovalDelegation
      tags:
        - approval
      summary: Mendelegasikan persetujuan selama cuti
      description: |
        Tanpa `fromUserId` mendelegasikan milik user sendiri. Mencatat delegasi untuk user lain butuh
        `approval.policy.write`. Satu user hanya punya satu delegasi pada tanggal yang sama; maksimal 90 hari.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDelegationInput'
      responses:
        '201':
          description: Delegasi dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalDelegation'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/approval-delegations/{id}/cancel:
    post:
      operationId: cancelApprovalDelegation
      tags:
        - approval
      summary: Menghentikan delegasi
      parameters:
