      schema:
        type: string
        format: uuid
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Sort:
      name: sort
      in: query
      description: Daftar field dipisah koma; awalan minus untuk descending, mis. `-createdAt,sku`.
      schema:
        type: string
    RefreshCookie:
      name: balans_refresh
      in: cookie
      required: false
      schema:
        type: string
    Version:
      name: version
      in: query
      required: true
      description: Versi terakhir yang dilihat user (optimistic locking).
      schema:
        type: integer
    IncludeInactive:
      name: includeInactive
      in: query
      schema:
        type: boolean
        default: false
    PartyVersion:
      name: version
      in: query
      required: true
      description: Versi terakhir yang dilihat user (optimistic locking).
      schema:
        type: integer
    FileExpires:
      name: exp
      in: query
      required: true
      description: Waktu kedaluwarsa URL (Unix detik).
      schema:
        type: integer
        format: int64
    FileSignature:
      name: sig
      in: query
      required: true
      schema:
        type: string
    PricingVersion:
      name: version
      in: query
      required: true
      description: Versi terakhir yang dilihat user (optimistic locking).
      schema:
        type: integer
    PricingIncludeEnded:
      name: includeEnded
      in: query
      description: Tampilkan juga data yang periodenya sudah berakhir (riwayat).
      schema:
        type: boolean
        default: false
    DataExchangeKindPath:
      name: kind
      in: path
      required: true
      description: Jenis data = resource permission, mis. `catalog.product`.
      schema:
        type: string
    DataExchangeKindQuery:
      name: kind
      in: query
      schema:
        type: string
