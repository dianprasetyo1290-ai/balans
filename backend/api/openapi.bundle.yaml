      summary: Detail Repacking
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Repacking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Repacking'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updateRepacking
