            schema:
              $ref: '#/components/schemas/CustomerInput'
      responses:
        '201':
          description: Pelanggan dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        default:
          $ref: '#/components/responses/Problem'
