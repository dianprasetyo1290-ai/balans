            schema:
              $ref: '#/components/schemas/PurchaseReturnUpdate'
      responses:
        '200':
          description: Draft diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseReturn'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/purchase-returns/{id}/submit:
    post:
      operationId: submitPurchaseReturn
      tags:
        - procurement
      summary: Ajukan retur pembelian ke Head Logistik (nomor RB)
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionInput'
      responses:
        '200':
          description: Menunggu persetujuan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseReturn'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/purchase-returns/{id}/post:
    post:
      operationId: postPurchaseReturn
      tags:
        - procurement
      summary: Posting retur pembelian (nota debit DN, jurnal A-02)
      description: |
        Barang keluar dari lokasi/status asal dengan HPP FIFO; bagian yang belum ditagih mengurangi 2102 (qty diterima PO
        ikut berkurang), bagian yang sudah ditagih mengurangi utang 2101 lewat nota debit.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionInput'
      responses:
        '200':
          description: Diposting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseReturn'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/purchase-returns/{id}/revise:
    post:
      operationId: revisePurchaseReturn
      tags:
        - procurement
      summary: Kembalikan retur yang ditolak ke Draft
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionInput'
      responses:
        '200':
          description: Kembali Draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseReturn'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/purchase-returns/{id}/cancel:
    post:
      operationId: cancelPurchaseReturn
      tags:
        - procurement
      summary: Batalkan retur Draft atau Disetujui
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseCancelInput'
      responses:
        '200':
          description: Dibatalkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseReturn'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/procurement/reports/goods-received-not-invoiced:
    get:
      operationId: getGoodsReceivedNotInvoiced
      tags:
        - procurement
      summary: Laporan Barang Diterima Belum Ditagih per PO/GR (S-209)
      description: Saldo per baris GR dan rekonsiliasi ke saldo akun 2102 (total sub-ledger, saldo buku besar, selisih).
      parameters:
        - $ref: '#/components/parameters/Search'
        - name: supplierId
          in: query
          schema:
            type: string
            format: uuid
        - name: purchaseOrderId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Laporan per hari ini
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoodsReceivedNotInvoicedReport'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token EdDSA 15 menit (Technical Guideline 9.1).
  schemas:
    Problem:
      type: object
      description: Format error RFC 7807 (Technical Guideline 8.3). Field code adalah kontrak stabil untuk FE.
      required:
        - type
        - title
        - status
        - code
        - detail
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          $ref: '#/components/schemas/ErrorCode'
        detail:
          type: string
          description: Pesan Bahasa Indonesia yang aman ditampilkan ke user.
        fields:
          type: object
          additionalProperties:
            type: string
        requestId:
          type: string
    ErrorCode:
      type: string
      description: Katalog kode error (Technical Guideline Lampiran A).
      enum:
        - VALIDATION_FAILED
        - AUTH_INVALID_CREDENTIALS
        - AUTH_ACCOUNT_LOCKED
        - AUTH_MFA_REQUIRED
        - AUTH_MFA_INVALID
        - AUTH_TOKEN_EXPIRED
        - AUTH_SESSION_EXPIRED
        - AUTH_REAUTH_REQUIRED
        - AUTH_MFA_ENROLLMENT_REQUIRED
        - AUTH_PASSWORD_TOKEN_INVALID
        - FORBIDDEN
        - NOT_FOUND
        - VERSION_CONFLICT
        - INVALID_STATE_TRANSITION
        - IDEMPOTENCY_KEY_REQUIRED
        - IDEMPOTENCY_IN_PROGRESS
        - IDEMPOTENCY_KEY_REUSED
        - DUPLICATE_CODE
        - PERIOD_LOCKED
        - STOCK_INSUFFICIENT
        - BATCH_SHELF_LIFE_TOO_SHORT
        - APPROVAL_REQUIRED
        - APPROVAL_POLICY_MISSING
        - DISCOUNT_LIMIT_EXCEEDED
        - CREDIT_LIMIT_EXCEEDED
        - THREE_WAY_MATCH_FAILED
        - DEPOSIT_INSUFFICIENT
        - OUTSIDE_ATTENDANCE_RADIUS
        - FILE_TOO_LARGE
        - FILE_TYPE_NOT_ALLOWED
        - IMPORT_ALREADY_PROCESSED
        - RATE_LIMITED
        - PROVIDER_UNAVAILABLE
        - BAD_REQUEST
        - INTERNAL_ERROR
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    ReadinessCheck:
      type: object
      required:
        - name
        - status
      properties:
        name:
          type: string
          example: database
        status:
          type: string
          enum:
            - ok
            - failed
        detail:
          type: string
    ReadinessStatus:
      type: object
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum:
            - ready
            - not_ready
        checks:
          type: array
          items:
            $ref: '#/components/schemas/ReadinessCheck'
    DatabaseInfo:
      type: object
      required:
        - status
        - schemaVersion
        - latestSchemaVersion
      properties:
        status:
          type: string
          enum:
            - ok
            - failed
        schemaVersion:
          type: integer
          format: int64
        latestSchemaVersion:
          type: integer
          format: int64
    SystemInfo:
      type: object
      required:
        - version
        - commit
        - environment
        - enabledModules
        - mockActive
        - serverTime
        - database
      properties:
        version:
          type: string
          example: v1.0.0
        commit:
          type: string
        environment:
          type: string
          enum:
            - local
            - staging
            - production
        enabledModules:
          type: array
          items:
            type: string
        mockActive:
          type: boolean
          description: True jika minimal satu adapter pihak ketiga memakai mock.
        serverTime:
          type: string
          format: date-time
        database:
          $ref: '#/components/schemas/DatabaseInfo'
    MidtransNotification:
      type: object
      description: Payload HTTP notification Midtrans (nama field milik Midtrans).
      required:
        - order_id
        - status_code
        - gross_amount
        - signature_key
        - transaction_status
        - transaction_id
      properties:
        order_id:
          type: string
        status_code:
          type: string
        gross_amount:
          type: string
        signature_key:
          type: string
        transaction_status:
          type: string
        transaction_id:
          type: string
        fraud_status:
          type: string
    WebhookAck:
      type: object
      required:
        - received
        - duplicate
      properties:
        received:
          type: boolean
        duplicate:
          type: boolean
    ReturnReasonScope:
      type: string
      enum:
        - sales_return
        - purchase_return
    ReturnReasonAppliesTo:
      type: string
      description: Dokumen yang memakai alasan ini.
      enum:
        - sales_return
        - purchase_return
        - both
    ReturnDisposition:
      type: string
      description: Disposisi barang retur (Disposisi Retur, WMS-07); dipakai master Alasan Retur dan dokumen Disposisi Retur.
      enum:
        - restock
        - repack
        - reprocess
        - marketing_sample
        - dispose
    ReturnReason:
      type: object
      required:
        - id
        - code
        - name
        - appliesTo
        - description
        - isActive
        - updatedAt
        - version
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: DAMAGED_SHIPPING
        name:
          type: string
        appliesTo:
          $ref: '#/components/schemas/ReturnReasonAppliesTo'
        defaultDisposition:
          allOf:
            - $ref: '#/components/schemas/ReturnDisposition'
          nullable: true
          description: Usulan awal disposisi; staf gudang tetap memilih saat QC.
        description:
          type: string
        isActive:
          type: boolean
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
    ReturnReasonFields:
      type: object
      required:
        - name
        - appliesTo
        - isActive
      properties:
        name:
          type: string
          maxLength: 150
        appliesTo:
          $ref: '#/components/schemas/ReturnReasonAppliesTo'
        defaultDisposition:
          allOf:
            - $ref: '#/components/schemas/ReturnDisposition'
          nullable: true
        description:
          type: string
          maxLength: 500
        isActive:
          type: boolean
    ReturnReasonInput:
      allOf:
        - $ref: '#/components/schemas/ReturnReasonFields'
        - type: object
          required:
            - code
          properties:
            code:
              type: string
              example: DAMAGED_SHIPPING
    VersionInput:
      type: object
      required:
        - version
      properties:
        version:
          type: integer
          description: Versi terakhir yang dilihat user (optimistic locking).
    ReturnReasonUpdate:
      allOf:
        - $ref: '#/components/schemas/ReturnReasonFields'
        - $ref: '#/components/schemas/VersionInput'
    SalesDocumentStatus:
      type: string
      description: Status Sales Order, Proforma Invoice, Invoice, dan pembayaran pelanggan (Desain Status Dokumen 1).
      enum:
        - draft
        - pending_approval
        - awaiting_payment
        - partially_paid
        - paid
        - in_progress
        - in_transit
        - completed
        - cancelled
        - expired
        - posted
    SalesOrderType:
      type: string
      description: |
        Jenis pesanan (satu model Sales Order untuk semua channel): `modern_trade` MT beli putus, `b2b` B2B/corporate,
        `social_commerce` WhatsApp/Instagram, `marketplace` penjualan marketplace, `employee` penjualan karyawan.
      enum:
        - modern_trade
        - b2b
        - social_commerce
        - marketplace
        - employee
    BusinessDate:
      type: string
      format: date
      description: Tanggal bisnis WIB tanpa jam (YYYY-MM-DD).
      example: '2026-10-19'
    Pagination:
      type: object
      description: Metadata pagination standar (Technical Guideline 8.2).
      required:
        - page
        - pageSize
        - totalItems
        - totalPages
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 200
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
    SalesPaymentMode:
      type: string
      description: '`prepaid` = Proforma Invoice lalu invoice lunas; `credit` = tempo (MT/B2B), invoice terbit saat konfirmasi.'
      enum:
        - prepaid
        - credit
    Money:
      type: string
      description: Nominal Rupiah sebagai string desimal 2 angka di belakang koma (Technical Guideline 10.5).
      pattern: ^-?[0-9]{1,16}(\.[0-9]{1,2})?$
      example: '1250000.00'
    SalesOrderSummary:
      type: object
      required:
        - id
        - orderType
        - channelId
        - channelName
        - subChannelId
        - subChannelName
        - partyName
        - partyCode
        - partyPhone
        - externalOrderId
        - clientPoNumber
        - businessDate
        - paymentMode
        - totalAmount
        - status
        - createdAt
        - version
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          nullable: true
        orderType:
          $ref: '#/components/schemas/SalesOrderType'
        channelId:
          type: string
          format: uuid
        channelName:
          type: string
        subChannelId:
          type: string
          format: uuid
        subChannelName:
          type: string
        customerId:
          type: string
          format: uuid
          nullable: true
        partnerId:
          type: string
          format: uuid
          nullable: true
        partyName:
          type: string
        partyCode:
          type: string
        partyPhone:
          type: string
        externalOrderId:
          type: string
        clientPoNumber:
          type: string
        businessDate:
          $ref: '#/components/schemas/BusinessDate'
        paymentMode:
          $ref: '#/components/schemas/SalesPaymentMode'
        totalAmount:
          $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/SalesDocumentStatus'
        createdAt:
          type: string
          format: date-time
        version:
          type: integer
    SalesOrderList:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/SalesOrderSummary'
    DiscountKind:
      type: string
      description: Bentuk diskon manual (MD-05) — persen dari dasar atau nominal rupiah.
      enum:
        - percent
        - amount
    SalesDiscount:
      type: object
      required:
        - kind
        - value
      properties:
        kind:
          $ref: '#/components/schemas/DiscountKind'
        value:
          type: string
          description: Persen (maks. 4 desimal) atau nominal rupiah.
          example: '5'
    SalesQuantity:
      type: string
      description: Kuantitas desimal maks. 3 angka di belakang koma sebagai string.
      pattern: ^[0-9]{1,15}(\.[0-9]{1,3})?$
      example: '12.000'
    SalesOrderLineInput:
      type: object
      required:
        - productId
        - qty
      properties:
        productId:
          type: string
          format: uuid
        qty:
          $ref: '#/components/schemas/SalesQuantity'
        discount:
          $ref: '#/components/schemas/SalesDiscount'
        unitPrice:
          allOf:
            - $ref: '#/components/schemas/Money'
          nullable: true
          description: Hanya marketplace (harga di marketplace); jenis lain memakai resolver harga.
        note:
          type: string
          maxLength: 200
    SalesOrderFields:
      type: object
      required:
        - channelId
        - subChannelId
        - businessDate
        - lines
      properties:
        channelId:
          type: string
          format: uuid
        subChannelId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
          nullable: true
        partnerId:
          type: string
          format: uuid
          nullable: true
        buyerName:
          type: string
          maxLength: 200
          description: Nama pembeli marketplace.
        externalOrderId:
          type: string
          maxLength: 80
          description: Nomor order marketplace (unik per marketplace).
        clientPoNumber:
          type: string
          maxLength: 200
          description: Nomor PO klien MT/B2B.
        businessDate:
          $ref: '#/components/schemas/BusinessDate'
        sourceLocationId:
          type: string
          format: uuid
          nullable: true
          description: Lokasi asal stok; kosong untuk marketplace = E-commerce Stock satu-satunya.
        paymentMode:
          $ref: '#/components/schemas/SalesPaymentMode'
        paymentTermDays:
          type: integer
          minimum: 0
          maximum: 365
        shipToName:
          type: string
          maxLength: 200
        shipToPhone:
          type: string
          maxLength: 200
        shipToAddress:
          type: string
          maxLength: 1000
        documentDiscount:
          $ref: '#/components/schemas/SalesDiscount'
        shippingAmount:
          $ref: '#/components/schemas/Money'
        note:
          type: string
          maxLength: 1000
        lines:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/SalesOrderLineInput'
    SalesOrderInput:
      allOf:
        - $ref: '#/components/schemas/SalesOrderFields'
        - type: object
          required:
            - orderType
          properties:
            orderType:
              $ref: '#/components/schemas/SalesOrderType'
    SalesLocationRef:
      type: object
      required:
        - id
        - code
        - name
        - locationType
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        locationType:
          type: string
    SalesProductRef:
      type: object
      required:
        - id
        - sku
        - name
        - uom
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        uom:
          type: string
    SalesOrderLine:
      type: object
      required:
        - id
        - lineNo
        - product
        - isBundle
        - qty
        - unitPrice
        - priceRule
        - priceDescription
        - discount
        - grossAmount
        - discountAmount
        - lineTotalAmount
        - shippedQty
        - note
      properties:
        id:
          type: string
          format: uuid
        lineNo:
          type: integer
        product:
          $ref: '#/components/schemas/SalesProductRef'
        isBundle:
          type: boolean
        qty:
          $ref: '#/components/schemas/SalesQuantity'
        unitPrice:
          $ref: '#/components/schemas/Money'
        priceRule:
          type: string
          description: Aturan harga (PriceRule) atau `marketplace_input`.
        priceSourceId:
          type: string
          format: uuid
          nullable: true
        priceListId:
          type: string
          format: uuid
          nullable: true
        priceListVersionId:
          type: string
          format: uuid
          nullable: true
        priceDescription:
          type: string
        discount:
          $ref: '#/components/schemas/SalesDiscount'
        grossAmount:
          $ref: '#/components/schemas/Money'
        discountAmount:
          $ref: '#/components/schemas/Money'
        lineTotalAmount:
          $ref: '#/components/schemas/Money'
        shippedQty:
          $ref: '#/components/schemas/SalesQuantity'
        note:
          type: string
    SalesAllocationBatch:
      type: object
      required:
        - qty
      properties:
        batchId:
          type: string
          format: uuid
          nullable: true
        batchNumber:
          type: string
          nullable: true
        expiryDate:
          allOf:
            - $ref: '#/components/schemas/BusinessDate'
          nullable: true
        qty:
          $ref: '#/components/schemas/SalesQuantity'
    SalesOrderAllocation:
      type: object
      required:
        - id
        - lineId
        - product
        - location
        - qty
        - shippedQty
        - released
        - batches
      properties:
        id:
          type: string
          format: uuid
        lineId:
          type: string
          format: uuid
        product:
          $ref: '#/components/schemas/SalesProductRef'
        location:
          $ref: '#/components/schemas/SalesLocationRef'
        qty:
          $ref: '#/components/schemas/SalesQuantity'
        shippedQty:
          $ref: '#/components/schemas/SalesQuantity'
        released:
          type: boolean
        batches:
          type: array
          items:
            $ref: '#/components/schemas/SalesAllocationBatch'
    SalesDocumentRef:
      type: object
      required:
        - id
        - number
        - status
        - amount
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
        status:
          $ref: '#/components/schemas/SalesDocumentStatus'
        amount:
          $ref: '#/components/schemas/Money'
        validUntil:
          allOf:
            - $ref: '#/components/schemas/BusinessDate'
          nullable: true
        paidAmount:
          allOf:
            - $ref: '#/components/schemas/Money'
          nullable: true
    SalesShipment:
      type: object
      required:
        - id
        - sourceType
        - sourceId
        - sourceLabel
        - businessDate
        - costAmount
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        sourceType:
          type: string
        sourceId:
          type: string
          format: uuid
        sourceLabel:
          type: string
        businessDate:
          $ref: '#/components/schemas/BusinessDate'
        costAmount:
          $ref: '#/components/schemas/Money'
        createdAt:
          type: string
          format: date-time
    SalesOrder:
      allOf:
        - $ref: '#/components/schemas/SalesOrderSummary'
        - type: object
          required:
            - sourceLocation
            - paymentTermDays
            - shipToName
            - shipToPhone
            - shipToAddress
            - grossAmount
            - lineDiscountAmount
            - documentDiscount
            - documentDiscountAmount
            - shippingAmount
            - discountApprovalRequired
            - note
            - cancelReason
            - createdByName
            - lines
            - allocations
            - proformas
            - invoices
            - shipments
            - allowedActions
          properties:
            sourceLocation:
              $ref: '#/components/schemas/SalesLocationRef'
            paymentTermDays:
              type: integer
            shipToName:
              type: string
            shipToPhone:
              type: string
            shipToAddress:
              type: string
            grossAmount:
              $ref: '#/components/schemas/Money'
            lineDiscountAmount:
              $ref: '#/components/schemas/Money'
            documentDiscount:
              $ref: '#/components/schemas/SalesDiscount'
            documentDiscountAmount:
              $ref: '#/components/schemas/Money'
            shippingAmount:
              $ref: '#/components/schemas/Money'
            discountApprovalRequired:
              type: boolean
            discountApprovedAt:
              type: string
              format: date-time
              nullable: true
            note:
              type: string
            cancelReason:
              type: string
            confirmedAt:
              type: string
              format: date-time
              nullable: true
            shippedAt:
              type: string
              format: date-time
              nullable: true
            deliveredAt:
              type: string
              format: date-time
              nullable: true
            paymentProofFileId:
              type: string
              format: uuid
              nullable: true
            paymentProofFileName:
              type: string
              nullable: true
            createdByName:
              type: string
            lines:
              type: array
              items:
                $ref: '#/components/schemas/SalesOrderLine'
            allocations:
              type: array
              items:
                $ref: '#/components/schemas/SalesOrderAllocation'
            proformas:
              type: array
              items:
                $ref: '#/components/schemas/SalesDocumentRef'
            invoices:
              type: array
              items:
                $ref: '#/components/schemas/SalesDocumentRef'
            shipments:
              type: array
              items:
                $ref: '#/components/schemas/SalesShipment'
            allowedActions:
              type: array
              items:
                type: string
                enum:
                  - edit
                  - confirm
                  - cancel
                  - upload_payment_proof
    SalesOrderUpdate:
      allOf:
        - $ref: '#/components/schemas/SalesOrderFields'
        - $ref: '#/components/schemas/VersionInput'
    SalesCancelInput:
      type: object
      required:
        - version
      properties:
        version:
          type: integer
        reason:
          type: string
          maxLength: 400
    SalesPaymentProofInput:
      type: object
      required:
        - version
        - fileId
      properties:
        version:
          type: integer
        fileId:
          type: string
          format: uuid
    SalesChannelOption:
      type: object
      required:
