      responses:
        '204':
          description: Lokasi dihapus
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/locations/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: restoreLocation
      tags:
        - warehouse
      summary: Memulihkan lokasi yang dihapus (hanya Admin Sistem)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Lokasi dipulihkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/stock-balances:
    get:
      operationId: listStockBalances
      tags:
        - inventory
      summary: Stok per Lokasi — saldo per produk × lokasi × batch × status (INV-01, WMS-01)
      description: |
        Hanya saldo > 0. `unitCost` adalah HPP rata-rata sisa cost layer batch (FIFO di dalam batch), `value` =
        qty × unitCost. Permission `inventory.stock.read`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: productId
          in: query
          schema:
            type: string
            format: uuid
        - name: locationId
          in: query
          description: Bisa lebih dari satu.
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: batchId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Bisa lebih dari satu.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/StockStatus'
      responses:
        '200':
          description: Saldo stok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockBalanceList'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/stock-card:
    get:
      operationId: getStockCard
      tags:
        - inventory
      summary: Kartu Stok per SKU (opsional lokasi, batch, status) dengan saldo qty & nilai berjalan (INV-01)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: productId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: locationId
          in: query
          schema:
            type: string
            format: uuid
        - name: batchId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/StockStatus'
        - name: dateFrom
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Kartu stok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockCard'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/batches:
    get:
      operationId: listBatches
      tags:
        - inventory
      summary: Batch & Kedaluwarsa — batch berurutan FEFO dengan qty per status (INV-04, INV-09)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - name: productId
          in: query
          schema:
            type: string
            format: uuid
        - name: expiryState
          in: query
          schema:
            $ref: '#/components/schemas/ExpiryState'
        - name: nearExpiryDays
          in: query
          description: Batas hari "Segera kedaluwarsa" (default 90).
          schema:
            type: integer
            minimum: 1
            maximum: 730
        - name: withStock
          in: query
          description: Default `true` — hanya batch yang masih punya stok.
          schema:
            type: boolean
      responses:
        '200':
          description: Daftar batch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchList'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/batch-suggestions:
    get:
      operationId: suggestBatches
      tags:
        - inventory
      summary: Alokasi Batch (FEFO) — saran batch untuk mengambil qty dari satu lokasi (S-215)
      description: |
        Batch stok Tersedia diurutkan kedaluwarsa terdekat; batch kedaluwarsa dan stok Karantina tidak diusulkan.
        Pemilihan batch manual yang bukan saran FEFO wajib alasan saat diposting.
      parameters:
        - name: productId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: locationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: qty
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/StockQuantity'
      responses:
        '200':
          description: Saran batch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchSuggestion'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/cost-layers:
    get:
      operationId: listCostLayers
      tags:
        - inventory
      summary: HPP per Batch — cost layer FIFO per penerimaan (INV-03)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: productId
          in: query
          schema:
            type: string
            format: uuid
        - name: batchId
          in: query
          schema:
            type: string
            format: uuid
        - name: openOnly
          in: query
          description: Hanya layer yang masih bersisa.
          schema:
            type: boolean
      responses:
        '200':
          description: Cost layer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostLayerList'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/cost-layers/{id}/consumptions:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: listCostLayerConsumptions
      tags:
        - inventory
      summary: Jejak konsumsi HPP satu cost layer (RPT-04)
      responses:
        '200':
          description: Jejak konsumsi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostLayerConsumptionList'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/bundle-availability:
    get:
      operationId: listBundleAvailability
      tags:
        - inventory
      summary: Stok tersedia bundel virtual = min(floor(stok komponen ÷ qty)) (S-115, MD-03)
      description: |
        Stok komponen = stok Tersedia di lokasi `locationId`, atau di semua lokasi yang bisa dijual bila kosong.
      parameters:
        - name: bundleId
          in: query
          required: true
          description: Maks. 200.
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: locationId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Stok tersedia per bundel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BundleAvailabilityList'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/customers:
    get:
      operationId: listCustomers
      tags:
        - party
      summary: Daftar pelanggan (MD-06)
      description: |
        `q` mencari nama, kode, atau nomor HP (nomor dinormalisasi lebih dulu sehingga `0812…`, `62812…`, dan
        `+62812…` sama). `phone` mencari persis satu nomor untuk cek duplikat sebelum membuat pelanggan.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Search'
        - name: phone
          in: query
          schema:
            type: string
        - name: customerType
          in: query
          schema:
            $ref: '#/components/schemas/CustomerType'
      responses:
        '200':
          description: Daftar pelanggan; field sort yang diizinkan `code`, `fullName`, `createdAt`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createCustomer
      tags:
        - party
      summary: Membuat pelanggan
      description: Nomor HP yang sudah dipakai pelanggan lain ditolak `VALIDATION_FAILED` pada field `phone`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
      responses:
        '201':
          description: Pelanggan dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/customers/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getCustomer
      tags:
        - party
      summary: Detail pelanggan beserta alamat
      responses:
        '200':
          description: Pelanggan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updateCustomer
      tags:
        - party
      summary: Mengubah pelanggan (optimistic locking dengan `version`)
      description: |
        Daftar `addresses` menggantikan seluruh alamat: alamat dengan `id` diubah, tanpa `id` ditambah, dan yang
        tidak dikirim dihapus (soft delete).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CustomerInput'
                - $ref: '#/components/schemas/VersionInput'
      responses:
        '200':
          description: Pelanggan diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteCustomer
      tags:
        - party
      summary: Menghapus pelanggan (soft delete)
      description: Pelanggan tetap tampil di dokumen lama; nomor HP-nya boleh dipakai pelanggan baru.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/PartyVersion'
      responses:
        '204':
          description: Pelanggan dihapus
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/partners:
    get:
      operationId: listPartners
      tags:
        - party
      summary: Daftar mitra MT, konsinyasi, dan B2B (MD-07)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Search'
        - name: partnerType
          in: query
          schema:
            $ref: '#/components/schemas/PartnerType'
      responses:
        '200':
          description: Daftar mitra; field sort yang diizinkan `code`, `name`, `createdAt`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createPartner
      tags:
        - party
      summary: Membuat mitra
      description: Kode mitra unik permanen dan tidak bisa dipakai ulang walau mitra dihapus (`DUPLICATE_CODE`).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerInput'
      responses:
        '201':
          description: Mitra dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partner'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/partners/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getPartner
      tags:
        - party
      summary: Detail mitra
      responses:
        '200':
          description: Mitra
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partner'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updatePartner
      tags:
        - party
      summary: Mengubah mitra
      description: Kode tidak bisa diubah. `npwp` tidak dikirim = tidak berubah; string kosong = dihapus.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/PartnerInput'
                - $ref: '#/components/schemas/VersionInput'
      responses:
        '200':
          description: Mitra diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partner'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deletePartner
      tags:
        - party
      summary: Menghapus mitra (soft delete)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/PartyVersion'
      responses:
        '204':
          description: Mitra dihapus
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/partners/{id}/agreements:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: listPartnerAgreements
      tags:
        - party
      summary: Riwayat PKS mitra, terbaru lebih dulu
      responses:
        '200':
          description: PKS mitra
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PartnerAgreement'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createPartnerAgreement
      tags:
        - party
      summary: Mencatat PKS baru (effective-dated)
      description: |
        Periode PKS dengan jenis yang sama tidak boleh tumpang tindih (Technical Guideline 5.14). Perubahan
        ketentuan dicatat sebagai PKS baru mulai tanggal berlakunya; PKS lama dipersingkat lewat `validTo`.
        `fileId` adalah PDF PKS yang sudah diunggah lewat `POST /api/v1/files` dengan `ownerType=partner_agreement`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerAgreementInput'
      responses:
        '201':
          description: PKS dicatat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerAgreement'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/partner-agreements/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      operationId: updatePartnerAgreement
      tags:
        - party
      summary: Mengoreksi PKS
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/PartnerAgreementInput'
                - $ref: '#/components/schemas/VersionInput'
      responses:
        '200':
          description: PKS diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerAgreement'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deletePartnerAgreement
      tags:
        - party
      summary: Menghapus PKS yang salah input (soft delete)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/PartyVersion'
      responses:
        '204':
          description: PKS dihapus
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/partner-product-codes:
    get:
      operationId: listPartnerProductCodes
      tags:
        - party
      summary: Kode artikel & barcode retailer per SKU per mitra (MD-07)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - name: partnerId
          in: query
          schema:
            type: string
            format: uuid
        - name: productId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Kode produk mitra, urut mitra lalu kode artikel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerProductCodeList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createPartnerProductCode
      tags:
        - party
      summary: Menambah kode produk mitra
      description: Satu produk hanya punya satu kode per mitra; kode artikel unik per mitra (`VALIDATION_FAILED`).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerProductCodeInput'
      responses:
        '201':
          description: Kode dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerProductCode'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/partner-product-codes/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      operationId: updatePartnerProductCode
      tags:
        - party
      summary: Mengubah kode artikel, barcode, atau keterangan
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/PartnerProductCodeUpdate'
                - $ref: '#/components/schemas/VersionInput'
      responses:
        '200':
          description: Kode diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerProductCode'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deletePartnerProductCode
      tags:
        - party
      summary: Menghapus kode produk mitra (soft delete)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/PartyVersion'
      responses:
        '204':
          description: Kode dihapus
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/suppliers:
    get:
      operationId: listSuppliers
      tags:
        - party
      summary: Daftar pemasok & maklon (MD-08)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Search'
        - name: supplierType
          in: query
          schema:
            $ref: '#/components/schemas/SupplierType'
      responses:
        '200':
          description: Daftar pemasok; field sort yang diizinkan `code`, `name`, `createdAt`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createSupplier
      tags:
        - party
      summary: Membuat pemasok atau maklon
      description: Kode unik permanen (`DUPLICATE_CODE`). NPWP dan nomor rekening dienkripsi (NFR-04).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierInput'
      responses:
        '201':
          description: Pemasok dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/suppliers/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getSupplier
      tags:
        - party
      summary: Detail pemasok; NPWP dan rekening ditampilkan tersamar
      responses:
        '200':
          description: Pemasok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updateSupplier
      tags:
        - party
      summary: Mengubah pemasok
      description: |
        Kode tidak bisa diubah. `npwp` tidak dikirim = tidak berubah. Rekening dengan `id` tanpa `accountNumber`
        mempertahankan nomor lama; rekening yang tidak dikirim dihapus.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SupplierInput'
                - $ref: '#/components/schemas/VersionInput'
      responses:
        '200':
          description: Pemasok diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteSupplier
      tags:
        - party
      summary: Menghapus pemasok (soft delete)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/PartyVersion'
      responses:
        '204':
          description: Pemasok dihapus
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/party/user-options:
    get:
      operationId: listPartyUserOptions
      tags:
        - party
      summary: Pengguna aktif untuk dipilih sebagai Sales atau Merchandiser mitra
      parameters:
        - $ref: '#/components/parameters/Search'
        - name: role
          in: query
          description: Batasi ke pemegang role, mis. `merchandiser` atau `sales_mt`.
          schema:
            type: string
      responses:
        '200':
          description: Maksimal 20 pengguna
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PartyUserOption'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/employees:
    get:
      operationId: listEmployees
      tags:
        - hris
      summary: Data karyawan dasar (HR-01)
      description: |
        `q` mencari nomor karyawan atau nama. `nik` mencari persis lewat hash HMAC (NIK tidak pernah dicari
        sebagai teks, Technical Guideline 6.7).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Search'
        - name: nik
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/EmploymentStatus'
      responses:
        '200':
          description: Daftar karyawan; field sort yang diizinkan `employeeNumber`, `fullName`, `joinDate`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createEmployee
      tags:
        - hris
      summary: Menambah karyawan
      description: Nomor karyawan unik permanen (`DUPLICATE_CODE`); NIK dienkripsi AES-256-GCM.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeInput'
      responses:
        '201':
          description: Karyawan dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/employees/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getEmployee
      tags:
        - hris
      summary: Detail karyawan; NIK ditampilkan tersamar
      responses:
        '200':
          description: Karyawan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updateEmployee
      tags:
        - hris
      summary: Mengubah data karyawan
      description: Nomor karyawan tidak bisa diubah. `nik` tidak dikirim = tidak berubah; string kosong = dihapus.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/EmployeeInput'
                - $ref: '#/components/schemas/VersionInput'
      responses:
        '200':
          description: Karyawan diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/employees/{id}/resign:
    post:
      operationId: resignEmployee
      tags:
        - hris
      summary: Mencatat resign karyawan
      description: |
        Mulai tanggal resign karyawan tidak lagi aktif; pelanggan yang tertaut otomatis kehilangan harga karyawan
        (HR-03). Tanggal boleh di masa depan (resign terjadwal).
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeResignInput'
      responses:
        '200':
          description: Resign tercatat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/employee-options:
    get:
      operationId: listEmployeeOptions
      tags:
        - hris
      summary: Pilihan karyawan untuk ditautkan ke pelanggan
      description: |
        Hanya nomor, nama, dan status (tanpa data pribadi). Terbuka untuk `hris.employee.read` atau
        `party.customer.write` (CS menautkan pelanggan ke karyawan).
      parameters:
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Maksimal 20 karyawan aktif
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmployeeOption'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/files:
    post:
      operationId: createFileUpload
      tags:
        - filestore
      summary: Meminta URL upload file (Technical Guideline 5.16)
      description: |
        Backend memeriksa permission tulis pemilik (`ownerType`), ukuran, dan tipe file lalu mengembalikan URL
        upload bertanda tangan yang berlaku 15 menit. Browser mengirim isi file dengan `PUT uploadUrl`, lalu
        mengirim `fileId` di request bisnis (mis. PKS mitra) yang memvalidasi dan menautkan file ke pemiliknya.
        Ukuran berlebih ditolak `FILE_TOO_LARGE`, tipe lain `FILE_TYPE_NOT_ALLOWED`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileUploadInput'
      responses:
        '201':
          description: URL upload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadTarget'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/files/{id}:
    get:
      operationId: getFile
      tags:
        - filestore
      summary: Metadata file
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Metadata file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileObject'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/files/{id}/download-url:
    get:
      operationId: getFileDownloadUrl
      tags:
        - filestore
      summary: URL unduhan bertanda tangan berumur 5 menit
      description: |
        File yang sudah ditautkan hanya bisa diunduh pemegang permission baca pemiliknya (mis.
        `party.partner_agreement.read`); file yang belum ditautkan hanya oleh pengunggahnya.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: URL unduhan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileDownloadTarget'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/file-content/{id}:
    put:
      operationId: putFileContent
      tags:
        - filestore
      summary: Mengunggah isi file ke URL bertanda tangan
      description: |
        Dipanggil browser dengan `uploadUrl` dari `createFileUpload`, tanpa header Authorization dan tanpa
        Idempotency-Key (setara presigned PUT object storage). Ukuran harus sama dengan yang dideklarasikan dan
        isi file harus sesuai tipenya.
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/FileExpires'
        - $ref: '#/components/parameters/FileSignature'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: File tersimpan
        default:
          $ref: '#/components/responses/Problem'
    get:
      operationId: getFileContent
      tags:
        - filestore
      summary: Mengunduh isi file dengan URL bertanda tangan
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/FileExpires'
        - $ref: '#/components/parameters/FileSignature'
      responses:
        '200':
          description: Isi file dengan Content-Type aslinya
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/price-lists:
    get:
      operationId: listPriceLists
      tags:
        - pricing
      summary: Data Master › Daftar Harga
      description: |
        Butuh `pricing.price_list.read` (atau `pricing.price_list.approve` untuk approver). Harga Dasar & HET selalu
        paling atas. `deleted=true` hanya menampilkan daftar harga terhapus (untuk dipulihkan Admin Sistem).
      parameters:
        - $ref: '#/components/parameters/Search'
        - name: priceListType
          in: query
          schema:
            $ref: '#/components/schemas/PriceListType'
        - name: includeInactive
          in: query
          schema:
            type: boolean
            default: false
        - name: deleted
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Daftar harga beserta versi yang berlaku, versi terjadwal, dan versi yang sedang disiapkan
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PriceList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createPriceList
      tags:
        - pricing
      summary: Menambah daftar harga
      description: Harga diisi lewat versi yang diajukan untuk approval (Head Sales → Head Finance & Accounting).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceListInput'
      responses:
        '201':
          description: Daftar harga dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceListDetail'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/price-lists/options:
    get:
      operationId: listPriceListOptions
      tags:
        - pricing
      summary: Pilihan daftar harga aktif (acuan persentase, harga bertingkat)
      responses:
        '200':
          description: Daftar harga aktif yang belum dihapus
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PriceListOption'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/price-lists/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getPriceList
      tags:
        - pricing
      summary: Detail daftar harga dan riwayat versi
      responses:
        '200':
          description: Daftar harga
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceListDetail'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updatePriceList
      tags:
        - pricing
      summary: Mengubah header daftar harga (kode dan jenis tetap)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceListUpdate'
      responses:
        '200':
          description: Daftar harga diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceListDetail'
