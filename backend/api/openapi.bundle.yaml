      description: |
        File diunggah lewat `/api/v1/files` dengan `ownerType=sales.consignment_partner_report` (laporan mitra) atau
        `sales.consignment_ba` (BA bertanda tangan). Ditanggung oleh dihitung dari ketentuan selisih PKS.
