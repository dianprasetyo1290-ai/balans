      description: |
        Bahan: barang retur (Produk Jadi dari lokasi Retur) dan packaging baru (dari lokasi RM); tepat satu baris hasil FG
        dengan batch baru di lokasi FG Non-Ecommerce. Permission `inventory.repacking.write`.
