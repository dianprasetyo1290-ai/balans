openapi: 3.0.3
info:
  title: Balans Platform API
  version: 0.0.0
  description: |
    Kontrak API back-office Balans. File ini adalah sumber kebenaran (Technical Guideline 8.1).
    Server Go dan client TypeScript digenerate dari spec ini. Path dipecah per modul di folder paths/.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: system
    description: Kesehatan proses dan informasi sistem
  - name: sales
    description: Penjualan (Sales Order semua channel, Proforma, Invoice NON-PKP, piutang & pembayaran pelanggan), alasan retur, webhook payment gateway (R1.3)
  - name: logistics
    description: Pengiriman, termasuk webhook kurir
  - name: identity
    description: Sesi, pengguna, dan permission (R1.1)
  - name: audit
    description: Riwayat perubahan (audit trail)
  - name: approval
    description: Engine & inbox persetujuan (R1.1)
  - name: notification
    description: Notifikasi in-app (R1.1)
  - name: catalog
    description: Master produk, packaging, material, bundling (R1.1)
  - name: warehouse
    description: Gudang dan lokasi stok (R1.1); Inbound/QC, Transfer Stok, Petty Stock, Stock Count (R1.2)
  - name: inventory
    description: Ledger stok, batch, HPP FIFO, saran FEFO (R1.2)
  - name: accounting
    description: COA, dimensi, jenis biaya, periode, posting rule, Jurnal Umum, Buku Besar (R1.1); aset tetap, Neraca Saldo, tutup buku, saldo awal (R1.4)
  - name: document
    description: Penomoran dokumen (R1.1)
  - name: party
    description: Pelanggan, mitra & PKS, kode produk mitra, pemasok & maklon (R1.1)
  - name: hris
    description: Data karyawan dasar (R1.1)
  - name: procurement
    description: Purchase Request, Purchase Order (barang, maklon, reprocess), uang muka, Penerimaan Barang, Tagihan Pemasok, Retur Pembelian, Barang Diterima Belum Ditagih (R1.2)
  - name: filestore
    description: Upload dan unduhan file bertanda tangan (R1.1)
  - name: pricing
    description: Daftar harga & versi, harga khusus, promo, harga bertingkat, batas diskon, resolver harga (R1.1)
  - name: dataexchange
    description: Impor/ekspor Excel master data (R1.1)
paths:
  /healthz:
    get:
      operationId: getHealth
      security: []
      tags:
        - system
      summary: Proses hidup
      responses:
        '200':
          description: Proses berjalan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /readyz:
    get:
      operationId: getReadiness
      security: []
      tags:
        - system
      summary: Siap menerima trafik (DB terhubung dan migrasi terbaru)
      responses:
        '200':
          description: Siap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
        '503':
          description: Belum siap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
  /api/v1/system/info:
    get:
      operationId: getSystemInfo
      security: []
      tags:
        - system
      summary: Informasi versi, lingkungan, dan modul aktif
      description: Dipakai halaman Tentang Sistem dan untuk menentukan menu modul yang tampil (Technical Guideline 14.5).
      responses:
        '200':
          description: Informasi sistem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
        '500':
          description: Kesalahan sistem
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/webhooks/midtrans:
    post:
      operationId: receiveMidtransWebhook
      security: []
      tags:
        - sales
      summary: Notifikasi pembayaran Midtrans
      description: |
        Signature diverifikasi sebelum payload disimpan. Event disimpan di webhook_events (dedup per event)
        dan diproses job payment_webhook.process yang mengonfirmasi ulang status ke Midtrans
        (Technical Guideline 7.4, 9.3). Endpoint ini tidak memakai Idempotency-Key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MidtransNotification'
      responses:
        '200':
          description: Event diterima atau sudah pernah diterima
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAck'
        '400':
          description: Payload tidak bisa dibaca
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Signature tidak valid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/return-reasons:
    get:
      operationId: listReturnReasons
      tags:
        - sales
      summary: Data Master › Alasan Retur
      description: |
        Butuh `sales.return_reason.read`, `sales.sales_return.read`, atau `procurement.purchase_return.read`
        (dropdown dokumen retur). Filter `appliesTo` mengembalikan alasan untuk jenis itu dan alasan `both`.
      parameters:
        - name: includeInactive
          in: query
          schema:
            type: boolean
            default: false
        - name: appliesTo
          in: query
          schema:
            $ref: '#/components/schemas/ReturnReasonScope'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Alasan retur urut kode
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReturnReason'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createReturnReason
      tags:
        - sales
      summary: Menambah alasan retur
      description: Kode unik permanen.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnReasonInput'
      responses:
        '201':
          description: Alasan retur dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnReason'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/return-reasons/{id}:
    put:
      operationId: updateReturnReason
      tags:
        - sales
      summary: Mengubah alasan retur (kode tetap)
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnReasonUpdate'
      responses:
        '200':
          description: Alasan retur diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnReason'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteReturnReason
      tags:
        - sales
      summary: Menghapus (soft delete) alasan retur
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: version
          in: query
          required: true
          description: Versi terakhir yang dilihat user (optimistic locking).
          schema:
            type: integer
      responses:
        '204':
          description: Alasan retur dihapus
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/sales/orders:
    get:
      operationId: listSalesOrders
      tags:
        - sales
      summary: Daftar Sales Order semua channel (Sales Order, Modern Trade, Penjualan Marketplace, WA/IG, Karyawan)
      description: |
        Hanya jenis pesanan yang boleh dilihat user: marketplace butuh `sales.marketplace_order.read`, jenis lain
        `sales.sales_order.read`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Search'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/SalesDocumentStatus'
        - name: orderType
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/SalesOrderType'
        - name: channelId
          in: query
          schema:
            type: string
            format: uuid
        - name: subChannelId
          in: query
          schema:
            type: string
            format: uuid
        - name: dateFrom
          in: query
          schema:
            $ref: '#/components/schemas/BusinessDate'
        - name: dateTo
          in: query
          schema:
            $ref: '#/components/schemas/BusinessDate'
      responses:
        '200':
          description: Pesanan terbaru lebih dulu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createSalesOrder
      tags:
        - sales
      summary: Menyimpan draft Sales Order, atau mencatat penjualan marketplace (S-301, S-306, S-307, S-308)
      description: |
        Harga satuan diambil resolver harga (harga khusus → promo → bertingkat → daftar harga channel/mitra/karyawan
        → Harga Dasar) pada tanggal pesanan; aturan & versi disimpan per baris. Diskon manual per baris/dokumen
        (persen atau nominal). NON-PKP: tanpa PPN. Marketplace (`orderType=marketplace`) langsung tercatat Diproses
        dengan E-commerce Stock dialokasikan; nomor order marketplace unik per marketplace; harga baris boleh diisi
        dari marketplace (`unitPrice`).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesOrderInput'
      responses:
        '201':
          description: Pesanan dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrder'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/sales/orders/{id}:
    get:
      operationId: getSalesOrder
      tags:
        - sales
      summary: Detail Sales Order beserta alokasi batch, Proforma, invoice, dan pengiriman
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Sales Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrder'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updateSalesOrder
      tags:
        - sales
      summary: Mengubah draft Sales Order (jenis pesanan tetap; harga dihitung ulang)
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesOrderUpdate'
      responses:
        '200':
          description: Draft diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrder'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/sales/orders/{id}/confirm:
    post:
      operationId: confirmSalesOrder
      tags:
        - sales
      summary: Konfirmasi Sales Order
      description: |
        Harga dihitung ulang, nomor `SO/TAHUN/BULAN/NOMOR` diberikan, stok dialokasikan FEFO dari lokasi asal
        (bundel dipecah ke komponen). Diskon di atas batas role → Menunggu Persetujuan (`sales_order_discount`, Head
        Sales). Selain itu: prepaid → Proforma Invoice terbit (Menunggu Pembayaran); tempo → invoice terbit dan
        jurnal A-05 (Diproses).
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionInput'
      responses:
        '200':
          description: Pesanan dikonfirmasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrder'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/sales/orders/{id}/cancel:
    post:
      operationId: cancelSalesOrder
      tags:
        - sales
      summary: Batalkan Sales Order yang belum dikirim
      description: |
        Alasan wajib selain draft. Approval diskon dibatalkan, alokasi stok dilepas, Proforma dibatalkan, invoice
        tempo tanpa pembayaran dibatalkan dengan jurnal balik A-05.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesCancelInput'
      responses:
        '200':
          description: Pesanan dibatalkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrder'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/sales/orders/{id}/payment-proof:
    post:
      operationId: uploadSalesOrderPaymentProof
      tags:
        - sales
      summary: Unggah bukti bayar pelanggan (pesanan Menunggu Pembayaran)
      description: |
        File diunggah dulu lewat `/api/v1/files` dengan `ownerType=sales.payment_proof` (JPG/PNG/WebP/PDF), lalu
        ditautkan ke pesanan. F&A mengonfirmasi pembayaran di Proforma Invoice.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesPaymentProofInput'
      responses:
        '200':
          description: Bukti bayar tercatat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrder'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/sales/channel-options:
    get:
      operationId: listSalesChannelOptions
      tags:
        - sales
      summary: Channel & sub-channel aktif untuk form pesanan
      responses:
        '200':
          description: Channel dan sub-channel
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SalesChannelOption'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/sales/location-options:
    get:
      operationId: listSalesLocationOptions
      tags:
        - sales
      summary: Lokasi asal stok yang boleh dipakai jenis pesanan
      parameters:
        - name: orderType
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/SalesOrderType'
      responses:
        '200':
          description: Lokasi aktif
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SalesLocationRef'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/sales/cash-bank-accounts:
    get:
      operationId: listSalesCashBankAccounts
      tags:
        - sales
      summary: Akun Kas & Bank (11xx) untuk konfirmasi pembayaran
      responses:
        '200':
          description: Akun Kas & Bank aktif
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SalesAccountOption'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/sales/proforma-invoices:
    get:
      operationId: listProformaInvoices
      tags:
        - sales
      summary: Daftar Proforma Invoice
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/SalesDocumentStatus'
      responses:
        '200':
          description: PI terbaru lebih dulu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProformaInvoiceList'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/sales/proforma-invoices/{id}:
    get:
      operationId: getProformaInvoice
      tags:
        - sales
      summary: Detail Proforma Invoice beserta Sales Order (cetak PI)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Proforma Invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProformaInvoiceDetail'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/sales/proforma-invoices/{id}/confirm-payment:
    post:
      operationId: confirmProformaPayment
      tags:
        - sales
      summary: Konfirmasi pembayaran Proforma Invoice (F&A)
      description: |
        Invoice final `INV/…` terbit Lunas dengan jurnal A-05, pembayaran `BYR/…` tercatat dan dialokasikan ke
        invoice (A-PB: Dr Kas/Bank, Cr Piutang Usaha), Sales Order menjadi Diproses (siap dikirim). PI yang lewat
        masa berlaku ditolak.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProformaPaymentInput'
      responses:
        '200':
          description: PI Lunas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProformaInvoiceDetail'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/sales/invoices:
    get:
      operationId: listSalesInvoices
      tags:
        - sales
      summary: Daftar invoice (Penjualan › Invoice, Keuangan & Akuntansi › Piutang Usaha)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Search'
        - name: status
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/SalesDocumentStatus'
        - name: partyType
          in: query
          schema:
            $ref: '#/components/schemas/SalesPartyType'
        - name: partyId
          in: query
          schema:
            type: string
            format: uuid
        - name: dateFrom
          in: query
          schema:
            $ref: '#/components/schemas/BusinessDate'
        - name: dateTo
          in: query
          schema:
            $ref: '#/components/schemas/BusinessDate'
        - name: overdue
          in: query
          description: Hanya invoice terbuka yang lewat jatuh tempo hari ini.
          schema:
            type: boolean
      responses:
        '200':
          description: Invoice terbaru lebih dulu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesInvoiceList'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/sales/invoices/{id}:
    get:
      operationId: getSalesInvoice
      tags:
        - sales
      summary: Detail invoice beserta riwayat pembayaran (cetak invoice NON-PKP)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesInvoice'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/sales/invoices/{id}/share-text:
    get:
      operationId: getSalesInvoiceShareText
      tags:
        - sales
      summary: Teks invoice siap tempel ke WhatsApp
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Teks invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesShareText'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/sales/customer-payments:
    get:
      operationId: listCustomerPayments
      tags:
        - sales
      summary: Daftar pembayaran pelanggan (Piutang Usaha)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/SalesDocumentStatus'
        - name: partyType
          in: query
          schema:
            $ref: '#/components/schemas/SalesPartyType'
        - name: partyId
          in: query
          schema:
            type: string
            format: uuid
        - name: dateFrom
          in: query
          schema:
            $ref: '#/components/schemas/BusinessDate'
        - name: dateTo
          in: query
          schema:
            $ref: '#/components/schemas/BusinessDate'
      responses:
        '200':
          description: Pembayaran terbaru lebih dulu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPaymentList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createCustomerPayment
      tags:
        - sales
      summary: Catat pembayaran pelanggan (alokasi ke satu atau banyak invoice) ★
      description: |
        Pembayaran sebagian diperbolehkan; jumlah alokasi harus sama dengan nominal pembayaran. Nomor `BYR/…` dan
        jurnal A-PB (Dr akun Kas & Bank, Cr Piutang Usaha 1201, pihak = pelanggan/mitra). Butuh
        `accounting.payment.post` dan re-autentikasi 5 menit.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerPaymentInput'
      responses:
        '201':
          description: Pembayaran diposting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPayment'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/sales/customer-payments/{id}:
    get:
      operationId: getCustomerPayment
      tags:
        - sales
      summary: Detail pembayaran pelanggan
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Pembayaran
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPayment'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/sales/customer-payments/{id}/cancel:
    post:
      operationId: cancelCustomerPayment
      tags:
        - sales
      summary: Batalkan pembayaran pelanggan ★ (jurnal A-PB dibalik, piutang invoice dikembalikan)
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesCancelInput'
      responses:
        '200':
          description: Pembayaran dibatalkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPayment'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/sales/receivable-aging:
    get:
      operationId: getReceivableAging
      tags:
        - sales
      summary: Laporan Piutang — umur piutang per pelanggan/mitra
      parameters:
        - name: asOf
          in: query
          description: Tanggal posisi (default hari ini).
          schema:
            $ref: '#/components/schemas/BusinessDate'
        - name: partyType
          in: query
          schema:
            $ref: '#/components/schemas/SalesPartyType'
      responses:
        '200':
          description: Umur piutang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceivableAgingReport'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/sales/consignment-deliveries:
    get:
      operationId: listConsignmentDeliveries
      tags:
        - sales
      summary: Daftar pengiriman konsinyasi & buffer vending (Penjualan › Konsinyasi, S-303)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - name: status
          in: query
          schema:
