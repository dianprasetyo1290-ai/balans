              $ref: '#/components/schemas/VersionInput'
      responses:
        '200':
          description: Aksi dijalankan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Repacking'
        default:
          $ref: '#/components/responses/Problem'
