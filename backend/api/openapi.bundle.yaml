        - name: locationId
          in: query
          description: Bisa lebih dari satu.
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: batchId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Bisa lebih dari satu.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/StockStatus'
      responses:
        '200':
          description: Saldo stok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockBalanceList'
