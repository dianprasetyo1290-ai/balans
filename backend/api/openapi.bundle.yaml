openapi: 3.0.3
info:
  title: Balans Platform API
  version: 0.0.0
  description: |
    Kontrak API back-office Balans. File ini adalah sumber kebenaran (Technical Guideline 8.1).
    Server Go dan client TypeScript digenerate dari spec ini. Path dipecah per modul di folder paths/.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: system
    description: Kesehatan proses dan informasi sistem
  - name: sales
    description: Penjualan, termasuk webhook payment gateway
  - name: logistics
    description: Pengiriman, termasuk webhook kurir
  - name: identity
    description: Sesi, pengguna, dan permission (R1.1)
  - name: catalog
    description: Master produk, packaging, material, bundling (R1.1)
  - name: warehouse
    description: Gudang dan lokasi stok (R1.1)
paths:
  /healthz:
    get:
      operationId: getHealth
      security: []
      tags:
        - system
      summary: Proses hidup
      responses:
        '200':
          description: Proses berjalan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /readyz:
    get:
      operationId: getReadiness
      security: []
      tags:
        - system
      summary: Siap menerima trafik (DB terhubung dan migrasi terbaru)
      responses:
        '200':
          description: Siap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
        '503':
          description: Belum siap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
  /api/v1/system/info:
    get:
      operationId: getSystemInfo
      security: []
      tags:
        - system
      summary: Informasi versi, lingkungan, dan modul aktif
      description: Dipakai halaman Tentang Sistem dan untuk menentukan menu modul yang tampil (Technical Guideline 14.5).
      responses:
        '200':
          description: Informasi sistem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
        '500':
          description: Kesalahan sistem
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/webhooks/midtrans:
    post:
      operationId: receiveMidtransWebhook
      security: []
      tags:
        - sales
      summary: Notifikasi pembayaran Midtrans
      description: |
        Signature diverifikasi sebelum payload disimpan. Event disimpan di webhook_events (dedup per event)
        dan diproses job payment_webhook.process yang mengonfirmasi ulang status ke Midtrans
        (Technical Guideline 7.4, 9.3). Endpoint ini tidak memakai Idempotency-Key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MidtransNotification'
      responses:
        '200':
          description: Event diterima atau sudah pernah diterima
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAck'
        '400':
          description: Payload tidak bisa dibaca
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Signature tidak valid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/webhooks/biteship:
    post:
      operationId: receiveBiteshipWebhook
      security: []
      tags:
        - logistics
      summary: Notifikasi status pengiriman Biteship
      description: |
        Signature di header X-Biteship-Signature diverifikasi sebelum payload disimpan. Event diproses job
        shipment_webhook.process yang mengonfirmasi ulang status ke Biteship. Endpoint ini tidak memakai Idempotency-Key.
      parameters:
        - name: X-Biteship-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BiteshipNotification'
      responses:
        '200':
          description: Event diterima atau sudah pernah diterima
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAck'
        '400':
          description: Payload tidak bisa dibaca
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Signature tidak valid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/login:
    post:
      operationId: login
      security: []
      tags:
        - identity
      summary: Masuk dengan email dan password
      description: |
        Mengembalikan access token (15 menit, disimpan di memori FE) dan memasang refresh token di cookie
        HttpOnly `Path=/api/v1/auth` (Technical Guideline 9.1). Gagal login selalu `AUTH_INVALID_CREDENTIALS`;
        5 kali gagal dalam 15 menit → `AUTH_ACCOUNT_LOCKED`. Role ber-MFA → `AUTH_MFA_REQUIRED` lalu kirim ulang dengan `totpCode`.
        Tidak memakai Idempotency-Key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Berhasil masuk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      security: []
      tags:
        - identity
      summary: Memperbarui access token dengan refresh token (rotasi)
      description: Refresh token lama langsung tidak berlaku. Pemakaian ulang token lama mencabut seluruh keluarga sesi.
      responses:
        '200':
          description: Access token baru
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags:
        - identity
      summary: Keluar dan mencabut sesi aktif
      responses:
        '204':
          description: Sesi dicabut
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/me:
    get:
      operationId: getCurrentUser
      tags:
        - identity
      summary: User yang sedang login beserta permission
      description: Permission dimuat server-side dan tidak disimpan di token (Technical Guideline 9.1).
      responses:
        '200':
          description: Data user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/users:
    get:
      operationId: listUsers
      tags:
        - identity
      summary: Daftar pengguna
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Daftar pengguna
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createUser
      tags:
        - identity
      summary: Membuat pengguna dan mengirim undangan atur password
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '201':
          description: Pengguna dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/products:
    get:
      operationId: listProducts
      tags:
        - catalog
      summary: Daftar produk (Produk Jadi, Packaging, Material)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Search'
        - name: productType
          in: query
          schema:
            $ref: '#/components/schemas/ProductType'
        - name: isBundle
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Daftar produk; field sort yang diizinkan `sku`, `name`, `createdAt`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createProduct
      tags:
        - catalog
      summary: Membuat produk (MD-01, MD-02, MD-03)
      description: SKU unik permanen dan tidak bisa dipakai ulang walau produk dihapus (`DUPLICATE_CODE`).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Produk dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/products/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getProduct
      tags:
        - catalog
      summary: Detail produk
      responses:
        '200':
          description: Detail produk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updateProduct
      tags:
        - catalog
      summary: Mengubah produk (optimistic locking dengan `version`)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ProductInput'
                - type: object
                  required:
                    - version
                  properties:
                    version:
                      type: integer
      responses:
        '200':
          description: Produk diubah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteProduct
      tags:
        - catalog
      summary: Menghapus produk (soft delete; tetap tampil di dokumen lama)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Produk dihapus
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/warehouses:
    get:
      operationId: listWarehouses
      tags:
        - warehouse
      summary: Daftar gudang fisik
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Daftar gudang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarehouseList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createWarehouse
      tags:
        - warehouse
      summary: Membuat gudang fisik beserta lokasi standarnya (WMS-01)
      description: Lokasi Inbound, FG Non-Ecommerce, E-commerce Stock, Gudang Material, dan Gudang Retur dibuat otomatis (U-08).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarehouseInput'
      responses:
        '201':
          description: Gudang dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Warehouse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/locations:
    get:
      operationId: listLocations
      tags:
        - warehouse
      summary: Daftar lokasi stok (internal dan eksternal)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - name: warehouseId
          in: query
          schema:
            type: string
            format: uuid
        - name: locationType
          in: query
          schema:
            $ref: '#/components/schemas/LocationType'
      responses:
        '200':
          description: Daftar lokasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createLocation
      tags:
        - warehouse
      summary: Membuat lokasi (termasuk lokasi eksternal maklon, konsinyasi, buffer vending, mesin)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationInput'
      responses:
        '201':
          description: Lokasi dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token EdDSA 15 menit (Technical Guideline 9.1).
  schemas:
    Problem:
      type: object
      description: Format error RFC 7807 (Technical Guideline 8.3). Field code adalah kontrak stabil untuk FE.
      required:
        - type
        - title
        - status
        - code
        - detail
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          $ref: '#/components/schemas/ErrorCode'
        detail:
          type: string
          description: Pesan Bahasa Indonesia yang aman ditampilkan ke user.
        fields:
          type: object
          additionalProperties:
            type: string
        requestId:
          type: string
    ErrorCode:
      type: string
      description: Katalog kode error (Technical Guideline Lampiran A).
      enum:
        - VALIDATION_FAILED
        - AUTH_INVALID_CREDENTIALS
        - AUTH_ACCOUNT_LOCKED
        - AUTH_MFA_REQUIRED
        - AUTH_MFA_INVALID
        - AUTH_TOKEN_EXPIRED
        - AUTH_SESSION_EXPIRED
        - AUTH_REAUTH_REQUIRED
        - FORBIDDEN
        - NOT_FOUND
        - VERSION_CONFLICT
        - INVALID_STATE_TRANSITION
        - IDEMPOTENCY_KEY_REQUIRED
        - IDEMPOTENCY_IN_PROGRESS
        - IDEMPOTENCY_KEY_REUSED
        - DUPLICATE_CODE
        - PERIOD_LOCKED
        - STOCK_INSUFFICIENT
        - BATCH_SHELF_LIFE_TOO_SHORT
        - APPROVAL_REQUIRED
        - DISCOUNT_LIMIT_EXCEEDED
        - CREDIT_LIMIT_EXCEEDED
        - THREE_WAY_MATCH_FAILED
        - DEPOSIT_INSUFFICIENT
        - OUTSIDE_ATTENDANCE_RADIUS
        - FILE_TOO_LARGE
        - FILE_TYPE_NOT_ALLOWED
        - IMPORT_ALREADY_PROCESSED
        - RATE_LIMITED
        - PROVIDER_UNAVAILABLE
        - BAD_REQUEST
        - INTERNAL_ERROR
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    ReadinessCheck:
      type: object
      required:
        - name
        - status
      properties:
        name:
          type: string
          example: database
        status:
          type: string
          enum:
            - ok
            - failed
        detail:
          type: string
    ReadinessStatus:
      type: object
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum:
            - ready
            - not_ready
        checks:
          type: array
          items:
            $ref: '#/components/schemas/ReadinessCheck'
    DatabaseInfo:
      type: object
      required:
        - status
        - schemaVersion
        - latestSchemaVersion
      properties:
        status:
          type: string
          enum:
            - ok
            - failed
        schemaVersion:
          type: integer
          format: int64
        latestSchemaVersion:
          type: integer
          format: int64
    SystemInfo:
      type: object
      required:
        - version
        - commit
        - environment
        - enabledModules
        - mockActive
        - serverTime
        - database
      properties:
        version:
          type: string
          example: v1.0.0
        commit:
          type: string
        environment:
          type: string
          enum:
            - local
            - staging
            - production
        enabledModules:
          type: array
          items:
            type: string
        mockActive:
          type: boolean
          description: True jika minimal satu adapter pihak ketiga memakai mock.
        serverTime:
          type: string
          format: date-time
        database:
          $ref: '#/components/schemas/DatabaseInfo'
    MidtransNotification:
      type: object
      description: Payload HTTP notification Midtrans (nama field milik Midtrans).
      required:
        - order_id
        - status_code
        - gross_amount
        - signature_key
        - transaction_status
        - transaction_id
      properties:
        order_id:
          type: string
        status_code:
          type: string
        gross_amount:
          type: string
        signature_key:
          type: string
        transaction_status:
          type: string
        transaction_id:
          type: string
        fraud_status:
          type: string
    WebhookAck:
      type: object
      required:
        - received
        - duplicate
      properties:
        received:
          type: boolean
        duplicate:
          type: boolean
    BiteshipNotification:
      type: object
      description: Payload webhook status order Biteship (nama field milik Biteship).
      required:
        - event
        - order_id
        - status
      properties:
        event:
          type: string
          example: order.status
        order_id:
          type: string
        courier_waybill_id:
          type: string
        status:
          type: string
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
        totpCode:
          type: string
          pattern: ^[0-9]{6}$
    AccessToken:
      type: object
      required:
        - accessToken
        - expiresAt
      properties:
        accessToken:
          type: string
        expiresAt:
          type: string
          format: date-time
    CurrentUser:
      type: object
      required:
        - id
        - email
        - fullName
        - roles
        - permissions
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        fullName:
          type: string
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
          example:
            - catalog.product.read
            - catalog.product.write
    Pagination:
      type: object
      description: Metadata pagination standar (Technical Guideline 8.2).
      required:
        - page
        - pageSize
        - totalItems
        - totalPages
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 200
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
    UserInput:
      type: object
      required:
        - email
        - fullName
        - roleCodes
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        fullName:
          type: string
          minLength: 1
          maxLength: 120
        roleCodes:
          type: array
          minItems: 1
          items:
            type: string
        divisionId:
          type: string
          format: uuid
    AuditFields:
      type: object
      required:
        - createdAt
        - updatedAt
        - version
      properties:
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          description: Dipakai optimistic locking; kirim kembali saat update (Technical Guideline 7.2).
    User:
      allOf:
        - $ref: '#/components/schemas/UserInput'
        - $ref: '#/components/schemas/AuditFields'
        - type: object
          required:
            - id
            - isActive
            - isMfaEnabled
          properties:
            id:
              type: string
              format: uuid
            isActive:
              type: boolean
            isMfaEnabled:
              type: boolean
            lastLoginAt:
              type: string
              format: date-time
    UserList:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/User'
    ProductType:
      type: string
      enum:
        - finished_good
        - packaging
        - reprocess_material
    PackagingType:
      type: string
      enum:
        - tube
        - pouch
        - roll_sachet
    BundleComponent:
      type: object
      required:
        - componentProductId
        - qty
      properties:
        componentProductId:
          type: string
          format: uuid
        componentSku:
          type: string
          readOnly: true
        qty:
          type: string
          description: Kuantitas desimal sebagai string.
          example: '2.000'
    ProductInput:
      type: object
      required:
        - sku
        - name
        - productType
        - uom
        - hasBatch
        - isBundle
      properties:
        sku:
          type: string
          minLength: 1
          maxLength: 40
          pattern: ^[A-Z0-9][A-Z0-9-]*$
        name:
          type: string
          minLength: 1
          maxLength: 160
        variant:
          type: string
          maxLength: 80
        productType:
          $ref: '#/components/schemas/ProductType'
        packagingType:
          $ref: '#/components/schemas/PackagingType'
        uom:
          type: string
          example: pcs
        shelfLifeDays:
          type: integer
          minimum: 1
        hasBatch:
          type: boolean
        isBundle:
          type: boolean
          description: Bundle virtual tidak punya stok sendiri; stok komponen terpotong saat terjual (MD-03).
        categoryId:
          type: string
          format: uuid
        barcodes:
          type: array
          items:
            type: string
        minStockQty:
          type: string
          example: '100.000'
        bundleComponents:
          type: array
          items:
            $ref: '#/components/schemas/BundleComponent'
    Product:
      allOf:
        - $ref: '#/components/schemas/ProductInput'
        - $ref: '#/components/schemas/AuditFields'
        - type: object
          required:
            - id
            - isActive
            - allowedActions
          properties:
            id:
              type: string
              format: uuid
            isActive:
              type: boolean
            allowedActions:
              type: array
              items:
                type: string
                enum:
                  - update
                  - delete
    ProductList:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Product'
    WarehouseInput:
      type: object
      required:
        - code
        - name
        - address
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 20
        name:
          type: string
          minLength: 1
          maxLength: 120
        address:
          type: string
          maxLength: 500
    Warehouse:
      allOf:
        - $ref: '#/components/schemas/WarehouseInput'
        - $ref: '#/components/schemas/AuditFields'
        - type: object
          required:
            - id
          properties:
            id:
              type: string
              format: uuid
    WarehouseList:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Warehouse'
    LocationType:
      type: string
      enum:
        - inbound
        - finished_goods
        - ecommerce
        - material
        - returns
        - toll_manufacturer
        - consignment
        - vending_buffer
        - vending_machine
    LocationInput:
      type: object
      required:
        - code
        - name
        - locationType
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 30
        name:
          type: string
          minLength: 1
          maxLength: 120
        locationType:
          $ref: '#/components/schemas/LocationType'
        warehouseId:
          type: string
          format: uuid
          description: Wajib untuk lokasi internal; kosong untuk lokasi eksternal.
        externalPartyType:
          type: string
          enum:
            - supplier
            - partner
            - vending_machine
        externalPartyId:
          type: string
          format: uuid
    Location:
      allOf:
        - $ref: '#/components/schemas/LocationInput'
        - $ref: '#/components/schemas/AuditFields'
        - type: object
          required:
            - id
            - isSellable
            - isActive
          properties:
            id:
              type: string
              format: uuid
            isSellable:
              type: boolean
              description: Stok di lokasi ini bisa dialokasikan ke penjualan.
            isActive:
              type: boolean
    LocationList:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Location'
  responses:
    Problem:
      description: Error standar (problem+json)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Sort:
      name: sort
      in: query
      description: Daftar field dipisah koma; awalan minus untuk descending, mis. `-createdAt,sku`.
      schema:
        type: string
    Search:
      name: q
      in: query
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID per percobaan submit (Technical Guideline 7.1).
      schema:
        type: string
        format: uuid
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
