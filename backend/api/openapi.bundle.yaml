          description: Daftar pemasok; field sort yang diizinkan `code`, `name`, `createdAt`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createSupplier
      tags:
        - party
      summary: Membuat pemasok atau maklon
      description: Kode unik permanen (`DUPLICATE_CODE`). NPWP dan nomor rekening dienkripsi (NFR-04).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierInput'
      responses:
        '201':
          description: Pemasok dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/suppliers/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getSupplier
      tags:
        - party
      summary: Detail pemasok; NPWP dan rekening ditampilkan tersamar
      responses:
        '200':
          description: Pemasok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updateSupplier
      tags:
        - party
      summary: Mengubah pemasok
      description: |
        Kode tidak bisa diubah. `npwp` tidak dikirim = tidak berubah. Rekening dengan `id` tanpa `accountNumber`
        mempertahankan nomor lama; rekening yang tidak dikirim dihapus.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SupplierInput'
                - $ref: '#/components/schemas/VersionInput'
      responses:
        '200':
          description: Pemasok diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteSupplier
      tags:
        - party
      summary: Menghapus pemasok (soft delete)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/PartyVersion'
      responses:
        '204':
          description: Pemasok dihapus
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/party/user-options:
    get:
      operationId: listPartyUserOptions
      tags:
        - party
      summary: Pengguna aktif untuk dipilih sebagai Sales atau Merchandiser mitra
      parameters:
        - $ref: '#/components/parameters/Search'
        - name: role
          in: query
          description: Batasi ke pemegang role, mis. `merchandiser` atau `sales_mt`.
          schema:
            type: string
      responses:
        '200':
          description: Maksimal 20 pengguna
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PartyUserOption'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/employees:
    get:
      operationId: listEmployees
      tags:
        - hris
      summary: Data karyawan dasar (HR-01)
      description: |
        `q` mencari nomor karyawan atau nama. `nik` mencari persis lewat hash HMAC (NIK tidak pernah dicari
        sebagai teks, Technical Guideline 6.7).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Search'
        - name: nik
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/EmploymentStatus'
      responses:
        '200':
          description: Daftar karyawan; field sort yang diizinkan `employeeNumber`, `fullName`, `joinDate`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createEmployee
      tags:
        - hris
      summary: Menambah karyawan
      description: Nomor karyawan unik permanen (`DUPLICATE_CODE`); NIK dienkripsi AES-256-GCM.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeInput'
      responses:
        '201':
          description: Karyawan dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/employees/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getEmployee
      tags:
        - hris
      summary: Detail karyawan; NIK ditampilkan tersamar
      responses:
        '200':
          description: Karyawan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updateEmployee
      tags:
        - hris
      summary: Mengubah data karyawan
      description: Nomor karyawan tidak bisa diubah. `nik` tidak dikirim = tidak berubah; string kosong = dihapus.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/EmployeeInput'
                - $ref: '#/components/schemas/VersionInput'
      responses:
        '200':
          description: Karyawan diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/employees/{id}/resign:
    post:
      operationId: resignEmployee
      tags:
        - hris
      summary: Mencatat resign karyawan
      description: |
        Mulai tanggal resign karyawan tidak lagi aktif; pelanggan yang tertaut otomatis kehilangan harga karyawan
        (HR-03). Tanggal boleh di masa depan (resign terjadwal).
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeResignInput'
      responses:
        '200':
          description: Resign tercatat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/employee-options:
    get:
      operationId: listEmployeeOptions
      tags:
        - hris
      summary: Pilihan karyawan untuk ditautkan ke pelanggan
      description: |
        Hanya nomor, nama, dan status (tanpa data pribadi). Terbuka untuk `hris.employee.read` atau
        `party.customer.write` (CS menautkan pelanggan ke karyawan).
      parameters:
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Maksimal 20 karyawan aktif
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmployeeOption'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/files:
    post:
      operationId: createFileUpload
      tags:
        - filestore
      summary: Meminta URL upload file (Technical Guideline 5.16)
      description: |
        Backend memeriksa permission tulis pemilik (`ownerType`), ukuran, dan tipe file lalu mengembalikan URL
        upload bertanda tangan yang berlaku 15 menit. Browser mengirim isi file dengan `PUT uploadUrl`, lalu
        mengirim `fileId` di request bisnis (mis. PKS mitra) yang memvalidasi dan menautkan file ke pemiliknya.
        Ukuran berlebih ditolak `FILE_TOO_LARGE`, tipe lain `FILE_TYPE_NOT_ALLOWED`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileUploadInput'
      responses:
        '201':
          description: URL upload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadTarget'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/files/{id}:
    get:
      operationId: getFile
      tags:
        - filestore
      summary: Metadata file
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Metadata file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileObject'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/files/{id}/download-url:
    get:
      operationId: getFileDownloadUrl
      tags:
        - filestore
      summary: URL unduhan bertanda tangan berumur 5 menit
      description: |
        File yang sudah ditautkan hanya bisa diunduh pemegang permission baca pemiliknya (mis.
        `party.partner_agreement.read`); file yang belum ditautkan hanya oleh pengunggahnya.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: URL unduhan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileDownloadTarget'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/file-content/{id}:
    put:
      operationId: putFileContent
      tags:
        - filestore
      summary: Mengunggah isi file ke URL bertanda tangan
      description: |
        Dipanggil browser dengan `uploadUrl` dari `createFileUpload`, tanpa header Authorization dan tanpa
        Idempotency-Key (setara presigned PUT object storage). Ukuran harus sama dengan yang dideklarasikan dan
        isi file harus sesuai tipenya.
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/FileExpires'
        - $ref: '#/components/parameters/FileSignature'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: File tersimpan
        default:
          $ref: '#/components/responses/Problem'
    get:
      operationId: getFileContent
      tags:
        - filestore
      summary: Mengunduh isi file dengan URL bertanda tangan
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/FileExpires'
        - $ref: '#/components/parameters/FileSignature'
      responses:
        '200':
          description: Isi file dengan Content-Type aslinya
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/price-lists:
    get:
      operationId: listPriceLists
      tags:
        - pricing
      summary: Data Master › Daftar Harga
      description: |
        Butuh `pricing.price_list.read` (atau `pricing.price_list.approve` untuk approver). Harga Dasar & HET selalu
        paling atas. `deleted=true` hanya menampilkan daftar harga terhapus (untuk dipulihkan Admin Sistem).
      parameters:
        - $ref: '#/components/parameters/Search'
        - name: priceListType
          in: query
          schema:
            $ref: '#/components/schemas/PriceListType'
        - name: includeInactive
          in: query
          schema:
            type: boolean
            default: false
        - name: deleted
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Daftar harga beserta versi yang berlaku, versi terjadwal, dan versi yang sedang disiapkan
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PriceList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createPriceList
      tags:
        - pricing
      summary: Menambah daftar harga
      description: Harga diisi lewat versi yang diajukan untuk approval (Head Sales → Head Finance & Accounting).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceListInput'
      responses:
        '201':
          description: Daftar harga dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceListDetail'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/price-lists/options:
    get:
      operationId: listPriceListOptions
      tags:
        - pricing
      summary: Pilihan daftar harga aktif (acuan persentase, harga bertingkat)
      responses:
        '200':
          description: Daftar harga aktif yang belum dihapus
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PriceListOption'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/price-lists/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getPriceList
      tags:
        - pricing
      summary: Detail daftar harga dan riwayat versi
      responses:
        '200':
          description: Daftar harga
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceListDetail'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updatePriceList
      tags:
        - pricing
      summary: Mengubah header daftar harga (kode dan jenis tetap)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceListUpdate'
      responses:
        '200':
          description: Daftar harga diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceListDetail'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deletePriceList
      tags:
        - pricing
      summary: Menghapus (soft delete) daftar harga
      description: Harga Dasar & HET tidak bisa dihapus. Transaksi lama tetap menyimpan harga dan versinya.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/PricingVersion'
      responses:
        '204':
          description: Daftar harga dihapus
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/price-lists/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: restorePriceList
      tags:
        - pricing
      summary: Memulihkan daftar harga yang dihapus (hanya Admin Sistem)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionInput'
      responses:
        '200':
          description: Daftar harga dipulihkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceListDetail'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/price-lists/{id}/versions:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: createPriceListVersion
      tags:
        - pricing
      summary: Menyiapkan versi draft baru
      description: |
        `copyFromVersionId` menyalin harga versi lain bila `items` kosong. Paling banyak satu versi draft/diajukan per
        daftar harga. Tanggal mulai berlaku tidak boleh sebelum hari ini.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceListVersionInput'
      responses:
        '201':
          description: Versi draft dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceListVersion'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/price-list-versions/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getPriceListVersion
      tags:
        - pricing
      summary: Detail versi beserta harga per produk
      responses:
        '200':
          description: Versi daftar harga
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceListVersion'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updatePriceListVersion
      tags:
        - pricing
      summary: Mengubah versi draft (seluruh item diganti)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceListVersionUpdate'
      responses:
        '200':
          description: Versi diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceListVersion'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/price-list-versions/{id}/submit:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: submitPriceListVersion
      tags:
        - pricing
      summary: Mengajukan versi untuk approval price_list_version
      description: Versi berlaku setelah disetujui Head Sales lalu Head Finance & Accounting.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionInput'
      responses:
        '200':
          description: Versi diajukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceListVersion'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/price-list-versions/{id}/withdraw:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: withdrawPriceListVersion
      tags:
        - pricing
      summary: Menarik kembali pengajuan menjadi draft
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionInput'
      responses:
        '200':
          description: Pengajuan ditarik
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceListVersion'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/price-list-versions/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: cancelPriceListVersion
      tags:
        - pricing
      summary: Membatalkan versi draft
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionInput'
      responses:
        '200':
          description: Versi dibatalkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceListVersion'
        default:
          $ref: '#/components/responses/Problem'
