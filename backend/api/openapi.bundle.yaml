      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpecialPriceInput'
      responses:
        '201':
          description: Harga khusus dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecialPrice'
