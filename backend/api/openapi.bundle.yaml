    get:
      operationId: listDiscountLimitRoles
      tags:
        - pricing
      summary: Pilihan role untuk batas diskon
      responses:
        '200':
          description: Role pembuat dokumen penjualan
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DiscountLimitRole'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/discount-limits/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      operationId: deleteDiscountLimit
      tags:
        - pricing
      summary: Menghapus batas diskon yang belum pernah berlaku
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/PricingVersion'
      responses:
        '204':
          description: Batas diskon dihapus
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/discount-limits/{id}/end:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: endDiscountLimit
      tags:
        - pricing
      summary: Mengisi tanggal berakhir batas diskon
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PricingEndInput'
      responses:
        '200':
          description: Batas diskon diakhiri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscountLimit'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/pricing/quote:
    post:
      operationId: quotePrice
      tags:
        - pricing
      summary: Simulasi harga (resolver 5 aturan BRD 5.18)
      description: |
        Menjalankan resolver yang sama dengan transaksi: harga khusus → promo → harga bertingkat → daftar harga
        channel/mitra/karyawan → Harga Dasar & HET, berdasarkan tanggal transaksi. Tidak menyimpan data, sehingga
        tidak memakai Idempotency-Key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceQuoteRequest'
      responses:
        '200':
          description: Harga dan aturan yang dipakai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceQuote'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/pricing/discount-check:
    post:
      operationId: checkDiscount
      tags:
        - pricing
      summary: Simulasi diskon manual terhadap batas diskon role user yang login
      description: |
        Subtotal dokumen = total bruto baris dikurangi diskon baris. Diskon di atas batas berarti Sales Order butuh
        approval `sales_order_discount` (Head Sales). Tidak menyimpan data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscountCheckRequest'
      responses:
        '200':
          description: Hasil pemeriksaan diskon
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscountCheckResult'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/data-exchange/kinds:
    get:
      operationId: listDataExchangeKinds
      tags:
        - dataexchange
      summary: Jenis data yang boleh diimpor/diekspor user (MD-10, INT-02)
      description: |
        Hanya jenis data dengan permission `<kind>.import` atau `<kind>.export` milik user. `uploadOwnerType`
        dipakai sebagai `ownerType` saat meminta URL upload file (`POST /api/v1/files`).
      responses:
        '200':
          description: Jenis data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataExchangeKindList'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/data-exchange/kinds/{kind}/template:
    get:
      operationId: getDataExchangeTemplate
      tags:
        - dataexchange
      summary: Mengunduh template impor (xlsx) yang dihasilkan dari definisi kolom
      description: |
        Template berisi sheet data (header oranye bertanda `*` wajib, abu-abu opsional, dropdown untuk kolom
        pilihan) dan sheet Petunjuk berisi format, aturan, serta contoh baris. Butuh `<kind>.import`.
      parameters:
        - $ref: '#/components/parameters/DataExchangeKindPath'
      responses:
        '200':
          description: File template
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/import-jobs:
    get:
      operationId: listImportJobs
      tags:
        - dataexchange
      summary: Riwayat impor (jenis data yang boleh diimpor user)
      parameters:
        - $ref: '#/components/parameters/DataExchangeKindQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Riwayat impor, terbaru dulu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJobList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createImportJob
      tags:
        - dataexchange
      summary: Memulai impor dari file xlsx yang sudah diunggah
      description: |
        File diunggah dulu lewat `POST /api/v1/files` dengan `ownerType` dari `listDataExchangeKinds`. Pemeriksaan
        per baris berjalan sebagai job `dataexchange.import` (antrean bulk); pantau progress lewat `getImportJob`.
        File yang sama (SHA-256) untuk jenis data yang sama ditolak `IMPORT_ALREADY_PROCESSED`, kecuali job
        sebelumnya gagal atau dibatalkan.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportJobInput'
      responses:
        '202':
          description: Job impor dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/import-jobs/{id}:
    get:
      operationId: getImportJob
      tags:
        - dataexchange
      summary: Status, progress, dan ringkasan job impor
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Job impor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/import-jobs/{id}/rows:
    get:
      operationId: listImportJobRows
      tags:
        - dataexchange
      summary: Preview baris hasil pemeriksaan
      description: Data pribadi (NPWP, nomor rekening, NIK) ditampilkan tersamar.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: valid
          in: query
          description: true = hanya baris valid, false = hanya baris error, kosong = semua.
          schema:
            type: boolean
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Baris preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJobRowList'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/import-jobs/{id}/commit:
    post:
      operationId: commitImportJob
      tags:
        - dataexchange
      summary: Menyimpan baris valid
      description: |
        Hanya untuk status `validated` dengan minimal satu baris valid. Penyimpanan berjalan sebagai job; master
        data disimpan dalam satu transaksi (gagal satu baris = tidak ada yang tersimpan, TG 5.15).
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Penyimpanan dijadwalkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/import-jobs/{id}/cancel:
    post:
      operationId: cancelImportJob
      tags:
        - dataexchange
      summary: Membatalkan impor yang menunggu konfirmasi
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Impor dibatalkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/import-jobs/{id}/error-file:
    get:
      operationId: getImportJobErrorFile
      tags:
        - dataexchange
      summary: URL unduhan file baris error (xlsx dengan kolom Keterangan Error)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: URL unduhan berumur 5 menit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataExchangeFileLink'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/export-jobs:
    get:
      operationId: listExportJobs
      tags:
        - dataexchange
      summary: Riwayat ekspor (jenis data yang boleh diekspor user)
      parameters:
        - $ref: '#/components/parameters/DataExchangeKindQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Riwayat ekspor, terbaru dulu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJobList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createExportJob
      tags:
        - dataexchange
      summary: Memulai ekspor ke xlsx
      description: |
        File dibuat job `dataexchange.export` (antrean bulk) dengan kolom yang sama dengan template impor, lalu
        user mendapat notifikasi berisi tautan unduhan. Butuh `<kind>.export`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportJobInput'
      responses:
        '202':
          description: Job ekspor dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/export-jobs/{id}:
    get:
      operationId: getExportJob
      tags:
        - dataexchange
      summary: Status job ekspor
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Job ekspor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/export-jobs/{id}/download-url:
    get:
      operationId: getExportJobDownloadUrl
      tags:
        - dataexchange
      summary: URL unduhan file ekspor
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: URL unduhan berumur 5 menit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataExchangeFileLink'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token EdDSA 15 menit (Technical Guideline 9.1).
  schemas:
    Problem:
      type: object
      description: Format error RFC 7807 (Technical Guideline 8.3). Field code adalah kontrak stabil untuk FE.
      required:
        - type
        - title
        - status
        - code
        - detail
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          $ref: '#/components/schemas/ErrorCode'
        detail:
          type: string
          description: Pesan Bahasa Indonesia yang aman ditampilkan ke user.
        fields:
          type: object
          additionalProperties:
            type: string
        requestId:
          type: string
    ErrorCode:
      type: string
      description: Katalog kode error (Technical Guideline Lampiran A).
      enum:
        - VALIDATION_FAILED
        - AUTH_INVALID_CREDENTIALS
        - AUTH_ACCOUNT_LOCKED
        - AUTH_MFA_REQUIRED
        - AUTH_MFA_INVALID
        - AUTH_TOKEN_EXPIRED
        - AUTH_SESSION_EXPIRED
        - AUTH_REAUTH_REQUIRED
        - AUTH_MFA_ENROLLMENT_REQUIRED
        - AUTH_PASSWORD_TOKEN_INVALID
        - FORBIDDEN
        - NOT_FOUND
        - VERSION_CONFLICT
        - INVALID_STATE_TRANSITION
        - IDEMPOTENCY_KEY_REQUIRED
        - IDEMPOTENCY_IN_PROGRESS
        - IDEMPOTENCY_KEY_REUSED
        - DUPLICATE_CODE
        - PERIOD_LOCKED
        - STOCK_INSUFFICIENT
        - BATCH_SHELF_LIFE_TOO_SHORT
        - APPROVAL_REQUIRED
        - APPROVAL_POLICY_MISSING
        - DISCOUNT_LIMIT_EXCEEDED
        - CREDIT_LIMIT_EXCEEDED
        - THREE_WAY_MATCH_FAILED
        - DEPOSIT_INSUFFICIENT
        - OUTSIDE_ATTENDANCE_RADIUS
        - FILE_TOO_LARGE
        - FILE_TYPE_NOT_ALLOWED
        - IMPORT_ALREADY_PROCESSED
        - RATE_LIMITED
        - PROVIDER_UNAVAILABLE
        - BAD_REQUEST
        - INTERNAL_ERROR
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    ReadinessCheck:
      type: object
      required:
        - name
        - status
      properties:
        name:
          type: string
          example: database
        status:
          type: string
          enum:
            - ok
            - failed
        detail:
          type: string
    ReadinessStatus:
      type: object
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum:
            - ready
            - not_ready
        checks:
          type: array
          items:
            $ref: '#/components/schemas/ReadinessCheck'
    DatabaseInfo:
      type: object
      required:
        - status
        - schemaVersion
        - latestSchemaVersion
      properties:
        status:
          type: string
          enum:
            - ok
            - failed
        schemaVersion:
          type: integer
          format: int64
        latestSchemaVersion:
          type: integer
          format: int64
    SystemInfo:
      type: object
      required:
        - version
        - commit
        - environment
        - enabledModules
        - mockActive
        - serverTime
        - database
      properties:
        version:
          type: string
          example: v1.0.0
        commit:
          type: string
        environment:
          type: string
          enum:
            - local
            - staging
            - production
        enabledModules:
          type: array
          items:
            type: string
        mockActive:
          type: boolean
          description: True jika minimal satu adapter pihak ketiga memakai mock.
        serverTime:
          type: string
          format: date-time
        database:
          $ref: '#/components/schemas/DatabaseInfo'
    MidtransNotification:
      type: object
      description: Payload HTTP notification Midtrans (nama field milik Midtrans).
      required:
        - order_id
        - status_code
        - gross_amount
        - signature_key
        - transaction_status
        - transaction_id
      properties:
        order_id:
          type: string
        status_code:
          type: string
        gross_amount:
          type: string
        signature_key:
          type: string
        transaction_status:
          type: string
        transaction_id:
          type: string
        fraud_status:
          type: string
    WebhookAck:
      type: object
      required:
        - received
        - duplicate
      properties:
        received:
          type: boolean
        duplicate:
          type: boolean
    ReturnReasonScope:
      type: string
      enum:
        - sales_return
        - purchase_return
    ReturnReasonAppliesTo:
      type: string
      description: Dokumen yang memakai alasan ini.
      enum:
        - sales_return
        - purchase_return
        - both
    ReturnDisposition:
      type: string
      description: Disposisi barang retur (Disposisi Retur, WMS-07).
      enum:
        - restock
        - repack
        - reprocess
        - marketing_sample
        - dispose
    ReturnReason:
      type: object
      required:
        - id
        - code
        - name
        - appliesTo
        - description
        - isActive
        - updatedAt
        - version
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: DAMAGED_SHIPPING
        name:
          type: string
        appliesTo:
          $ref: '#/components/schemas/ReturnReasonAppliesTo'
        defaultDisposition:
          allOf:
            - $ref: '#/components/schemas/ReturnDisposition'
          nullable: true
          description: Usulan awal disposisi; staf gudang tetap memilih saat QC.
        description:
          type: string
        isActive:
          type: boolean
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
    ReturnReasonFields:
      type: object
      required:
        - name
        - appliesTo
        - isActive
      properties:
        name:
          type: string
          maxLength: 150
        appliesTo:
          $ref: '#/components/schemas/ReturnReasonAppliesTo'
        defaultDisposition:
          allOf:
            - $ref: '#/components/schemas/ReturnDisposition'
          nullable: true
        description:
          type: string
          maxLength: 500
        isActive:
          type: boolean
    ReturnReasonInput:
      allOf:
        - $ref: '#/components/schemas/ReturnReasonFields'
        - type: object
          required:
            - code
          properties:
            code:
              type: string
              example: DAMAGED_SHIPPING
    VersionInput:
      type: object
      required:
        - version
      properties:
        version:
          type: integer
          description: Versi terakhir yang dilihat user (optimistic locking).
    ReturnReasonUpdate:
      allOf:
        - $ref: '#/components/schemas/ReturnReasonFields'
        - $ref: '#/components/schemas/VersionInput'
    BiteshipNotification:
      type: object
      description: Payload webhook status order Biteship (nama field milik Biteship).
      required:
        - event
        - order_id
        - status
      properties:
        event:
          type: string
          example: order.status
        order_id:
          type: string
        courier_waybill_id:
          type: string
        status:
          type: string
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
        totpCode:
          type: string
          pattern: ^[0-9]{6}$
    AccessToken:
      type: object
      required:
        - accessToken
        - expiresAt
      properties:
        accessToken:
          type: string
        expiresAt:
          type: string
          format: date-time
    ReauthRequest:
      type: object
      properties:
        password:
          type: string
        totpCode:
          type: string
          pattern: ^[0-9]{6}$
    PasswordForgotRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
    PasswordTokenInfo:
      type: object
      required:
        - email
        - fullName
        - purpose
      properties:
        email:
          type: string
        fullName:
          type: string
        purpose:
          type: string
          enum:
            - invite
            - reset
    PasswordSetupRequest:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 10
          maxLength: 128
    PasswordChangeRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 10
          maxLength: 128
    MfaSetup:
      type: object
      required:
        - secret
        - otpauthUrl
        - qrCodeDataUrl
      properties:
        secret:
          type: string
        otpauthUrl:
          type: string
        qrCodeDataUrl:
          type: string
          description: Gambar PNG QR code dalam format data URL.
    MfaActivateRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          pattern: ^[0-9]{6}$
    CurrentUser:
      type: object
      required:
        - id
        - email
        - fullName
        - roles
        - permissions
        - isMfaEnabled
        - mfaEnrollmentRequired
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        fullName:
          type: string
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
          example:
            - catalog.product.read
            - catalog.product.write
        isMfaEnabled:
          type: boolean
        mfaEnrollmentRequired:
          type: boolean
          description: Role user mewajibkan MFA tetapi MFA belum aktif; semua menu lain terkunci sampai MFA aktif.
    Pagination:
      type: object
      description: Metadata pagination standar (Technical Guideline 8.2).
      required:
        - page
        - pageSize
        - totalItems
        - totalPages
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 200
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
    UserRoleAssignment:
      type: object
      required:
        - code
      properties:
        code:
          type: string
        name:
          type: string
          readOnly: true
        scopeDivisionId:
          type: string
          format: uuid
          nullable: true
    User:
      type: object
      required:
        - id
        - email
        - fullName
        - roles
        - isActive
        - isMfaEnabled
        - hasPassword
        - createdAt
        - updatedAt
        - version
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        fullName:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/UserRoleAssignment'
        divisionId:
          type: string
          format: uuid
          nullable: true
        employeeId:
          type: string
          format: uuid
          nullable: true
        isActive:
          type: boolean
        isMfaEnabled:
          type: boolean
        hasPassword:
          type: boolean
          description: false berarti undangan belum diterima.
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
    UserList:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/User'
    UserInput:
      type: object
      required:
        - email
        - fullName
        - roles
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        fullName:
          type: string
          minLength: 1
          maxLength: 120
        roles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/UserRoleAssignment'
        divisionId:
          type: string
          format: uuid
          nullable: true
        employeeId:
          type: string
          format: uuid
          nullable: true
    UserUpdate:
      type: object
      required:
        - fullName
        - roles
        - version
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 120
        roles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/UserRoleAssignment'
        divisionId:
          type: string
          format: uuid
          nullable: true
        employeeId:
          type: string
          format: uuid
          nullable: true
        version:
          type: integer
    Role:
      type: object
      required:
        - id
        - code
        - name
        - description
        - requiresMfa
        - hasDivisionScope
        - permissions
