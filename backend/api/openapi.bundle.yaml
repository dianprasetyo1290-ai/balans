      operationId: endSpecialPrice
      tags:
        - pricing
      summary: Mengisi tanggal berakhir harga khusus
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PricingEndInput'
      responses:
        '200':
          description: Harga khusus diakhiri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecialPrice'
