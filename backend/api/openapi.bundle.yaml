openapi: 3.0.3
info:
  title: Balans Platform API
  version: 0.0.0
  description: |
    Kontrak API back-office Balans. File ini adalah sumber kebenaran (Technical Guideline 8.1).
    Server Go dan client TypeScript digenerate dari spec ini. Path dipecah per modul di folder paths/.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: system
    description: Kesehatan proses dan informasi sistem
  - name: sales
    description: Penjualan, termasuk webhook payment gateway
  - name: logistics
    description: Pengiriman, termasuk webhook kurir
  - name: identity
    description: Sesi, pengguna, dan permission (R1.1)
  - name: audit
    description: Riwayat perubahan (audit trail)
  - name: approval
    description: Engine & inbox persetujuan (R1.1)
  - name: notification
    description: Notifikasi in-app (R1.1)
  - name: catalog
    description: Master produk, packaging, material, bundling (R1.1)
  - name: warehouse
    description: Gudang dan lokasi stok (R1.1)
  - name: party
    description: Pelanggan, mitra & PKS, kode produk mitra, pemasok & maklon (R1.1)
  - name: hris
    description: Data karyawan dasar (R1.1)
  - name: filestore
    description: Upload dan unduhan file bertanda tangan (R1.1)
paths:
  /healthz:
    get:
      operationId: getHealth
      security: []
      tags:
        - system
      summary: Proses hidup
      responses:
        '200':
          description: Proses berjalan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /readyz:
    get:
      operationId: getReadiness
      security: []
      tags:
        - system
      summary: Siap menerima trafik (DB terhubung dan migrasi terbaru)
      responses:
        '200':
          description: Siap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
        '503':
          description: Belum siap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
  /api/v1/system/info:
    get:
      operationId: getSystemInfo
      security: []
      tags:
        - system
      summary: Informasi versi, lingkungan, dan modul aktif
      description: Dipakai halaman Tentang Sistem dan untuk menentukan menu modul yang tampil (Technical Guideline 14.5).
      responses:
        '200':
          description: Informasi sistem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
        '500':
          description: Kesalahan sistem
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/webhooks/midtrans:
    post:
      operationId: receiveMidtransWebhook
      security: []
      tags:
        - sales
      summary: Notifikasi pembayaran Midtrans
      description: |
        Signature diverifikasi sebelum payload disimpan. Event disimpan di webhook_events (dedup per event)
        dan diproses job payment_webhook.process yang mengonfirmasi ulang status ke Midtrans
        (Technical Guideline 7.4, 9.3). Endpoint ini tidak memakai Idempotency-Key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MidtransNotification'
      responses:
        '200':
          description: Event diterima atau sudah pernah diterima
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAck'
        '400':
          description: Payload tidak bisa dibaca
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Signature tidak valid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/webhooks/biteship:
    post:
      operationId: receiveBiteshipWebhook
      security: []
      tags:
        - logistics
      summary: Notifikasi status pengiriman Biteship
      description: |
        Signature di header X-Biteship-Signature diverifikasi sebelum payload disimpan. Event diproses job
        shipment_webhook.process yang mengonfirmasi ulang status ke Biteship. Endpoint ini tidak memakai Idempotency-Key.
      parameters:
        - name: X-Biteship-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BiteshipNotification'
      responses:
        '200':
          description: Event diterima atau sudah pernah diterima
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAck'
        '400':
          description: Payload tidak bisa dibaca
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Signature tidak valid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/login:
    post:
      operationId: login
      security: []
      tags:
        - identity
      summary: Masuk dengan email dan password
      description: |
        Mengembalikan access token (15 menit, disimpan di memori FE) dan memasang refresh token di cookie
        HttpOnly `Path=/api/v1/auth` (Technical Guideline 9.1). Gagal login selalu `AUTH_INVALID_CREDENTIALS`;
        5 kali gagal dalam 15 menit → `AUTH_ACCOUNT_LOCKED`. User ber-MFA → `AUTH_MFA_REQUIRED` lalu kirim ulang dengan `totpCode`.
        Tidak memakai Idempotency-Key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Berhasil masuk
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      security: []
      tags:
        - identity
      summary: Memperbarui access token dengan refresh token (rotasi)
      description: Refresh token lama langsung tidak berlaku. Pemakaian ulang token lama mencabut seluruh keluarga sesi.
      parameters:
        - $ref: '#/components/parameters/RefreshCookie'
      responses:
        '200':
          description: Access token baru
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/logout:
    post:
      operationId: logout
      security: []
      tags:
        - identity
      summary: Keluar dan mencabut sesi aktif
      description: Sesi dicari dari cookie refresh token, sehingga tetap bisa keluar walaupun access token sudah kedaluwarsa.
      parameters:
        - $ref: '#/components/parameters/RefreshCookie'
      responses:
        '204':
          description: Sesi dicabut
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/reauth:
    post:
      operationId: reauthenticate
      tags:
        - identity
      summary: Konfirmasi identitas untuk aksi sensitif
      description: Mengembalikan access token baru dengan claim `reauth_at` yang berlaku 5 menit (Technical Guideline 9.1).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthRequest'
      responses:
        '200':
          description: Access token baru
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/password/forgot:
    post:
      operationId: requestPasswordReset
      security: []
      tags:
        - identity
      summary: Meminta tautan atur ulang password
      description: Selalu 204 walaupun email tidak terdaftar, agar tidak bisa dipakai menebak email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordForgotRequest'
      responses:
        '204':
          description: Diterima
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/password/token:
    get:
      operationId: getPasswordToken
      security: []
      tags:
        - identity
      summary: Memeriksa tautan undangan atau atur ulang password
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tautan berlaku
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordTokenInfo'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/password/setup:
    post:
      operationId: setupPassword
      security: []
      tags:
        - identity
      summary: Mengatur password dari tautan undangan atau atur ulang
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordSetupRequest'
      responses:
        '204':
          description: Password tersimpan; semua sesi lama dicabut
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/password/change:
    post:
      operationId: changePassword
      tags:
        - identity
      summary: Mengganti password sendiri
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '204':
          description: Password diganti; sesi lain dicabut
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/mfa/setup:
    post:
      operationId: setupMfa
      tags:
        - identity
      summary: Membuat secret TOTP baru untuk didaftarkan di aplikasi autentikator
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Secret dan QR code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaSetup'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/mfa/activate:
    post:
      operationId: activateMfa
      tags:
        - identity
      summary: Mengaktifkan MFA dengan kode pertama dari aplikasi autentikator
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaActivateRequest'
      responses:
        '204':
          description: MFA aktif
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/me:
    get:
      operationId: getCurrentUser
      tags:
        - identity
      summary: User yang sedang login beserta permission
      description: Permission dimuat server-side dan tidak disimpan di token (Technical Guideline 9.1).
      responses:
        '200':
          description: Data user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/users:
    get:
      operationId: listUsers
      tags:
        - identity
      summary: Daftar pengguna
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Search'
        - name: isActive
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Daftar pengguna
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createUser
      tags:
        - identity
      summary: Membuat pengguna dan mengirim undangan atur password
      description: Pemberian role butuh re-autentikasi (`identity.user_role.write`).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '201':
          description: Pengguna dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/users/{id}:
    get:
      operationId: getUser
      tags:
        - identity
      summary: Detail pengguna
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Pengguna
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updateUser
      tags:
        - identity
      summary: Mengubah nama, divisi, dan role pengguna
      description: Perubahan role butuh re-autentikasi dan memutus semua sesi pengguna (< 30 detik).
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Pengguna diubah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/users/{id}/activate:
    post:
      operationId: activateUser
      tags:
        - identity
      summary: Mengaktifkan kembali pengguna
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionInput'
      responses:
        '200':
          description: Pengguna aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/users/{id}/deactivate:
    post:
      operationId: deactivateUser
      tags:
        - identity
      summary: Menonaktifkan pengguna dan memutus semua sesinya
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionInput'
      responses:
        '200':
          description: Pengguna nonaktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/users/{id}/resend-invitation:
    post:
      operationId: resendUserInvitation
      tags:
        - identity
      summary: Mengirim ulang undangan atur password
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Undangan dikirim
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/users/{id}/reset-mfa:
    post:
      operationId: resetUserMfa
      tags:
        - identity
      summary: Mereset MFA pengguna (HP hilang); pengguna mendaftar ulang saat masuk berikutnya
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: MFA direset
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/roles:
    get:
      operationId: listRoles
      tags:
        - identity
      summary: Daftar role beserta permission
      responses:
        '200':
          description: Daftar role
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/roles/{id}/permissions:
    put:
      operationId: setRolePermissions
      tags:
        - identity
      summary: Mengganti permission role (berlaku langsung, butuh re-autentikasi)
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolePermissionsInput'
      responses:
        '200':
          description: Role diubah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/permissions:
    get:
      operationId: listPermissions
      tags:
        - identity
      summary: Katalog permission
      responses:
        '200':
          description: Katalog permission
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Permission'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/audit-logs:
    get:
      operationId: listAuditLogs
      tags:
        - audit
      summary: Riwayat perubahan
      description: |
        Tanpa `entityId` butuh `audit.log.read`. Dengan `entityType` + `entityId` (tab Riwayat dokumen) cukup permission
        baca entitas tersebut. Field sensitif sudah dimask (Technical Guideline 6.6).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: entityType
          in: query
          schema:
            type: string
        - name: entityId
          in: query
          schema:
            type: string
            format: uuid
        - name: actorId
          in: query
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          schema:
            $ref: '#/components/schemas/AuditAction'
        - name: createdFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: createdTo
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Riwayat perubahan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogList'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/approvals/inbox:
    get:
      operationId: listApprovalInbox
      tags:
        - approval
      summary: Persetujuan Saya — dokumen yang menunggu keputusan user
      description: |
        Termasuk dokumen yang bisa diputuskan sebagai penerima delegasi atau sebagai pengganti approver.
        Dokumen yang diajukan user sendiri tidak pernah muncul (pembuat tidak boleh menyetujui dokumennya sendiri).
        Terlama lebih dulu.
      parameters:
        - name: subjectType
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Dokumen menunggu keputusan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalInbox'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/approvals/inbox/count:
    get:
      operationId: getApprovalInboxCount
      tags:
        - approval
      summary: Jumlah dokumen yang menunggu keputusan user (badge menu)
      responses:
        '200':
          description: Jumlah dokumen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalInboxCount'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/approvals/subject-types:
    get:
      operationId: listApprovalSubjectTypes
      tags:
        - approval
      summary: Jenis dokumen yang memakai engine approval
      responses:
        '200':
          description: Jenis dokumen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApprovalSubjectType'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/approvals/user-options:
    get:
      operationId: listApprovalUserOptions
      tags:
        - approval
      summary: Mencari pengguna aktif untuk dipilih sebagai penerima delegasi, approver, atau pengganti
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Maksimal 20 pengguna
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApprovalUserOption'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/approval-requests:
    get:
      operationId: listApprovalRequests
      tags:
        - approval
      summary: Riwayat permintaan persetujuan
      description: |
        `scope=requested` — diajukan user; `scope=decided` — pernah diputuskan user; `scope=all` — semua dokumen
        (butuh `approval.policy.read`). Dengan `subjectType` + `subjectId` mengembalikan riwayat satu dokumen
        (panel Persetujuan di detail dokumen) dan `scope` diabaikan.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: scope
          in: query
          schema:
            type: string
            enum:
              - requested
              - decided
              - all
            default: requested
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ApprovalStatus'
        - name: subjectType
          in: query
          schema:
            type: string
        - name: subjectId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Permintaan persetujuan, terbaru lebih dulu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequestList'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/approval-requests/{id}:
    get:
      operationId: getApprovalRequest
      tags:
        - approval
      summary: Detail permintaan persetujuan
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Permintaan persetujuan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/approval-requests/{id}/approve:
    post:
      operationId: approveApprovalRequest
      tags:
        - approval
      summary: Setujui level yang aktif
      description: |
        Level berikutnya aktif dan approver-nya diberi notifikasi. Setelah level terakhir, modul pemilik dokumen
        memproses persetujuan di transaksi yang sama. Pembuat dokumen ditolak `FORBIDDEN`.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalApproveInput'
      responses:
        '200':
          description: Keputusan tersimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/approval-requests/{id}/reject:
    post:
      operationId: rejectApprovalRequest
      tags:
        - approval
      summary: Tolak dokumen
      description: Catatan wajib diisi. Dokumen kembali ke pembuat untuk direvisi.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRejectInput'
      responses:
        '200':
          description: Dokumen ditolak
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
        default:
          $ref: '#/components/responses/Problem'
