    post:
      operationId: createDisposal
      tags:
        - inventory
      summary: Membuat draft Pemusnahan (S-223)
      description: |
        Alasan `return` hanya dari lokasi Retur (A-26 Dr 6403, Cr 1314); `expired`/`damaged` dari lokasi FG, E-commerce,
        Petty Stock, Inbound, atau Event (A-27 Dr 6402, Cr 1311). Foto berita acara diunggah lebih dulu ke filestore
        (`ownerType=disposal`). Permission `inventory.disposal.write`.
      parameters:
