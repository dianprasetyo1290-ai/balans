      summary: Ajukan Berita Acara Rekonsiliasi ke approval (Sales MT → Head Finance & Accounting)
      description: |
        Wajib BA bertanda tangan, sisa fisik ≤ saldo sistem, dan penyebab untuk setiap selisih. Disetujui level
        terakhir → stok terjual & selisih keluar dari lokasi mitra, invoice konsinyasi (A-08) dan invoice selisih yang
        ditagih ke mitra (A-23), selisih ditanggung Balans ke Beban Kehilangan Persediaan (A-23), status Diposting.
      parameters:
