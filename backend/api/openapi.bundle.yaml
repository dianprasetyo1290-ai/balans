    put:
      operationId: updateAccount
      tags:
        - accounting
      summary: Mengubah akun
      description: |
        Kode tidak berubah. Saldo normal akun yang sudah dipakai jurnal tidak bisa diubah; akun terpakai tidak bisa
        dijadikan akun induk; akun yang punya sub-akun harus tetap akun induk.
