      description: Error standar (problem+json)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  parameters:
    RefreshCookie:
      name: balans_refresh
      in: cookie
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID per percobaan submit (Technical Guideline 7.1).
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Sort:
      name: sort
      in: query
      description: Daftar field dipisah koma; awalan minus untuk descending, mis. `-createdAt,sku`.
      schema:
        type: string
    Search:
      name: q
      in: query
      schema:
        type: string
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PartyVersion:
      name: version
      in: query
      required: true
      description: Versi terakhir yang dilihat user (optimistic locking).
      schema:
        type: integer
    FileExpires:
      name: exp
      in: query
      required: true
      description: Waktu kedaluwarsa URL (Unix detik).
      schema:
        type: integer
        format: int64
    FileSignature:
      name: sig
      in: query
      required: true
      schema:
        type: string
