      tags:
        - sales
      summary: Mulai rekonsiliasi (nomor KSN; hitung stok awal, kiriman, tarikan, sisa fisik, terjual sistem)
      description: |
        PKS konsinyasi berlaku pada cut-off disalin (harga, termin, ketentuan selisih). Periode = hari setelah cut-off
        rekonsiliasi Diposting sebelumnya (atau tanggal 1 bulan cut-off) s.d. cut-off. Terjual sistem = stok awal +
        kiriman − tarikan − sisa fisik. Harga konsinyasi dari resolver harga (daftar harga PKS).
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
