          $ref: '#/components/responses/Problem'
    post:
      operationId: createPromotion
      tags:
        - pricing
      summary: Menambah promo periode
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromotionInput'
      responses:
        '201':
          description: Promo dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Promotion'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/promotions/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getPromotion
      tags:
        - pricing
      summary: Detail promo beserta item
      responses:
        '200':
          description: Promo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Promotion'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updatePromotion
      tags:
        - pricing
      summary: Mengubah promo
      description: |
