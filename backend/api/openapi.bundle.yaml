    get:
      operationId: listInternalUsageDimensionOptions
      tags:
        - inventory
      summary: Divisi atau kampanye aktif untuk form Pemakaian Internal
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum:
              - division
              - campaign
      responses:
        '200':
          description: Pilihan dimensi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryDimensionOptionList'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/repackings:
    get:
      operationId: listRepackings
      tags:
        - inventory
      summary: Repacking — daftar (INV-06)
      parameters:
