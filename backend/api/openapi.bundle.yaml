  responses:
    Problem:
      description: Error standar (problem+json)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  parameters:
    RefreshCookie:
      name: balans_refresh
      in: cookie
      required: false
      schema:
