        '200':
          description: Periode terbaru lebih dulu
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FiscalPeriod'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/fiscal-periods/ensure:
    post:
      operationId: ensureFiscalPeriods
      tags:
        - accounting
      summary: Membuat periode bulan berjalan dan bulan berikutnya bila belum ada
      description: |
        Periode juga dibuat otomatis oleh job harian `accounting.ensure_fiscal_periods` dan saat jurnal pertama
        diposting di bulan tersebut. Butuh `accounting.fiscal_period.write`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Jumlah periode yang dibuat
          content:
            application/json:
              schema:
                type: object
                required:
                  - created
                properties:
                  created:
                    type: integer
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/posting-rules:
    get:
      operationId: listPostingRules
      tags:
        - accounting
      summary: Posting rule jurnal otomatis dan pemetaan akun yang berlaku hari ini (S-130)
      responses:
        '200':
          description: Posting rule urut kode
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PostingRule'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/journal-entries:
    get:
      operationId: listJournalEntries
      tags:
        - accounting
      summary: Daftar jurnal (manual, otomatis, Balik Jurnal)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/JournalStatus'
        - name: entryType
          in: query
          schema:
            $ref: '#/components/schemas/JournalEntryType'
        - name: dateFrom
          in: query
          schema:
            $ref: '#/components/schemas/BusinessDate'
        - name: dateTo
          in: query
          schema:
            $ref: '#/components/schemas/BusinessDate'
      responses:
        '200':
          description: Jurnal terbaru lebih dulu; draft tanpa nomor di atas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntryList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createJournalEntry
      tags:
        - accounting
      summary: Menyimpan draft Jurnal Umum (S-127)
      description: |
        Akun harus bisa diposting manual (akun kontrol hanya diisi jurnal otomatis). Tanggal di periode tertutup
        ditolak `PERIOD_LOCKED`. Balance dan dimensi wajib diperiksa saat posting.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualJournalFields'
      responses:
        '201':
          description: Draft dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntry'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/journal-entries/{id}:
    get:
      operationId: getJournalEntry
      tags:
        - accounting
      summary: Detail jurnal beserta baris dan aksi yang diizinkan
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Jurnal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntry'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updateJournalEntry
      tags:
        - accounting
      summary: Mengubah draft Jurnal Umum
      description: Jurnal yang sudah diposting tidak bisa diubah (`INVALID_STATE_TRANSITION`, ACC-13).
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualJournalUpdate'
      responses:
        '200':
          description: Draft diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntry'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteJournalEntry
      tags:
        - accounting
      summary: Menghapus draft Jurnal Umum
      description: Jurnal yang sudah diposting tidak bisa dihapus (`INVALID_STATE_TRANSITION`, ACC-13).
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Version'
      responses:
        '204':
          description: Draft dihapus
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/journal-entries/{id}/post:
    post:
      operationId: postJournalEntry
      tags:
        - accounting
      summary: Memposting draft Jurnal Umum
      description: |
        Jurnal harus balance, di periode terbuka (`PERIOD_LOCKED`), dan dimensi wajib terisi (pendapatan: channel +
        sub-channel; HPP/beban/lain-lain: divisi). Nomor `JV/TAHUN/BULAN/NOMOR` diberikan saat posting.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionInput'
      responses:
        '200':
          description: Jurnal diposting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntry'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/journal-entries/{id}/reverse:
    post:
      operationId: reverseJournalEntry
      tags:
        - accounting
      summary: Balik Jurnal (S-128)
      description: |
        Membuat dan memposting JV pembalik (debit/kredit ditukar) yang mereferensikan jurnal asal. Jurnal asal tetap
        tidak berubah. Satu jurnal hanya bisa dibalik sekali; jurnal otomatis dibalik lewat pembatalan dokumen sumber.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JournalReverseInput'
      responses:
        '201':
          description: Jurnal pembalik
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntry'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/general-ledger:
    get:
      operationId: getGeneralLedger
      tags:
        - accounting
      summary: Buku Besar per akun dengan saldo berjalan
      description: |
        Hanya jurnal yang sudah diposting. Saldo mengikuti saldo normal akun. Rentang paling panjang 2 tahun.
        Butuh `accounting.journal.read` atau `accounting.report.read`.
      parameters:
        - name: accountId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: dateFrom
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/BusinessDate'
        - name: dateTo
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/BusinessDate'
        - name: channelId
          in: query
          schema:
            type: string
            format: uuid
        - name: subChannelId
          in: query
          schema:
            type: string
            format: uuid
        - name: divisionId
          in: query
          schema:
            type: string
            format: uuid
        - name: campaignId
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Buku Besar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralLedger'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/document-sequences:
    get:
      operationId: listDocumentSequences
      tags:
        - document
      summary: Pengaturan › Nomor Dokumen — nomor terakhir per kode dokumen
      description: |
        Format `KODE/TAHUN/BULAN/NOMOR` dengan nomor urut 5 digit yang reset setiap tahun (U-15). Nomor diberikan
        saat dokumen diajukan atau diposting di dalam transaksi bisnis, sehingga tidak loncat. Butuh
        `document.sequence.read`. Tanpa `year` dipakai tahun berjalan (WIB).
      parameters:
        - name: year
          in: query
          schema:
            type: integer
            minimum: 2000
            maximum: 9999
      responses:
        '200':
          description: Semua kode dokumen beserta nomor terakhir pada tahun tersebut
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSequenceList'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token EdDSA 15 menit (Technical Guideline 9.1).
  schemas:
    Problem:
      type: object
      description: Format error RFC 7807 (Technical Guideline 8.3). Field code adalah kontrak stabil untuk FE.
      required:
        - type
        - title
        - status
        - code
        - detail
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          $ref: '#/components/schemas/ErrorCode'
        detail:
          type: string
          description: Pesan Bahasa Indonesia yang aman ditampilkan ke user.
        fields:
          type: object
          additionalProperties:
            type: string
        requestId:
          type: string
    ErrorCode:
      type: string
      description: Katalog kode error (Technical Guideline Lampiran A).
      enum:
        - VALIDATION_FAILED
        - AUTH_INVALID_CREDENTIALS
        - AUTH_ACCOUNT_LOCKED
        - AUTH_MFA_REQUIRED
        - AUTH_MFA_INVALID
        - AUTH_TOKEN_EXPIRED
        - AUTH_SESSION_EXPIRED
        - AUTH_REAUTH_REQUIRED
        - AUTH_MFA_ENROLLMENT_REQUIRED
        - AUTH_PASSWORD_TOKEN_INVALID
        - FORBIDDEN
        - NOT_FOUND
        - VERSION_CONFLICT
        - INVALID_STATE_TRANSITION
        - IDEMPOTENCY_KEY_REQUIRED
        - IDEMPOTENCY_IN_PROGRESS
        - IDEMPOTENCY_KEY_REUSED
        - DUPLICATE_CODE
        - PERIOD_LOCKED
        - STOCK_INSUFFICIENT
        - BATCH_SHELF_LIFE_TOO_SHORT
        - APPROVAL_REQUIRED
        - APPROVAL_POLICY_MISSING
        - DISCOUNT_LIMIT_EXCEEDED
        - CREDIT_LIMIT_EXCEEDED
        - THREE_WAY_MATCH_FAILED
        - DEPOSIT_INSUFFICIENT
        - OUTSIDE_ATTENDANCE_RADIUS
        - FILE_TOO_LARGE
        - FILE_TYPE_NOT_ALLOWED
        - IMPORT_ALREADY_PROCESSED
        - RATE_LIMITED
        - PROVIDER_UNAVAILABLE
        - BAD_REQUEST
        - INTERNAL_ERROR
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    ReadinessCheck:
      type: object
      required:
        - name
        - status
      properties:
        name:
          type: string
          example: database
        status:
          type: string
          enum:
            - ok
            - failed
        detail:
          type: string
    ReadinessStatus:
      type: object
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum:
            - ready
            - not_ready
        checks:
          type: array
          items:
            $ref: '#/components/schemas/ReadinessCheck'
    DatabaseInfo:
      type: object
      required:
        - status
        - schemaVersion
        - latestSchemaVersion
      properties:
        status:
          type: string
          enum:
            - ok
            - failed
        schemaVersion:
          type: integer
          format: int64
        latestSchemaVersion:
          type: integer
          format: int64
    SystemInfo:
      type: object
      required:
        - version
        - commit
        - environment
        - enabledModules
        - mockActive
        - serverTime
        - database
      properties:
        version:
          type: string
          example: v1.0.0
        commit:
          type: string
        environment:
          type: string
          enum:
            - local
            - staging
            - production
        enabledModules:
          type: array
          items:
            type: string
        mockActive:
          type: boolean
          description: True jika minimal satu adapter pihak ketiga memakai mock.
        serverTime:
          type: string
          format: date-time
        database:
          $ref: '#/components/schemas/DatabaseInfo'
    MidtransNotification:
      type: object
      description: Payload HTTP notification Midtrans (nama field milik Midtrans).
      required:
        - order_id
        - status_code
        - gross_amount
        - signature_key
        - transaction_status
        - transaction_id
      properties:
        order_id:
          type: string
        status_code:
          type: string
        gross_amount:
          type: string
        signature_key:
          type: string
        transaction_status:
          type: string
        transaction_id:
          type: string
        fraud_status:
          type: string
    WebhookAck:
      type: object
      required:
        - received
        - duplicate
      properties:
        received:
          type: boolean
        duplicate:
          type: boolean
    BiteshipNotification:
      type: object
      description: Payload webhook status order Biteship (nama field milik Biteship).
      required:
        - event
        - order_id
        - status
      properties:
        event:
          type: string
          example: order.status
        order_id:
          type: string
        courier_waybill_id:
          type: string
        status:
          type: string
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
        totpCode:
          type: string
          pattern: ^[0-9]{6}$
    AccessToken:
      type: object
      required:
        - accessToken
        - expiresAt
      properties:
        accessToken:
          type: string
        expiresAt:
          type: string
          format: date-time
    ReauthRequest:
      type: object
      properties:
        password:
          type: string
        totpCode:
          type: string
          pattern: ^[0-9]{6}$
    PasswordForgotRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
    PasswordTokenInfo:
      type: object
      required:
        - email
        - fullName
        - purpose
      properties:
        email:
          type: string
        fullName:
          type: string
        purpose:
          type: string
          enum:
            - invite
            - reset
    PasswordSetupRequest:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 10
          maxLength: 128
    PasswordChangeRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 10
          maxLength: 128
    MfaSetup:
      type: object
      required:
        - secret
        - otpauthUrl
        - qrCodeDataUrl
      properties:
        secret:
          type: string
        otpauthUrl:
          type: string
        qrCodeDataUrl:
          type: string
          description: Gambar PNG QR code dalam format data URL.
    MfaActivateRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          pattern: ^[0-9]{6}$
    CurrentUser:
      type: object
      required:
        - id
        - email
        - fullName
        - roles
        - permissions
        - isMfaEnabled
        - mfaEnrollmentRequired
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        fullName:
          type: string
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
          example:
            - catalog.product.read
            - catalog.product.write
        isMfaEnabled:
          type: boolean
        mfaEnrollmentRequired:
          type: boolean
          description: Role user mewajibkan MFA tetapi MFA belum aktif; semua menu lain terkunci sampai MFA aktif.
    Pagination:
      type: object
      description: Metadata pagination standar (Technical Guideline 8.2).
      required:
        - page
        - pageSize
        - totalItems
        - totalPages
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 200
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
    UserRoleAssignment:
      type: object
      required:
        - code
      properties:
        code:
          type: string
        name:
          type: string
          readOnly: true
        scopeDivisionId:
          type: string
          format: uuid
          nullable: true
    User:
      type: object
      required:
        - id
        - email
        - fullName
        - roles
        - isActive
        - isMfaEnabled
        - hasPassword
        - createdAt
        - updatedAt
        - version
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        fullName:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/UserRoleAssignment'
        divisionId:
          type: string
          format: uuid
          nullable: true
        employeeId:
          type: string
          format: uuid
          nullable: true
        isActive:
          type: boolean
        isMfaEnabled:
          type: boolean
        hasPassword:
          type: boolean
          description: false berarti undangan belum diterima.
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
    UserList:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/User'
    UserInput:
      type: object
      required:
        - email
        - fullName
        - roles
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        fullName:
          type: string
          minLength: 1
          maxLength: 120
        roles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/UserRoleAssignment'
        divisionId:
          type: string
          format: uuid
          nullable: true
        employeeId:
          type: string
          format: uuid
          nullable: true
    UserUpdate:
      type: object
      required:
        - fullName
        - roles
        - version
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 120
        roles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/UserRoleAssignment'
        divisionId:
          type: string
          format: uuid
          nullable: true
        employeeId:
          type: string
          format: uuid
          nullable: true
        version:
          type: integer
    VersionInput:
      type: object
      required:
        - version
      properties:
        version:
          type: integer
          description: Versi terakhir yang dilihat user (optimistic locking).
    Role:
      type: object
      required:
        - id
        - code
        - name
        - description
        - requiresMfa
        - hasDivisionScope
        - permissions
        - version
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type: string
        requiresMfa:
          type: boolean
        hasDivisionScope:
          type: boolean
        permissions:
          type: array
          items:
            type: string
        version:
          type: integer
    RolePermissionsInput:
      type: object
      required:
        - permissions
        - version
      properties:
        permissions:
          type: array
          items:
            type: string
        version:
          type: integer
    Permission:
      type: object
      required:
        - code
        - module
        - description
        - requiresReauth
      properties:
        code:
          type: string
        module:
          type: string
        description:
          type: string
        requiresReauth:
          type: boolean
    AuditAction:
      type: string
      enum:
        - create
        - update
        - delete
        - restore
        - status_change
        - approve
        - reject
        - submit
        - post
        - cancel
        - login
        - login_failed
        - logout
        - import
        - export
    AuditChange:
      type: object
      properties:
        from: {}
        to: {}
    AuditLog:
      type: object
      required:
        - id
        - actorId
        - actorName
        - action
        - entityType
        - entityId
        - entityLabel
        - changes
        - note
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
        actorName:
          type: string
        action:
          $ref: '#/components/schemas/AuditAction'
        entityType:
          type: string
        entityId:
          type: string
          format: uuid
        entityLabel:
          type: string
        changes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AuditChange'
        note:
          type: string
        ip:
          type: string
        createdAt:
          type: string
          format: date-time
    AuditLogList:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AuditLog'
    Money:
      type: string
      description: Nominal Rupiah sebagai string desimal 2 angka di belakang koma (Technical Guideline 10.5).
      pattern: ^-?[0-9]{1,16}(\.[0-9]{1,2})?$
      example: '1250000.00'
    ApprovalStatus:
      type: string
      enum:
        - pending_approval
        - approved
        - rejected
        - cancelled
    ApprovalStepStatus:
      type: string
      description: '`waiting` belum aktif, `pending` menunggu keputusan, `skipped` tidak diputuskan karena dokumen ditolak/dibatalkan.'
      enum:
        - waiting
        - pending
        - approved
        - rejected
        - skipped
    ApprovalStep:
      type: object
      required:
        - level
        - approverRole
        - approverRoleName
        - status
        - note
        - decidedByName
      properties:
        level:
          type: integer
        approverRole:
          type: string
        approverRoleName:
          type: string
        approverUserId:
          type: string
          format: uuid
          nullable: true
        approverUserName:
          type: string
          nullable: true
        substituteUserId:
          type: string
          format: uuid
          nullable: true
        substituteUserName:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/ApprovalStepStatus'
        decidedById:
          type: string
          format: uuid
          nullable: true
        decidedByName:
          type: string
        delegatedFromName:
          type: string
          nullable: true
          description: Terisi jika keputusan diambil penerima delegasi atas nama approver ini.
        note:
          type: string
        activatedAt:
          type: string
          format: date-time
          nullable: true
        decidedAt:
          type: string
          format: date-time
          nullable: true
    ApprovalRequest:
      type: object
      required:
        - id
        - subjectType
        - subjectTypeLabel
        - subjectId
        - subjectLabel
        - subjectLink
        - summary
        - amount
        - requestedById
        - requestedByName
        - status
        - currentLevel
        - totalLevels
        - steps
        - createdAt
        - version
        - allowedActions
      properties:
        id:
