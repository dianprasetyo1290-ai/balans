          $ref: '#/components/responses/Problem'
  /api/v1/special-prices/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      operationId: deleteSpecialPrice
      tags:
        - pricing
      summary: Menghapus harga khusus yang belum pernah berlaku
      parameters:
