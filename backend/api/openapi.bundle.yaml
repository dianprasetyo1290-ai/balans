          type: string
    JournalLine:
      type: object
      required:
        - lineNo
        - accountId
        - accountCode
        - accountName
        - debit
        - credit
        - memo
      properties:
        lineNo:
          type: integer
        accountId:
          type: string
          format: uuid
        accountCode:
          type: string
        accountName:
          type: string
        debit:
          $ref: '#/components/schemas/Money'
        credit:
          $ref: '#/components/schemas/Money'
        channel:
          allOf:
            - $ref: '#/components/schemas/DimensionRef'
          nullable: true
        subChannel:
          allOf:
            - $ref: '#/components/schemas/DimensionRef'
          nullable: true
        division:
          allOf:
            - $ref: '#/components/schemas/DimensionRef'
          nullable: true
        campaign:
          allOf:
            - $ref: '#/components/schemas/DimensionRef'
          nullable: true
        partyType:
          type: string
          nullable: true
        partyId:
          type: string
          format: uuid
          nullable: true
        amountKey:
          type: string
          nullable: true
        memo:
          type: string
    JournalEntry:
      allOf:
        - $ref: '#/components/schemas/JournalEntrySummary'
        - type: object
          required:
            - lines
            - totalDebit
            - totalCredit
            - allowedActions
          properties:
            lines:
              type: array
              items:
                $ref: '#/components/schemas/JournalLine'
            totalDebit:
              $ref: '#/components/schemas/Money'
            totalCredit:
              $ref: '#/components/schemas/Money'
            allowedActions:
              type: array
              items:
                type: string
                enum:
                  - edit
                  - delete
                  - post
                  - reverse
    ManualJournalUpdate:
      allOf:
        - $ref: '#/components/schemas/ManualJournalFields'
        - $ref: '#/components/schemas/VersionInput'
    JournalReverseInput:
      type: object
      required:
        - version
        - businessDate
        - reason
      properties:
        version:
          type: integer
        businessDate:
          $ref: '#/components/schemas/BusinessDate'
        reason:
          type: string
          maxLength: 400
    GeneralLedgerLine:
      type: object
      required:
        - entryId
        - businessDate
        - entryType
        - sourceType
        - sourceLabel
        - description
        - lineNo
        - debit
        - credit
        - balance
        - memo
      properties:
        entryId:
          type: string
          format: uuid
        number:
          type: string
          nullable: true
        businessDate:
          $ref: '#/components/schemas/BusinessDate'
        entryType:
          $ref: '#/components/schemas/JournalEntryType'
        sourceType:
          type: string
        sourceLabel:
          type: string
        description:
          type: string
        lineNo:
          type: integer
        debit:
          $ref: '#/components/schemas/Money'
        credit:
          $ref: '#/components/schemas/Money'
        balance:
          $ref: '#/components/schemas/Money'
        memo:
          type: string
        channel:
          allOf:
            - $ref: '#/components/schemas/DimensionRef'
          nullable: true
        subChannel:
          allOf:
            - $ref: '#/components/schemas/DimensionRef'
          nullable: true
        division:
          allOf:
            - $ref: '#/components/schemas/DimensionRef'
          nullable: true
        campaign:
          allOf:
            - $ref: '#/components/schemas/DimensionRef'
          nullable: true
    GeneralLedger:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required:
            - account
            - dateFrom
            - dateTo
            - openingBalance
            - periodDebit
            - periodCredit
            - closingBalance
            - items
          properties:
            account:
              $ref: '#/components/schemas/Account'
            dateFrom:
              $ref: '#/components/schemas/BusinessDate'
            dateTo:
              $ref: '#/components/schemas/BusinessDate'
            openingBalance:
              $ref: '#/components/schemas/Money'
            periodDebit:
              $ref: '#/components/schemas/Money'
            periodCredit:
              $ref: '#/components/schemas/Money'
            closingBalance:
              $ref: '#/components/schemas/Money'
            items:
              type: array
              items:
                $ref: '#/components/schemas/GeneralLedgerLine'
    DocumentSequence:
      type: object
      required:
        - documentType
        - label
        - assignedAt
        - year
        - lastNumber
        - example
      properties:
        documentType:
          type: string
          example: JV
        label:
          type: string
          example: Jurnal
        assignedAt:
          type: string
          description: Saat nomor diberikan, mis. `Posting` atau `Submit`.
        year:
          type: integer
        lastNumber:
          type: integer
          format: int64
          description: Nomor urut terakhir yang terpakai; 0 = belum ada dokumen pada tahun ini.
        lastIssuedAt:
          type: string
          format: date-time
          nullable: true
        example:
          type: string
          description: Contoh nomor berikutnya, mis. `JV/2026/10/00013`.
    DocumentSequenceList:
      type: object
      required:
        - year
        - items
      properties:
        year:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/DocumentSequence'
  responses:
    Problem:
      description: Error standar (problem+json)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  parameters:
    RefreshCookie:
      name: balans_refresh
      in: cookie
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID per percobaan submit (Technical Guideline 7.1).
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Sort:
      name: sort
      in: query
      description: Daftar field dipisah koma; awalan minus untuk descending, mis. `-createdAt,sku`.
      schema:
        type: string
    Search:
      name: q
      in: query
      schema:
        type: string
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Version:
      name: version
      in: query
      required: true
      description: Versi terakhir yang dilihat user (optimistic locking).
      schema:
        type: integer
    IncludeInactive:
      name: includeInactive
      in: query
      schema:
        type: boolean
        default: false
