      summary: Status, progress, dan ringkasan job impor
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Job impor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        default:
          $ref: '#/components/responses/Problem'
