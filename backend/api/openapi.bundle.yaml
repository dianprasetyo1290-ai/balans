            - $ref: '#/components/schemas/DiscountValue'
          nullable: true
    DiscountCheckOutcome:
      type: object
      required:
        - discountAmount
        - discountPercent
        - exceedsLimit
      properties:
        discountAmount:
          $ref: '#/components/schemas/Money'
        discountPercent:
          $ref: '#/components/schemas/PricingPercent'
        exceedsLimit:
          type: boolean
    DiscountCheckResult:
      type: object
      required:
        - maxLineDiscountPercent
        - maxDocumentDiscountPercent
        - lines
        - document
        - subtotalAmount
        - totalDiscountAmount
        - requiresApproval
      properties:
        maxLineDiscountPercent:
          $ref: '#/components/schemas/PricingPercent'
        maxDocumentDiscountPercent:
          $ref: '#/components/schemas/PricingPercent'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/DiscountCheckOutcome'
        document:
          $ref: '#/components/schemas/DiscountCheckOutcome'
        subtotalAmount:
          $ref: '#/components/schemas/Money'
        totalDiscountAmount:
          $ref: '#/components/schemas/Money'
        requiresApproval:
          type: boolean
          description: Diskon di atas batas → Sales Order butuh approval `sales_order_discount` (Head Sales).
    DataExchangeColumn:
      type: object
      required:
        - key
        - header
        - required
        - columnType
        - options
      properties:
        key:
          type: string
          description: Nama field (dipakai di `values` dan `errors[].column` preview).
        header:
          type: string
        required:
          type: boolean
        columnType:
          type: string
          enum:
            - text
            - integer
            - decimal
            - date
            - choice
            - bool
        options:
          type: array
          items:
            type: string
        sensitive:
          type: boolean
    DataExchangeKind:
      type: object
      required:
        - kind
        - label
        - canImport
        - canExport
        - uploadOwnerType
        - columns
      properties:
        kind:
          type: string
          example: catalog.product
        label:
          type: string
          example: Produk
        canImport:
          type: boolean
        canExport:
          type: boolean
        uploadOwnerType:
          type: string
          example: import.catalog.product
        maxFileBytes:
          type: integer
          format: int64
        columns:
          type: array
          items:
            $ref: '#/components/schemas/DataExchangeColumn'
    DataExchangeKindList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DataExchangeKind'
    ImportJob:
      type: object
      required:
        - id
        - kind
        - kindLabel
        - fileName
        - status
        - totalRows
        - processedRows
        - validRows
        - errorRows
        - committedRows
        - progress
        - message
        - allowedActions
        - createdBy
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        kindLabel:
          type: string
        fileName:
          type: string
        status:
          type: string
          enum:
            - uploaded
            - validating
            - validated
            - committing
            - completed
            - failed
            - cancelled
        totalRows:
          type: integer
        processedRows:
          type: integer
        validRows:
          type: integer
        errorRows:
          type: integer
        committedRows:
          type: integer
        progress:
          type: integer
          minimum: 0
          maximum: 100
        message:
          type: string
          description: Alasan gagal untuk status `failed`.
        allowedActions:
          type: array
          items:
            type: string
            enum:
              - commit
              - cancel
              - download_errors
        validatedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ImportJobList:
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ImportJob'
        pagination:
          $ref: '#/components/schemas/Pagination'
    ImportJobInput:
      type: object
      required:
        - kind
        - fileId
      properties:
        kind:
          type: string
        fileId:
          type: string
          format: uuid
    ImportJobRowError:
      type: object
      required:
        - message
      properties:
        column:
          type: string
          description: Key kolom; kosong = error baris.
        message:
          type: string
    ImportJobRow:
      type: object
      required:
        - rowNumber
        - isValid
        - values
        - errors
      properties:
        rowNumber:
          type: integer
          description: Nomor baris di Excel (header = 1).
        isValid:
          type: boolean
        values:
          type: object
          additionalProperties:
            type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ImportJobRowError'
    ImportJobRowList:
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ImportJobRow'
        pagination:
          $ref: '#/components/schemas/Pagination'
    DataExchangeFileLink:
      type: object
      required:
        - url
        - expiresAt
      properties:
        url:
          type: string
        expiresAt:
          type: string
          format: date-time
    ExportJob:
      type: object
      required:
        - id
        - kind
        - kindLabel
        - status
        - totalRows
        - fileName
        - message
        - createdBy
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        kindLabel:
          type: string
        status:
          type: string
          enum:
            - queued
            - running
            - completed
            - failed
        totalRows:
          type: integer
        fileName:
          type: string
        message:
          type: string
        completedAt:
          type: string
          format: date-time
          nullable: true
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ExportJobList:
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExportJob'
        pagination:
          $ref: '#/components/schemas/Pagination'
    ExportJobInput:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
  parameters:
    Search:
      name: q
      in: query
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID per percobaan submit (Technical Guideline 7.1).
      schema:
        type: string
        format: uuid
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RefreshCookie:
      name: balans_refresh
      in: cookie
      required: false
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Sort:
      name: sort
      in: query
      description: Daftar field dipisah koma; awalan minus untuk descending, mis. `-createdAt,sku`.
      schema:
        type: string
    Version:
      name: version
      in: query
      required: true
      description: Versi terakhir yang dilihat user (optimistic locking).
      schema:
        type: integer
    IncludeInactive:
      name: includeInactive
      in: query
      schema:
        type: boolean
        default: false
    PartyVersion:
      name: version
      in: query
      required: true
      description: Versi terakhir yang dilihat user (optimistic locking).
      schema:
        type: integer
    FileExpires:
      name: exp
      in: query
      required: true
      description: Waktu kedaluwarsa URL (Unix detik).
      schema:
        type: integer
        format: int64
    FileSignature:
      name: sig
      in: query
      required: true
      schema:
        type: string
    PricingVersion:
      name: version
      in: query
      required: true
      description: Versi terakhir yang dilihat user (optimistic locking).
      schema:
        type: integer
    PricingIncludeEnded:
      name: includeEnded
      in: query
      description: Tampilkan juga data yang periodenya sudah berakhir (riwayat).
      schema:
        type: boolean
        default: false
    DataExchangeKindPath:
      name: kind
      in: path
      required: true
      description: Jenis data = resource permission, mis. `catalog.product`.
      schema:
        type: string
    DataExchangeKindQuery:
      name: kind
      in: query
      schema:
        type: string
  responses:
    Problem:
      description: Error standar (problem+json)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
