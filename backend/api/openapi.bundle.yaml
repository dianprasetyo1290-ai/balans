      responses:
        '201':
          description: Draft dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Repacking'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/repackings/{id}:
    get:
      operationId: getRepacking
