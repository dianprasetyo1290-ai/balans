          description: Ditandai sudah dibaca
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/products:
    get:
      operationId: listProducts
      tags:
        - catalog
      summary: Daftar produk (Produk Jadi, Packaging, Material, Bundling)
      description: |
        Produk yang dihapus tidak tampil kecuali `deleted=true` (hanya produk terhapus, untuk dipulihkan Admin Sistem).
        `q` mencari SKU, nama, varian, atau barcode persis.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Search'
        - name: productType
          in: query
          description: Bisa lebih dari satu, mis. `productType=packaging&productType=reprocess_material`.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ProductType'
        - name: isBundle
          in: query
          schema:
            type: boolean
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: isActive
          in: query
          schema:
            type: boolean
        - name: deleted
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Daftar produk; field sort yang diizinkan `sku`, `name`, `createdAt`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createProduct
      tags:
        - catalog
      summary: Membuat produk (MD-01, MD-02, MD-03)
      description: |
        SKU unik permanen dan tidak bisa dipakai ulang walau produk dihapus (`DUPLICATE_CODE`). Produk Jadi wajib
        umur simpan dan tipe kemasan dan selalu memakai batch. Bundel virtual wajib punya komponen Produk Jadi
        non-bundel dan tidak punya stok, batch, maupun umur simpan sendiri.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Produk dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/products/lookup:
    get:
      operationId: lookupProduct
      tags:
        - catalog
      summary: Mencari satu produk aktif berdasarkan SKU atau barcode persis (pindai barcode)
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Produk dengan SKU atau barcode tersebut
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/products/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getProduct
      tags:
        - catalog
      summary: Detail produk (produk terhapus tetap bisa dibuka untuk dokumen lama)
      responses:
        '200':
          description: Detail produk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updateProduct
      tags:
        - catalog
      summary: Mengubah produk (optimistic locking dengan `version`)
      description: SKU, jenis produk, dan status bundel tidak bisa diubah.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
      responses:
        '200':
          description: Produk diubah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteProduct
      tags:
        - catalog
      summary: Menghapus produk (soft delete; tetap tampil di dokumen lama)
      description: Produk yang masih menjadi komponen bundel aktif tidak bisa dihapus (`INVALID_STATE_TRANSITION`).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Produk dihapus
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/products/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: restoreProduct
      tags:
        - catalog
      summary: Memulihkan produk yang dihapus (hanya Admin Sistem)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Produk dipulihkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/product-categories:
    get:
      operationId: listProductCategories
      tags:
        - catalog
      summary: Daftar kategori produk
      parameters:
        - name: deleted
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Kategori urut kode
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductCategory'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createProductCategory
      tags:
        - catalog
      summary: Membuat kategori produk (kode unik permanen)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCategoryInput'
      responses:
        '201':
          description: Kategori dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCategory'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/product-categories/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      operationId: updateProductCategory
      tags:
        - catalog
      summary: Mengubah nama kategori
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCategoryUpdate'
      responses:
        '200':
          description: Kategori diubah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCategory'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteProductCategory
      tags:
        - catalog
      summary: Menghapus kategori (soft delete)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Kategori dihapus
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/product-categories/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: restoreProductCategory
      tags:
        - catalog
      summary: Memulihkan kategori yang dihapus (hanya Admin Sistem)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Kategori dipulihkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCategory'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/warehouses:
    get:
      operationId: listWarehouses
      tags:
        - warehouse
      summary: Daftar gudang fisik
      description: Gudang yang dihapus tidak tampil kecuali `deleted=true` (hanya gudang terhapus).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Search'
        - name: isActive
          in: query
          schema:
            type: boolean
        - name: deleted
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Daftar gudang; field sort yang diizinkan `code`, `name`, `createdAt`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarehouseList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createWarehouse
      tags:
        - warehouse
      summary: Membuat gudang fisik beserta lokasi standarnya (MD-09, F1-114)
