        isBundle:
          type: boolean
        categoryId:
          type: string
          format: uuid
          nullable: true
        categoryName:
          type: string
          nullable: true
        minStockQty:
          allOf:
            - $ref: '#/components/schemas/Quantity'
          nullable: true
        unitsPerCarton:
          type: integer
          nullable: true
        isActive:
          type: boolean
        barcodes:
          type: array
          items:
            $ref: '#/components/schemas/ProductBarcode'
        primaryBarcode:
          type: string
          nullable: true
          description: Barcode utama yang dicetak di label produk.
        bundleComponents:
          type: array
          items:
            $ref: '#/components/schemas/BundleComponent'
        deletedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
        allowedActions:
          type: array
          items:
            $ref: '#/components/schemas/ProductAction'
    ProductList:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Product'
    ProductBarcodeInput:
      type: object
      required:
        - barcode
        - isPrimary
      properties:
        barcode:
          type: string
          minLength: 1
          maxLength: 48
        isPrimary:
          type: boolean
    BundleComponentInput:
      type: object
      required:
        - componentProductId
        - qty
      properties:
        componentProductId:
          type: string
          format: uuid
        qty:
          $ref: '#/components/schemas/Quantity'
    ProductFields:
      type: object
      required:
        - name
        - uom
        - hasBatch
        - isActive
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        variant:
          type: string
          maxLength: 80
        packagingType:
          allOf:
            - $ref: '#/components/schemas/PackagingType'
          nullable: true
        uom:
          type: string
          minLength: 1
          maxLength: 20
          example: pcs
        shelfLifeDays:
          type: integer
          minimum: 1
          nullable: true
          description: Umur simpan dalam hari; wajib untuk Produk Jadi non-bundel.
        hasBatch:
          type: boolean
          description: Hanya dipakai untuk Packaging & Material; Produk Jadi selalu memakai batch, bundel tidak.
        categoryId:
          type: string
          format: uuid
          nullable: true
        minStockQty:
          allOf:
            - $ref: '#/components/schemas/Quantity'
          nullable: true
        unitsPerCarton:
          type: integer
          minimum: 1
          nullable: true
        isActive:
          type: boolean
        barcodes:
          type: array
          description: Tepat satu barcode utama jika ada barcode; barcode unik di semua produk.
          items:
            $ref: '#/components/schemas/ProductBarcodeInput'
        bundleComponents:
          type: array
          description: Wajib untuk bundel; komponen harus Produk Jadi non-bundel yang aktif.
          items:
            $ref: '#/components/schemas/BundleComponentInput'
    ProductInput:
      allOf:
        - $ref: '#/components/schemas/ProductFields'
        - type: object
          required:
            - sku
            - productType
            - isBundle
          properties:
            sku:
              type: string
              minLength: 1
              maxLength: 40
              description: Huruf besar, angka, dan tanda minus; huruf kecil diubah menjadi besar.
            productType:
              $ref: '#/components/schemas/ProductType'
            isBundle:
              type: boolean
              description: Bundel virtual tidak punya stok sendiri; stok komponen terpotong saat terjual (MD-03).
    ProductUpdate:
      allOf:
        - $ref: '#/components/schemas/ProductFields'
        - $ref: '#/components/schemas/VersionInput'
    ProductCategory:
      type: object
      required:
        - id
        - code
        - name
        - createdAt
        - updatedAt
        - version
        - allowedActions
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        deletedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
        allowedActions:
          type: array
          items:
            $ref: '#/components/schemas/ProductAction'
    ProductCategoryInput:
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 20
        name:
          type: string
          minLength: 1
          maxLength: 80
    ProductCategoryUpdate:
      allOf:
        - type: object
          required:
            - name
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 80
        - $ref: '#/components/schemas/VersionInput'
    RecordAction:
      type: string
      enum:
        - update
        - delete
        - restore
    Warehouse:
      type: object
      required:
        - id
        - code
        - name
        - address
        - isActive
        - createdAt
        - updatedAt
        - version
        - allowedActions
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        address:
          type: string
        isActive:
          type: boolean
        deletedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
        allowedActions:
          type: array
          items:
            $ref: '#/components/schemas/RecordAction'
    WarehouseList:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Warehouse'
    WarehouseFields:
      type: object
      required:
        - name
        - isActive
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        address:
          type: string
          maxLength: 500
        isActive:
          type: boolean
    WarehouseInput:
      allOf:
        - $ref: '#/components/schemas/WarehouseFields'
        - type: object
          required:
            - code
          properties:
            code:
              type: string
              minLength: 1
              maxLength: 20
    WarehouseUpdate:
      allOf:
        - $ref: '#/components/schemas/WarehouseFields'
        - $ref: '#/components/schemas/VersionInput'
    LocationType:
      type: string
      description: |
        Di dalam gudang: `inbound`, `finished_goods` (FG Non-Ecommerce), `ecommerce` (E-commerce Stock / Petty Stock),
        `raw_material` (RM), `goods_material` (GM), `returns`, `event`. Eksternal: `toll_manufacturer` (maklon),
        `consignment`, `vending_buffer`, `vending_machine`.
      enum:
        - inbound
        - finished_goods
        - ecommerce
        - raw_material
        - goods_material
        - returns
        - event
        - toll_manufacturer
        - consignment
        - vending_buffer
        - vending_machine
    ExternalPartyType:
      type: string
      enum:
        - supplier
        - partner
        - vending_machine
    Location:
      type: object
      required:
        - id
        - code
        - name
        - locationType
        - locationTypeLabel
        - isExternal
        - isSellable
        - isStandard
        - isActive
        - createdAt
        - updatedAt
        - version
        - allowedActions
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        locationType:
          $ref: '#/components/schemas/LocationType'
        locationTypeLabel:
          type: string
        warehouseId:
          type: string
          format: uuid
          nullable: true
        warehouseName:
          type: string
          nullable: true
        externalPartyType:
          allOf:
            - $ref: '#/components/schemas/ExternalPartyType'
          nullable: true
        externalPartyId:
          type: string
          format: uuid
          nullable: true
        isExternal:
          type: boolean
        isSellable:
          type: boolean
          description: Stok di lokasi ini bisa dialokasikan ke penjualan.
        isStandard:
          type: boolean
          description: Lokasi standar dibuat otomatis bersama gudang dan ikut terhapus/dipulihkan bersama gudang.
        isActive:
          type: boolean
        deletedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
        allowedActions:
          type: array
          items:
            $ref: '#/components/schemas/RecordAction'
    LocationList:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Location'
    LocationInput:
      type: object
      required:
        - code
        - name
        - locationType
        - isActive
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 30
        name:
          type: string
          minLength: 1
          maxLength: 120
        locationType:
          $ref: '#/components/schemas/LocationType'
        warehouseId:
          type: string
          format: uuid
          nullable: true
          description: Wajib untuk lokasi internal; kosong untuk lokasi eksternal.
        externalPartyType:
          allOf:
            - $ref: '#/components/schemas/ExternalPartyType'
          nullable: true
        externalPartyId:
          type: string
          format: uuid
          nullable: true
          description: ID pemasok/maklon, mitra, atau mesin vending di modul pemiliknya.
        isActive:
          type: boolean
    LocationUpdate:
      allOf:
        - type: object
          required:
            - name
            - isActive
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 120
            isActive:
              type: boolean
        - $ref: '#/components/schemas/VersionInput'
  responses:
    Problem:
      description: Error standar (problem+json)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  parameters:
    RefreshCookie:
      name: balans_refresh
      in: cookie
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID per percobaan submit (Technical Guideline 7.1).
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Sort:
      name: sort
      in: query
      description: Daftar field dipisah koma; awalan minus untuk descending, mis. `-createdAt,sku`.
      schema:
        type: string
    Search:
      name: q
      in: query
      schema:
        type: string
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
