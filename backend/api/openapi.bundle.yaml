openapi: 3.0.3
info:
  title: Balans Platform API
  version: 0.0.0
  description: |
    Kontrak API back-office Balans. File ini adalah sumber kebenaran (Technical Guideline 8.1).
    Server Go dan client TypeScript digenerate dari spec ini. Path dipecah per modul di folder paths/.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: system
    description: Kesehatan proses dan informasi sistem
  - name: sales
    description: Penjualan, termasuk webhook payment gateway
  - name: logistics
    description: Pengiriman, termasuk webhook kurir
  - name: identity
    description: Sesi, pengguna, dan permission (R1.1)
  - name: audit
    description: Riwayat perubahan (audit trail)
  - name: catalog
    description: Master produk, packaging, material, bundling (R1.1)
  - name: warehouse
    description: Gudang dan lokasi stok (R1.1)
paths:
  /healthz:
    get:
      operationId: getHealth
      security: []
      tags:
        - system
      summary: Proses hidup
      responses:
        '200':
          description: Proses berjalan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /readyz:
    get:
      operationId: getReadiness
      security: []
      tags:
        - system
      summary: Siap menerima trafik (DB terhubung dan migrasi terbaru)
      responses:
        '200':
          description: Siap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
        '503':
          description: Belum siap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
  /api/v1/system/info:
    get:
      operationId: getSystemInfo
      security: []
      tags:
        - system
      summary: Informasi versi, lingkungan, dan modul aktif
      description: Dipakai halaman Tentang Sistem dan untuk menentukan menu modul yang tampil (Technical Guideline 14.5).
      responses:
        '200':
          description: Informasi sistem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
        '500':
          description: Kesalahan sistem
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/webhooks/midtrans:
    post:
      operationId: receiveMidtransWebhook
      security: []
      tags:
        - sales
      summary: Notifikasi pembayaran Midtrans
      description: |
        Signature diverifikasi sebelum payload disimpan. Event disimpan di webhook_events (dedup per event)
        dan diproses job payment_webhook.process yang mengonfirmasi ulang status ke Midtrans
        (Technical Guideline 7.4, 9.3). Endpoint ini tidak memakai Idempotency-Key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MidtransNotification'
      responses:
        '200':
          description: Event diterima atau sudah pernah diterima
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAck'
        '400':
          description: Payload tidak bisa dibaca
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Signature tidak valid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/webhooks/biteship:
    post:
      operationId: receiveBiteshipWebhook
      security: []
      tags:
        - logistics
      summary: Notifikasi status pengiriman Biteship
      description: |
        Signature di header X-Biteship-Signature diverifikasi sebelum payload disimpan. Event diproses job
        shipment_webhook.process yang mengonfirmasi ulang status ke Biteship. Endpoint ini tidak memakai Idempotency-Key.
      parameters:
        - name: X-Biteship-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BiteshipNotification'
      responses:
        '200':
          description: Event diterima atau sudah pernah diterima
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAck'
        '400':
          description: Payload tidak bisa dibaca
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Signature tidak valid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/login:
    post:
      operationId: login
      security: []
      tags:
        - identity
      summary: Masuk dengan email dan password
      description: |
        Mengembalikan access token (15 menit, disimpan di memori FE) dan memasang refresh token di cookie
        HttpOnly `Path=/api/v1/auth` (Technical Guideline 9.1). Gagal login selalu `AUTH_INVALID_CREDENTIALS`;
        5 kali gagal dalam 15 menit → `AUTH_ACCOUNT_LOCKED`. User ber-MFA → `AUTH_MFA_REQUIRED` lalu kirim ulang dengan `totpCode`.
        Tidak memakai Idempotency-Key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Berhasil masuk
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      security: []
      tags:
        - identity
      summary: Memperbarui access token dengan refresh token (rotasi)
      description: Refresh token lama langsung tidak berlaku. Pemakaian ulang token lama mencabut seluruh keluarga sesi.
      parameters:
        - $ref: '#/components/parameters/RefreshCookie'
      responses:
        '200':
          description: Access token baru
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/logout:
    post:
      operationId: logout
      security: []
      tags:
        - identity
      summary: Keluar dan mencabut sesi aktif
      description: Sesi dicari dari cookie refresh token, sehingga tetap bisa keluar walaupun access token sudah kedaluwarsa.
      parameters:
        - $ref: '#/components/parameters/RefreshCookie'
      responses:
        '204':
          description: Sesi dicabut
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/reauth:
    post:
      operationId: reauthenticate
      tags:
        - identity
      summary: Konfirmasi identitas untuk aksi sensitif
      description: Mengembalikan access token baru dengan claim `reauth_at` yang berlaku 5 menit (Technical Guideline 9.1).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthRequest'
      responses:
        '200':
          description: Access token baru
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/password/forgot:
    post:
      operationId: requestPasswordReset
      security: []
      tags:
        - identity
      summary: Meminta tautan atur ulang password
      description: Selalu 204 walaupun email tidak terdaftar, agar tidak bisa dipakai menebak email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordForgotRequest'
      responses:
        '204':
          description: Diterima
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/password/token:
    get:
      operationId: getPasswordToken
      security: []
      tags:
        - identity
      summary: Memeriksa tautan undangan atau atur ulang password
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tautan berlaku
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordTokenInfo'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/password/setup:
    post:
      operationId: setupPassword
      security: []
      tags:
        - identity
      summary: Mengatur password dari tautan undangan atau atur ulang
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordSetupRequest'
      responses:
        '204':
          description: Password tersimpan; semua sesi lama dicabut
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/password/change:
    post:
      operationId: changePassword
      tags:
        - identity
      summary: Mengganti password sendiri
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '204':
          description: Password diganti; sesi lain dicabut
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/mfa/setup:
    post:
      operationId: setupMfa
      tags:
        - identity
      summary: Membuat secret TOTP baru untuk didaftarkan di aplikasi autentikator
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Secret dan QR code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaSetup'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/mfa/activate:
    post:
      operationId: activateMfa
      tags:
        - identity
      summary: Mengaktifkan MFA dengan kode pertama dari aplikasi autentikator
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaActivateRequest'
      responses:
        '204':
          description: MFA aktif
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/me:
    get:
      operationId: getCurrentUser
      tags:
        - identity
      summary: User yang sedang login beserta permission
      description: Permission dimuat server-side dan tidak disimpan di token (Technical Guideline 9.1).
      responses:
        '200':
          description: Data user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/users:
    get:
      operationId: listUsers
      tags:
        - identity
      summary: Daftar pengguna
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Search'
        - name: isActive
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Daftar pengguna
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createUser
      tags:
        - identity
      summary: Membuat pengguna dan mengirim undangan atur password
      description: Pemberian role butuh re-autentikasi (`identity.user_role.write`).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '201':
          description: Pengguna dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/users/{id}:
    get:
      operationId: getUser
      tags:
        - identity
      summary: Detail pengguna
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Pengguna
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updateUser
      tags:
        - identity
      summary: Mengubah nama, divisi, dan role pengguna
      description: Perubahan role butuh re-autentikasi dan memutus semua sesi pengguna (< 30 detik).
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Pengguna diubah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/users/{id}/activate:
    post:
      operationId: activateUser
      tags:
        - identity
      summary: Mengaktifkan kembali pengguna
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionInput'
      responses:
        '200':
          description: Pengguna aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/users/{id}/deactivate:
    post:
      operationId: deactivateUser
      tags:
        - identity
      summary: Menonaktifkan pengguna dan memutus semua sesinya
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionInput'
      responses:
        '200':
          description: Pengguna nonaktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/users/{id}/resend-invitation:
    post:
      operationId: resendUserInvitation
      tags:
        - identity
      summary: Mengirim ulang undangan atur password
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Undangan dikirim
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/users/{id}/reset-mfa:
    post:
      operationId: resetUserMfa
      tags:
        - identity
      summary: Mereset MFA pengguna (HP hilang); pengguna mendaftar ulang saat masuk berikutnya
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: MFA direset
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/roles:
    get:
      operationId: listRoles
      tags:
        - identity
      summary: Daftar role beserta permission
      responses:
        '200':
          description: Daftar role
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/roles/{id}/permissions:
    put:
      operationId: setRolePermissions
      tags:
        - identity
      summary: Mengganti permission role (berlaku langsung, butuh re-autentikasi)
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolePermissionsInput'
      responses:
        '200':
          description: Role diubah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/permissions:
    get:
      operationId: listPermissions
      tags:
        - identity
      summary: Katalog permission
      responses:
        '200':
          description: Katalog permission
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Permission'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/audit-logs:
    get:
      operationId: listAuditLogs
      tags:
        - audit
      summary: Riwayat perubahan
      description: |
        Tanpa `entityId` butuh `audit.log.read`. Dengan `entityType` + `entityId` (tab Riwayat dokumen) cukup permission
        baca entitas tersebut. Field sensitif sudah dimask (Technical Guideline 6.6).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: entityType
          in: query
          schema:
            type: string
        - name: entityId
          in: query
          schema:
            type: string
            format: uuid
        - name: actorId
          in: query
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          schema:
            $ref: '#/components/schemas/AuditAction'
        - name: createdFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: createdTo
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Riwayat perubahan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogList'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/products:
    get:
      operationId: listProducts
      tags:
        - catalog
      summary: Daftar produk (Produk Jadi, Packaging, Material)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Search'
        - name: productType
          in: query
          schema:
            $ref: '#/components/schemas/ProductType'
        - name: isBundle
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Daftar produk; field sort yang diizinkan `sku`, `name`, `createdAt`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createProduct
      tags:
        - catalog
      summary: Membuat produk (MD-01, MD-02, MD-03)
      description: SKU unik permanen dan tidak bisa dipakai ulang walau produk dihapus (`DUPLICATE_CODE`).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Produk dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/products/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getProduct
      tags:
        - catalog
      summary: Detail produk
      responses:
        '200':
          description: Detail produk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updateProduct
      tags:
        - catalog
      summary: Mengubah produk (optimistic locking dengan `version`)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ProductInput'
                - type: object
                  required:
                    - version
                  properties:
                    version:
                      type: integer
      responses:
        '200':
          description: Produk diubah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteProduct
      tags:
        - catalog
      summary: Menghapus produk (soft delete; tetap tampil di dokumen lama)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Produk dihapus
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/warehouses:
    get:
      operationId: listWarehouses
      tags:
        - warehouse
      summary: Daftar gudang fisik
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Daftar gudang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarehouseList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createWarehouse
      tags:
        - warehouse
      summary: Membuat gudang fisik beserta lokasi standarnya (WMS-01)
      description: Lokasi Inbound, FG Non-Ecommerce, E-commerce Stock, Gudang Material, dan Gudang Retur dibuat otomatis (U-08).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarehouseInput'
      responses:
        '201':
          description: Gudang dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Warehouse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/locations:
    get:
      operationId: listLocations
      tags:
        - warehouse
      summary: Daftar lokasi stok (internal dan eksternal)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - name: warehouseId
          in: query
          schema:
            type: string
            format: uuid
        - name: locationType
          in: query
          schema:
            $ref: '#/components/schemas/LocationType'
      responses:
        '200':
          description: Daftar lokasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createLocation
      tags:
        - warehouse
      summary: Membuat lokasi (termasuk lokasi eksternal maklon, konsinyasi, buffer vending, mesin)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationInput'
      responses:
        '201':
          description: Lokasi dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token EdDSA 15 menit (Technical Guideline 9.1).
  schemas:
    Problem:
      type: object
      description: Format error RFC 7807 (Technical Guideline 8.3). Field code adalah kontrak stabil untuk FE.
      required:
        - type
        - title
        - status
        - code
        - detail
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          $ref: '#/components/schemas/ErrorCode'
        detail:
          type: string
