openapi: 3.0.3
info:
  title: Balans Platform API
  version: 0.0.0
  description: |
    Kontrak API back-office Balans. File ini adalah sumber kebenaran (Technical Guideline 8.1).
    Server Go dan client TypeScript digenerate dari spec ini. Path dipecah per modul di folder paths/.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: system
    description: Kesehatan proses dan informasi sistem
  - name: sales
    description: Penjualan, termasuk webhook payment gateway
  - name: logistics
    description: Pengiriman, termasuk webhook kurir
  - name: identity
    description: Sesi, pengguna, dan permission (R1.1)
  - name: audit
    description: Riwayat perubahan (audit trail)
  - name: approval
    description: Engine & inbox persetujuan (R1.1)
  - name: notification
    description: Notifikasi in-app (R1.1)
  - name: catalog
    description: Master produk, packaging, material, bundling (R1.1)
  - name: warehouse
    description: Gudang dan lokasi stok (R1.1)
paths:
  /healthz:
    get:
      operationId: getHealth
      security: []
      tags:
        - system
      summary: Proses hidup
      responses:
        '200':
          description: Proses berjalan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /readyz:
    get:
      operationId: getReadiness
      security: []
      tags:
        - system
      summary: Siap menerima trafik (DB terhubung dan migrasi terbaru)
      responses:
        '200':
          description: Siap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
        '503':
          description: Belum siap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
  /api/v1/system/info:
    get:
      operationId: getSystemInfo
      security: []
      tags:
        - system
      summary: Informasi versi, lingkungan, dan modul aktif
      description: Dipakai halaman Tentang Sistem dan untuk menentukan menu modul yang tampil (Technical Guideline 14.5).
      responses:
        '200':
          description: Informasi sistem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
        '500':
          description: Kesalahan sistem
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/webhooks/midtrans:
    post:
      operationId: receiveMidtransWebhook
      security: []
      tags:
        - sales
      summary: Notifikasi pembayaran Midtrans
      description: |
        Signature diverifikasi sebelum payload disimpan. Event disimpan di webhook_events (dedup per event)
        dan diproses job payment_webhook.process yang mengonfirmasi ulang status ke Midtrans
        (Technical Guideline 7.4, 9.3). Endpoint ini tidak memakai Idempotency-Key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MidtransNotification'
      responses:
        '200':
          description: Event diterima atau sudah pernah diterima
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAck'
        '400':
          description: Payload tidak bisa dibaca
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Signature tidak valid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/webhooks/biteship:
    post:
      operationId: receiveBiteshipWebhook
      security: []
      tags:
        - logistics
      summary: Notifikasi status pengiriman Biteship
      description: |
        Signature di header X-Biteship-Signature diverifikasi sebelum payload disimpan. Event diproses job
        shipment_webhook.process yang mengonfirmasi ulang status ke Biteship. Endpoint ini tidak memakai Idempotency-Key.
      parameters:
        - name: X-Biteship-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BiteshipNotification'
      responses:
        '200':
          description: Event diterima atau sudah pernah diterima
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAck'
        '400':
          description: Payload tidak bisa dibaca
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Signature tidak valid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/login:
    post:
      operationId: login
      security: []
      tags:
        - identity
      summary: Masuk dengan email dan password
      description: |
        Mengembalikan access token (15 menit, disimpan di memori FE) dan memasang refresh token di cookie
        HttpOnly `Path=/api/v1/auth` (Technical Guideline 9.1). Gagal login selalu `AUTH_INVALID_CREDENTIALS`;
        5 kali gagal dalam 15 menit → `AUTH_ACCOUNT_LOCKED`. User ber-MFA → `AUTH_MFA_REQUIRED` lalu kirim ulang dengan `totpCode`.
        Tidak memakai Idempotency-Key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Berhasil masuk
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      security: []
      tags:
        - identity
      summary: Memperbarui access token dengan refresh token (rotasi)
      description: Refresh token lama langsung tidak berlaku. Pemakaian ulang token lama mencabut seluruh keluarga sesi.
      parameters:
        - $ref: '#/components/parameters/RefreshCookie'
      responses:
        '200':
          description: Access token baru
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/logout:
    post:
      operationId: logout
      security: []
      tags:
        - identity
      summary: Keluar dan mencabut sesi aktif
      description: Sesi dicari dari cookie refresh token, sehingga tetap bisa keluar walaupun access token sudah kedaluwarsa.
      parameters:
        - $ref: '#/components/parameters/RefreshCookie'
      responses:
        '204':
          description: Sesi dicabut
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/reauth:
    post:
      operationId: reauthenticate
      tags:
        - identity
      summary: Konfirmasi identitas untuk aksi sensitif
      description: Mengembalikan access token baru dengan claim `reauth_at` yang berlaku 5 menit (Technical Guideline 9.1).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthRequest'
      responses:
        '200':
          description: Access token baru
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/password/forgot:
    post:
      operationId: requestPasswordReset
      security: []
      tags:
        - identity
      summary: Meminta tautan atur ulang password
      description: Selalu 204 walaupun email tidak terdaftar, agar tidak bisa dipakai menebak email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordForgotRequest'
      responses:
        '204':
          description: Diterima
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/password/token:
    get:
      operationId: getPasswordToken
      security: []
      tags:
        - identity
      summary: Memeriksa tautan undangan atau atur ulang password
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tautan berlaku
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordTokenInfo'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/password/setup:
    post:
      operationId: setupPassword
      security: []
      tags:
        - identity
      summary: Mengatur password dari tautan undangan atau atur ulang
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordSetupRequest'
      responses:
        '204':
          description: Password tersimpan; semua sesi lama dicabut
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/password/change:
    post:
      operationId: changePassword
      tags:
        - identity
      summary: Mengganti password sendiri
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '204':
          description: Password diganti; sesi lain dicabut
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/mfa/setup:
    post:
      operationId: setupMfa
      tags:
        - identity
      summary: Membuat secret TOTP baru untuk didaftarkan di aplikasi autentikator
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Secret dan QR code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaSetup'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/mfa/activate:
    post:
      operationId: activateMfa
      tags:
        - identity
      summary: Mengaktifkan MFA dengan kode pertama dari aplikasi autentikator
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaActivateRequest'
      responses:
        '204':
          description: MFA aktif
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/me:
    get:
      operationId: getCurrentUser
      tags:
        - identity
      summary: User yang sedang login beserta permission
      description: Permission dimuat server-side dan tidak disimpan di token (Technical Guideline 9.1).
      responses:
        '200':
          description: Data user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/users:
    get:
      operationId: listUsers
      tags:
        - identity
      summary: Daftar pengguna
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Search'
        - name: isActive
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Daftar pengguna
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createUser
      tags:
        - identity
      summary: Membuat pengguna dan mengirim undangan atur password
      description: Pemberian role butuh re-autentikasi (`identity.user_role.write`).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '201':
          description: Pengguna dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/users/{id}:
    get:
      operationId: getUser
      tags:
        - identity
      summary: Detail pengguna
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Pengguna
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updateUser
      tags:
        - identity
      summary: Mengubah nama, divisi, dan role pengguna
      description: Perubahan role butuh re-autentikasi dan memutus semua sesi pengguna (< 30 detik).
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Pengguna diubah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/users/{id}/activate:
    post:
      operationId: activateUser
      tags:
        - identity
      summary: Mengaktifkan kembali pengguna
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionInput'
      responses:
        '200':
          description: Pengguna aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/users/{id}/deactivate:
    post:
      operationId: deactivateUser
      tags:
        - identity
      summary: Menonaktifkan pengguna dan memutus semua sesinya
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionInput'
      responses:
        '200':
          description: Pengguna nonaktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/users/{id}/resend-invitation:
    post:
      operationId: resendUserInvitation
      tags:
        - identity
      summary: Mengirim ulang undangan atur password
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Undangan dikirim
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/users/{id}/reset-mfa:
    post:
      operationId: resetUserMfa
      tags:
        - identity
      summary: Mereset MFA pengguna (HP hilang); pengguna mendaftar ulang saat masuk berikutnya
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: MFA direset
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/roles:
    get:
      operationId: listRoles
      tags:
        - identity
      summary: Daftar role beserta permission
      responses:
        '200':
          description: Daftar role
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/roles/{id}/permissions:
    put:
      operationId: setRolePermissions
      tags:
        - identity
      summary: Mengganti permission role (berlaku langsung, butuh re-autentikasi)
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolePermissionsInput'
      responses:
        '200':
          description: Role diubah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/permissions:
    get:
      operationId: listPermissions
      tags:
        - identity
      summary: Katalog permission
      responses:
        '200':
          description: Katalog permission
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Permission'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/audit-logs:
    get:
      operationId: listAuditLogs
      tags:
        - audit
      summary: Riwayat perubahan
      description: |
        Tanpa `entityId` butuh `audit.log.read`. Dengan `entityType` + `entityId` (tab Riwayat dokumen) cukup permission
        baca entitas tersebut. Field sensitif sudah dimask (Technical Guideline 6.6).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: entityType
          in: query
          schema:
            type: string
        - name: entityId
          in: query
          schema:
            type: string
            format: uuid
        - name: actorId
          in: query
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          schema:
            $ref: '#/components/schemas/AuditAction'
        - name: createdFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: createdTo
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Riwayat perubahan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogList'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/approvals/inbox:
    get:
      operationId: listApprovalInbox
      tags:
        - approval
      summary: Persetujuan Saya — dokumen yang menunggu keputusan user
      description: |
        Termasuk dokumen yang bisa diputuskan sebagai penerima delegasi atau sebagai pengganti approver.
        Dokumen yang diajukan user sendiri tidak pernah muncul (pembuat tidak boleh menyetujui dokumennya sendiri).
        Terlama lebih dulu.
      parameters:
        - name: subjectType
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Dokumen menunggu keputusan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalInbox'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/approvals/inbox/count:
    get:
      operationId: getApprovalInboxCount
      tags:
        - approval
      summary: Jumlah dokumen yang menunggu keputusan user (badge menu)
      responses:
        '200':
          description: Jumlah dokumen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalInboxCount'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/approvals/subject-types:
    get:
      operationId: listApprovalSubjectTypes
      tags:
        - approval
      summary: Jenis dokumen yang memakai engine approval
      responses:
        '200':
          description: Jenis dokumen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApprovalSubjectType'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/approvals/user-options:
    get:
      operationId: listApprovalUserOptions
      tags:
        - approval
      summary: Mencari pengguna aktif untuk dipilih sebagai penerima delegasi, approver, atau pengganti
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Maksimal 20 pengguna
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApprovalUserOption'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/approval-requests:
    get:
      operationId: listApprovalRequests
      tags:
        - approval
      summary: Riwayat permintaan persetujuan
      description: |
        `scope=requested` — diajukan user; `scope=decided` — pernah diputuskan user; `scope=all` — semua dokumen
        (butuh `approval.policy.read`). Dengan `subjectType` + `subjectId` mengembalikan riwayat satu dokumen
        (panel Persetujuan di detail dokumen) dan `scope` diabaikan.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: scope
          in: query
          schema:
            type: string
            enum:
              - requested
              - decided
              - all
            default: requested
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ApprovalStatus'
        - name: subjectType
          in: query
          schema:
            type: string
        - name: subjectId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Permintaan persetujuan, terbaru lebih dulu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequestList'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/approval-requests/{id}:
    get:
      operationId: getApprovalRequest
      tags:
        - approval
      summary: Detail permintaan persetujuan
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Permintaan persetujuan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/approval-requests/{id}/approve:
    post:
      operationId: approveApprovalRequest
      tags:
        - approval
      summary: Setujui level yang aktif
      description: |
        Level berikutnya aktif dan approver-nya diberi notifikasi. Setelah level terakhir, modul pemilik dokumen
        memproses persetujuan di transaksi yang sama. Pembuat dokumen ditolak `FORBIDDEN`.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalApproveInput'
      responses:
        '200':
          description: Keputusan tersimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/approval-requests/{id}/reject:
    post:
      operationId: rejectApprovalRequest
      tags:
        - approval
      summary: Tolak dokumen
      description: Catatan wajib diisi. Dokumen kembali ke pembuat untuk direvisi.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRejectInput'
      responses:
        '200':
          description: Dokumen ditolak
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/approval-policies:
    get:
      operationId: listApprovalPolicies
      tags:
        - approval
      summary: Matriks Persetujuan
      description: Butuh `approval.policy.read`. Tanpa `includeEnded` hanya versi yang masih/akan berlaku.
      parameters:
        - name: subjectType
          in: query
          schema:
            type: string
        - name: includeEnded
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Kebijakan per jenis dokumen dan level
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApprovalPolicy'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createApprovalPolicy
      tags:
        - approval
      summary: Menambah level kebijakan (langsung berlaku)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalPolicyInput'
      responses:
        '201':
          description: Kebijakan dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalPolicy'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/approval-policies/{id}:
    put:
      operationId: updateApprovalPolicy
      tags:
        - approval
      summary: Mengubah kebijakan (versi baru mulai sekarang)
      description: |
        Versi lama ditutup dan versi baru berlaku mulai sekarang (effective-dated). Jenis dokumen, divisi, dan level
        tidak berubah. Dokumen yang sudah diajukan tetap memakai approver versi lama.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalPolicyUpdate'
      responses:
        '200':
          description: Versi baru kebijakan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalPolicy'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/approval-policies/{id}/end:
    post:
      operationId: endApprovalPolicy
      tags:
        - approval
      summary: Menghentikan level kebijakan mulai sekarang
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionInput'
      responses:
        '200':
          description: Kebijakan dihentikan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalPolicy'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/approval-delegations:
    get:
      operationId: listApprovalDelegations
      tags:
        - approval
      summary: Delegasi persetujuan
      description: Default delegasi yang melibatkan user. `all=true` untuk semua user (butuh `approval.policy.read`).
      parameters:
        - name: all
          in: query
          schema:
            type: boolean
            default: false
        - name: includePast
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Delegasi, terbaru lebih dulu
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApprovalDelegation'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createApprovalDelegation
      tags:
        - approval
      summary: Mendelegasikan persetujuan selama cuti
      description: |
        Tanpa `fromUserId` mendelegasikan milik user sendiri. Mencatat delegasi untuk user lain butuh
        `approval.policy.write`. Satu user hanya punya satu delegasi pada tanggal yang sama; maksimal 90 hari.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDelegationInput'
      responses:
        '201':
          description: Delegasi dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalDelegation'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/approval-delegations/{id}/cancel:
    post:
      operationId: cancelApprovalDelegation
      tags:
        - approval
      summary: Menghentikan delegasi
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionInput'
      responses:
        '200':
          description: Delegasi dihentikan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalDelegation'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/notifications:
    get:
      operationId: listNotifications
      tags:
        - notification
      summary: Notifikasi in-app milik user yang login
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: unreadOnly
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Daftar notifikasi, terbaru lebih dulu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/notifications/unread-count:
    get:
      operationId: getNotificationUnreadCount
      tags:
        - notification
      summary: Jumlah notifikasi belum dibaca (badge)
      responses:
        '200':
          description: Jumlah notifikasi belum dibaca
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationUnreadCount'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags:
        - notification
      summary: Menandai semua notifikasi sudah dibaca
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Semua ditandai sudah dibaca
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags:
        - notification
      summary: Menandai notifikasi sudah dibaca
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Ditandai sudah dibaca
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/products:
    get:
      operationId: listProducts
      tags:
        - catalog
      summary: Daftar produk (Produk Jadi, Packaging, Material, Bundling)
      description: |
        Produk yang dihapus tidak tampil kecuali `deleted=true` (hanya produk terhapus, untuk dipulihkan Admin Sistem).
        `q` mencari SKU, nama, varian, atau barcode persis.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Search'
        - name: productType
          in: query
          description: Bisa lebih dari satu, mis. `productType=packaging&productType=reprocess_material`.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ProductType'
        - name: isBundle
          in: query
          schema:
            type: boolean
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: isActive
          in: query
          schema:
            type: boolean
        - name: deleted
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Daftar produk; field sort yang diizinkan `sku`, `name`, `createdAt`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createProduct
      tags:
        - catalog
      summary: Membuat produk (MD-01, MD-02, MD-03)
      description: |
        SKU unik permanen dan tidak bisa dipakai ulang walau produk dihapus (`DUPLICATE_CODE`). Produk Jadi wajib
        umur simpan dan tipe kemasan dan selalu memakai batch. Bundel virtual wajib punya komponen Produk Jadi
        non-bundel dan tidak punya stok, batch, maupun umur simpan sendiri.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Produk dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/products/lookup:
    get:
      operationId: lookupProduct
      tags:
        - catalog
      summary: Mencari satu produk aktif berdasarkan SKU atau barcode persis (pindai barcode)
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Produk dengan SKU atau barcode tersebut
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/products/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getProduct
      tags:
        - catalog
      summary: Detail produk (produk terhapus tetap bisa dibuka untuk dokumen lama)
      responses:
        '200':
          description: Detail produk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updateProduct
      tags:
        - catalog
      summary: Mengubah produk (optimistic locking dengan `version`)
      description: SKU, jenis produk, dan status bundel tidak bisa diubah.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
      responses:
        '200':
          description: Produk diubah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteProduct
      tags:
        - catalog
      summary: Menghapus produk (soft delete; tetap tampil di dokumen lama)
      description: Produk yang masih menjadi komponen bundel aktif tidak bisa dihapus (`INVALID_STATE_TRANSITION`).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Produk dihapus
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/products/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: restoreProduct
      tags:
        - catalog
      summary: Memulihkan produk yang dihapus (hanya Admin Sistem)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Produk dipulihkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/product-categories:
    get:
      operationId: listProductCategories
      tags:
        - catalog
      summary: Daftar kategori produk
      parameters:
        - name: deleted
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Kategori urut kode
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductCategory'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createProductCategory
      tags:
        - catalog
      summary: Membuat kategori produk (kode unik permanen)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCategoryInput'
      responses:
        '201':
          description: Kategori dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCategory'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/product-categories/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      operationId: updateProductCategory
      tags:
        - catalog
      summary: Mengubah nama kategori
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCategoryUpdate'
      responses:
        '200':
          description: Kategori diubah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCategory'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteProductCategory
      tags:
        - catalog
      summary: Menghapus kategori (soft delete)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Kategori dihapus
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/product-categories/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: restoreProductCategory
      tags:
        - catalog
      summary: Memulihkan kategori yang dihapus (hanya Admin Sistem)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Kategori dipulihkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCategory'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/warehouses:
    get:
      operationId: listWarehouses
      tags:
        - warehouse
      summary: Daftar gudang fisik
      description: Gudang yang dihapus tidak tampil kecuali `deleted=true` (hanya gudang terhapus).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Search'
        - name: isActive
          in: query
          schema:
            type: boolean
        - name: deleted
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Daftar gudang; field sort yang diizinkan `code`, `name`, `createdAt`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarehouseList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createWarehouse
      tags:
        - warehouse
      summary: Membuat gudang fisik beserta lokasi standarnya (MD-09, F1-114)
      description: |
        Lokasi Inbound, FG Non-Ecommerce, E-commerce Stock (Petty Stock), RM, GM (Gudang GM), dan Gudang Retur dibuat
        otomatis dengan kode `<kode gudang>-INB/FG/ECM/RM/GM/RET` (U-08). Kode gudang unik permanen.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarehouseInput'
      responses:
        '201':
          description: Gudang dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Warehouse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/warehouses/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getWarehouse
      tags:
        - warehouse
      summary: Detail gudang (gudang terhapus tetap bisa dibuka untuk dokumen lama)
      responses:
        '200':
          description: Detail gudang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Warehouse'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updateWarehouse
      tags:
        - warehouse
      summary: Mengubah nama, alamat, atau status aktif gudang
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarehouseUpdate'
      responses:
        '200':
          description: Gudang diubah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Warehouse'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteWarehouse
      tags:
        - warehouse
      summary: Menghapus gudang beserta lokasinya (soft delete)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Gudang dihapus
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/warehouses/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: restoreWarehouse
      tags:
        - warehouse
      summary: Memulihkan gudang beserta lokasi yang ikut terhapus (hanya Admin Sistem)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Gudang dipulihkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Warehouse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/locations:
    get:
      operationId: listLocations
      tags:
        - warehouse
      summary: Daftar lokasi stok (internal dan eksternal)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Search'
        - name: warehouseId
          in: query
          schema:
            type: string
            format: uuid
        - name: locationType
          in: query
          description: Bisa lebih dari satu.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/LocationType'
        - name: external
          in: query
          description: '`true` hanya lokasi eksternal, `false` hanya lokasi di dalam gudang.'
          schema:
            type: boolean
        - name: externalPartyType
          in: query
          schema:
            $ref: '#/components/schemas/ExternalPartyType'
        - name: externalPartyId
          in: query
          schema:
            type: string
            format: uuid
        - name: isActive
          in: query
          schema:
            type: boolean
        - name: deleted
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Daftar lokasi; field sort yang diizinkan `code`, `name`, `createdAt`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createLocation
      tags:
        - warehouse
      summary: Membuat lokasi (termasuk lokasi eksternal maklon, konsinyasi, buffer vending, mesin)
      description: |
        Lokasi internal wajib `warehouseId`. Lokasi eksternal wajib `externalPartyType` + `externalPartyId` (maklon =
        `supplier`, konsinyasi = `partner`, buffer vending = `partner`/`vending_machine`, mesin = `vending_machine`);
        satu lokasi per jenis per pihak.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationInput'
      responses:
        '201':
          description: Lokasi dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/locations/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getLocation
      tags:
        - warehouse
      summary: Detail lokasi (lokasi terhapus tetap bisa dibuka untuk dokumen lama)
      responses:
        '200':
          description: Detail lokasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updateLocation
      tags:
        - warehouse
      summary: Mengubah nama atau status aktif lokasi
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationUpdate'
      responses:
        '200':
          description: Lokasi diubah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteLocation
      tags:
        - warehouse
      summary: Menghapus lokasi tambahan (soft delete); lokasi standar ikut gudangnya
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Lokasi dihapus
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/locations/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: restoreLocation
      tags:
        - warehouse
      summary: Memulihkan lokasi yang dihapus (hanya Admin Sistem)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Lokasi dipulihkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token EdDSA 15 menit (Technical Guideline 9.1).
  schemas:
    Problem:
      type: object
      description: Format error RFC 7807 (Technical Guideline 8.3). Field code adalah kontrak stabil untuk FE.
      required:
        - type
        - title
        - status
        - code
        - detail
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          $ref: '#/components/schemas/ErrorCode'
        detail:
          type: string
          description: Pesan Bahasa Indonesia yang aman ditampilkan ke user.
        fields:
          type: object
          additionalProperties:
            type: string
        requestId:
          type: string
    ErrorCode:
      type: string
      description: Katalog kode error (Technical Guideline Lampiran A).
      enum:
        - VALIDATION_FAILED
        - AUTH_INVALID_CREDENTIALS
        - AUTH_ACCOUNT_LOCKED
        - AUTH_MFA_REQUIRED
        - AUTH_MFA_INVALID
        - AUTH_TOKEN_EXPIRED
        - AUTH_SESSION_EXPIRED
        - AUTH_REAUTH_REQUIRED
        - AUTH_MFA_ENROLLMENT_REQUIRED
        - AUTH_PASSWORD_TOKEN_INVALID
        - FORBIDDEN
        - NOT_FOUND
        - VERSION_CONFLICT
        - INVALID_STATE_TRANSITION
        - IDEMPOTENCY_KEY_REQUIRED
        - IDEMPOTENCY_IN_PROGRESS
        - IDEMPOTENCY_KEY_REUSED
        - DUPLICATE_CODE
        - PERIOD_LOCKED
        - STOCK_INSUFFICIENT
        - BATCH_SHELF_LIFE_TOO_SHORT
        - APPROVAL_REQUIRED
        - APPROVAL_POLICY_MISSING
        - DISCOUNT_LIMIT_EXCEEDED
        - CREDIT_LIMIT_EXCEEDED
        - THREE_WAY_MATCH_FAILED
        - DEPOSIT_INSUFFICIENT
        - OUTSIDE_ATTENDANCE_RADIUS
        - FILE_TOO_LARGE
        - FILE_TYPE_NOT_ALLOWED
        - IMPORT_ALREADY_PROCESSED
        - RATE_LIMITED
