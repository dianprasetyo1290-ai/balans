  /api/v1/return-dispositions/{id}/actions/{action}:
    post:
      operationId: runReturnDispositionAction
      tags:
        - inventory
      summary: Aksi Disposisi Retur (submit, revise, post, cancel)
      description: |
        `submit` (S) memberi nomor DRT dan mengajukan approval `return_disposition` (flag `has_disposal`, nominal = nilai
        pemusnahan); `post` (W) mengeksekusi per baris: restock → FG, reprocess → GM (jurnal A-26), repack → draft
        Repacking, sampel → Pemakaian Internal disetujui, musnah → Pemusnahan disetujui.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
