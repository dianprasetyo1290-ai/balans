      summary: HPP per Batch — cost layer FIFO per penerimaan (INV-03)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: productId
          in: query
          schema:
            type: string
            format: uuid
        - name: batchId
          in: query
          schema:
            type: string
            format: uuid
        - name: openOnly
          in: query
          description: Hanya layer yang masih bersisa.
          schema:
            type: boolean
      responses:
        '200':
          description: Cost layer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostLayerList'
