fixedAssetClasses:
  get:
    operationId: listFixedAssetClasses
    tags: [accounting]
    summary: Kelas aset tetap (umur manfaat & akun A-31)
    description: Permission `accounting.fixed_asset.read`.
    parameters:
      - $ref: "./accounting.yaml#/components/parameters/IncludeInactive"
    responses:
      "200":
        description: Daftar kelas aset
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/FixedAssetClass"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
  post:
    operationId: createFixedAssetClass
    tags: [accounting]
    summary: Menambah kelas aset
    description: Permission `accounting.fixed_asset.write`. Akun aset bersaldo debit, akun akumulasi bersaldo kredit (1xxx).
    parameters:
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FixedAssetClassCreate"
    responses:
      "201":
        description: Kelas dibuat
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FixedAssetClass"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
fixedAssetClass:
  parameters:
    - $ref: "../components/common.yaml#/parameters/Id"
  put:
    operationId: updateFixedAssetClass
    tags: [accounting]
    summary: Mengubah kelas aset
    description: Umur manfaat baru dipakai aset yang dibuat setelahnya.
    parameters:
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FixedAssetClassUpdate"
    responses:
      "200":
        description: Kelas diubah
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FixedAssetClass"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
fixedAssets:
  get:
    operationId: listFixedAssets
    tags: [accounting]
    summary: Register Aset Tetap (ACC-21)
    description: Permission `accounting.fixed_asset.read` atau `accounting.report.read`.
    parameters:
      - $ref: "../components/common.yaml#/parameters/Page"
      - $ref: "../components/common.yaml#/parameters/PageSize"
      - $ref: "../components/common.yaml#/parameters/Search"
      - name: status
        in: query
        schema:
          $ref: "#/components/schemas/FixedAssetStatus"
      - name: classId
        in: query
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Daftar aset
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FixedAssetList"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
  post:
    operationId: createFixedAsset
    tags: [accounting]
    summary: Menambah aset tetap (Draft)
    description: |
      Aset pembelian (`purchase`) wajib akun pembayaran dan dijurnal A-31 saat diaktifkan. Aset saldo awal
      (`opening`) membutuhkan tanggal cut-over di Saldo Awal; nilainya masuk GL lewat A-36.
    parameters:
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FixedAssetCreate"
    responses:
      "201":
        description: Aset dibuat
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FixedAssetDetail"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
fixedAsset:
  parameters:
    - $ref: "../components/common.yaml#/parameters/Id"
  get:
    operationId: getFixedAsset
    tags: [accounting]
    summary: Detail aset beserta riwayat penyusutan
    responses:
      "200":
        description: Detail aset
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FixedAssetDetail"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
  put:
    operationId: updateFixedAsset
    tags: [accounting]
    summary: Mengubah aset Draft
    parameters:
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FixedAssetUpdate"
    responses:
      "200":
        description: Aset diubah
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FixedAssetDetail"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
  delete:
    operationId: deleteFixedAsset
    tags: [accounting]
    summary: Menghapus aset Draft
    parameters:
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
      - $ref: "./accounting.yaml#/components/parameters/Version"
    responses:
      "204":
        description: Aset dihapus
      default:
        $ref: "../components/common.yaml#/responses/Problem"
fixedAssetActivate:
  post:
    operationId: activateFixedAsset
    tags: [accounting]
    summary: Mengaktifkan aset (jurnal A-31 perolehan untuk aset pembelian)
    description: Permission `accounting.fixed_asset.post`. Tanggal perolehan harus di periode terbuka (`PERIOD_LOCKED`).
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/common.yaml#/VersionInput"
    responses:
      "200":
        description: Aset aktif
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FixedAssetDetail"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
fixedAssetDispose:
  post:
    operationId: disposeFixedAsset
    tags: [accounting]
    summary: Melepas aset (dijual/dihapusbukukan, jurnal A-31 pelepasan)
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FixedAssetDisposeInput"
    responses:
      "200":
        description: Aset dilepas
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FixedAssetDetail"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
depreciationRuns:
  get:
    operationId: listDepreciationRuns
    tags: [accounting]
    summary: Riwayat penyusutan per periode
    parameters:
      - $ref: "../components/common.yaml#/parameters/Page"
      - $ref: "../components/common.yaml#/parameters/PageSize"
    responses:
      "200":
        description: Daftar run penyusutan
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepreciationRunList"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
  post:
    operationId: runDepreciation
    tags: [accounting]
    summary: Menjalankan penyusutan satu periode (A-31)
    description: |
      Sama dengan job `accounting.depreciate` (tanggal 1 pukul 01.00 WIB untuk bulan sebelumnya). Idempotent per
      aset per periode; periode harus terbuka. Permission `accounting.fixed_asset.post`.
    parameters:
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DepreciationRunInput"
    responses:
      "200":
        description: Hasil penyusutan periode
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepreciationRunDetail"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
depreciationRun:
  get:
    operationId: getDepreciationRun
    tags: [accounting]
    summary: Detail penyusutan per aset satu periode
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
    responses:
      "200":
        description: Detail run
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepreciationRunDetail"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
closeChecklist:
  get:
    operationId: getCloseChecklist
    tags: [accounting]
    summary: Checklist Tutup Buku 9 langkah satu periode (BRD 5.15)
    description: Termasuk hasil pemeriksaan otomatis, hal yang menahan tutup periode, dan riwayat buka kembali.
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
    responses:
      "200":
        description: Checklist
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseChecklist"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
closeChecklistStep:
  put:
    operationId: updateCloseChecklistStep
    tags: [accounting]
    summary: Mengubah status, PIC, atau catatan satu langkah
    description: |
      Permission `accounting.fiscal_period.write` atau `.post`. Selesai butuh pemeriksaan otomatis lolos; Tidak Berlaku
      wajib catatan; langkah 9 selesai saat Tutup Periode.
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
      - name: stepCode
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/CloseStepCode"
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CloseChecklistStepInput"
    responses:
      "200":
        description: Checklist terbaru
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseChecklist"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
fiscalPeriodClose:
  post:
    operationId: closeFiscalPeriod
    tags: [accounting]
    summary: Tutup Periode (★ re-autentikasi)
    description: |
      Permission `accounting.fiscal_period.post` dan re-autentikasi 5 menit terakhir (`AUTH_REAUTH_REQUIRED`).
      Advisory lock per periode; periode sebelumnya harus Ditutup; langkah 1–8 selesai; neraca saldo balance.
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/common.yaml#/VersionInput"
    responses:
      "200":
        description: Periode ditutup
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseChecklist"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
fiscalPeriodReopen:
  post:
    operationId: requestFiscalPeriodReopen
    tags: [accounting]
    summary: Ajukan Buka Kembali periode (★ re-autentikasi, approval Head F&A → Direksi)
    description: |
      Permission `accounting.fiscal_period.reopen` dan re-autentikasi. Periode menjadi Menunggu Persetujuan (tetap
      terkunci) sampai approval `fiscal_period_reopen` diputuskan.
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FiscalPeriodReopenInput"
    responses:
      "200":
        description: Permintaan diajukan
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseChecklist"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
trialBalance:
  get:
    operationId: getTrialBalance
    tags: [accounting]
    summary: Neraca Saldo per rentang & dimensi (ACC-18)
    description: |
      Hanya jurnal terposting. Saldo awal = sebelum `dateFrom`. Butuh `accounting.report.read` atau
      `accounting.journal.read`. Drill-down ke Buku Besar per akun dengan filter yang sama.
    parameters:
      - name: dateFrom
        in: query
        required: true
        schema:
          $ref: "../components/common.yaml#/BusinessDate"
      - name: dateTo
        in: query
        required: true
        schema:
          $ref: "../components/common.yaml#/BusinessDate"
      - name: channelId
        in: query
        schema:
          type: string
          format: uuid
      - name: subChannelId
        in: query
        schema:
          type: string
          format: uuid
      - name: divisionId
        in: query
        schema:
          type: string
          format: uuid
      - name: campaignId
        in: query
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Neraca Saldo
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrialBalance"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
openingBalance:
  get:
    operationId: getOpeningBalance
    tags: [accounting]
    summary: Saldo Awal — tanggal cut-over dan Neraca Saldo Awal (A-36)
    responses:
      "200":
        description: Saldo awal
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpeningBalance"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
  put:
    operationId: saveOpeningBalanceSet
    tags: [accounting]
    summary: Mengisi tanggal cut-over (akhir bulan)
    description: Permission `accounting.journal.write`; hanya selama saldo awal Draft.
    parameters:
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpeningBalanceSetInput"
    responses:
      "200":
        description: Saldo awal
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpeningBalance"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
openingBalanceLines:
  post:
    operationId: saveOpeningBalanceLine
    tags: [accounting]
    summary: Mengisi saldo awal satu akun neraca (akun yang sama diganti)
    parameters:
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpeningBalanceLineInput"
    responses:
      "200":
        description: Saldo awal
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpeningBalance"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
openingBalanceLine:
  delete:
    operationId: deleteOpeningBalanceLine
    tags: [accounting]
    summary: Menghapus saldo awal satu akun
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    responses:
      "200":
        description: Saldo awal
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpeningBalance"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
openingBalancePost:
  post:
    operationId: postOpeningBalance
    tags: [accounting]
    summary: Memposting saldo awal sebagai jurnal A-36 (selisih ke 3901)
    description: Permission `accounting.journal.post`. Tanggal cut-over harus di periode terbuka.
    parameters:
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/common.yaml#/VersionInput"
    responses:
      "200":
        description: Saldo awal diposting
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpeningBalance"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
openingItems:
  get:
    operationId: listOpeningItems
    tags: [accounting]
    summary: Piutang & utang terbuka saldo awal per dokumen lama
    parameters:
      - $ref: "../components/common.yaml#/parameters/Page"
      - $ref: "../components/common.yaml#/parameters/PageSize"
      - $ref: "../components/common.yaml#/parameters/Search"
      - name: itemType
        in: query
        schema:
          $ref: "#/components/schemas/OpeningItemType"
      - name: outstandingOnly
        in: query
        schema:
          type: boolean
          default: false
    responses:
      "200":
        description: Daftar saldo terbuka
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpeningItemList"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
cutoverReconciliation:
  get:
    operationId: getCutoverReconciliation
    tags: [accounting]
    summary: Pengecekan rekonsiliasi cut-over (sub-ledger vs GL)
    description: |
      Neraca saldo awal balance, nilai persediaan per akun, piutang/utang terbuka, harga perolehan & akumulasi aset
      tetap (Panduan Migrasi Data bagian 4). Sebelum saldo awal diposting, GL diambil dari Neraca Saldo Awal.
    responses:
      "200":
        description: Hasil rekonsiliasi
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CutoverReconciliation"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
components:
  schemas:
    FixedAssetClassUpdate:
      type: object
      required: [name, usefulLifeMonths, assetAccountId, accumulatedAccountId, isActive, version]
      properties:
        name:
          type: string
        usefulLifeMonths:
          type: integer
          minimum: 1
          maximum: 600
        assetAccountId:
          type: string
          format: uuid
        accumulatedAccountId:
          type: string
          format: uuid
        isActive:
          type: boolean
        version:
          type: integer
    FixedAssetClassCreate:
      type: object
      required: [code, name, usefulLifeMonths, assetAccountId, accumulatedAccountId, isActive]
      properties:
        code:
          type: string
          example: vending_machine
        name:
          type: string
        usefulLifeMonths:
          type: integer
          minimum: 1
          maximum: 600
        assetAccountId:
          type: string
          format: uuid
        accumulatedAccountId:
          type: string
          format: uuid
        isActive:
          type: boolean
    FixedAssetClass:
      type: object
      required: [id, code, name, usefulLifeMonths, assetAccountId, assetAccountCode, accumulatedAccountId, accumulatedAccountCode, isActive, version]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        usefulLifeMonths:
          type: integer
        assetAccountId:
          type: string
          format: uuid
        assetAccountCode:
          type: string
        accumulatedAccountId:
          type: string
          format: uuid
        accumulatedAccountCode:
          type: string
        isActive:
          type: boolean
        version:
          type: integer
    FixedAssetStatus:
      type: string
      description: "`draft` Draft, `active` Aktif, `disposed` Dilepas."
      enum: [draft, active, disposed]
    FixedAssetSource:
      type: string
      description: "`purchase` pembelian setelah go-live, `opening` saldo awal migrasi."
      enum: [purchase, opening]
    FixedAssetCreate:
      allOf:
        - $ref: "#/components/schemas/FixedAssetFields"
        - type: object
          required: [code]
          properties:
            code:
              type: string
              example: AST-VM-001
    FixedAssetUpdate:
      allOf:
        - $ref: "#/components/schemas/FixedAssetFields"
        - type: object
          required: [version]
          properties:
            version:
              type: integer
    FixedAssetFields:
      type: object
      required: [name, classId, divisionId, source, acquisitionDate, cost]
      properties:
        name:
          type: string
        classId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
          nullable: true
        locationLabel:
          type: string
        divisionId:
          type: string
          format: uuid
        source:
          $ref: "#/components/schemas/FixedAssetSource"
        acquisitionDate:
          $ref: "../components/common.yaml#/BusinessDate"
        cost:
          $ref: "../components/common.yaml#/Money"
        salvage:
          $ref: "../components/common.yaml#/Money"
        usefulLifeMonths:
          type: integer
          description: Kosong/0 = umur manfaat kelas.
        openingAccumulated:
          $ref: "../components/common.yaml#/Money"
        paymentAccountId:
          type: string
          format: uuid
          nullable: true
        note:
          type: string
    FixedAsset:
      type: object
      required: [id, code, name, classId, className, locationLabel, divisionId, source, acquisitionDate, cost, salvage,
        usefulLifeMonths, depreciationStart, openingAccumulated, openingDepreciatedMonths, accumulated, bookValue,
        monthlyDepreciation, status, disposalReason, note, allowedActions, updatedAt, version]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        classId:
          type: string
          format: uuid
        className:
          type: string
        locationId:
          type: string
          format: uuid
          nullable: true
        locationLabel:
          type: string
        divisionId:
          type: string
          format: uuid
        source:
          $ref: "#/components/schemas/FixedAssetSource"
        acquisitionDate:
          $ref: "../components/common.yaml#/BusinessDate"
        cost:
          $ref: "../components/common.yaml#/Money"
        salvage:
          $ref: "../components/common.yaml#/Money"
        usefulLifeMonths:
          type: integer
        depreciationStart:
          $ref: "../components/common.yaml#/BusinessDate"
        openingAccumulated:
          $ref: "../components/common.yaml#/Money"
        openingDepreciatedMonths:
          type: integer
        accumulated:
          $ref: "../components/common.yaml#/Money"
        bookValue:
          $ref: "../components/common.yaml#/Money"
        monthlyDepreciation:
          $ref: "../components/common.yaml#/Money"
        paymentAccountId:
          type: string
          format: uuid
          nullable: true
        status:
          $ref: "#/components/schemas/FixedAssetStatus"
        acquisitionJournalId:
          type: string
          format: uuid
          nullable: true
        disposalDate:
          allOf:
            - $ref: "../components/common.yaml#/BusinessDate"
          nullable: true
        disposalProceeds:
          allOf:
            - $ref: "../components/common.yaml#/Money"
          nullable: true
        disposalAccountId:
          type: string
          format: uuid
          nullable: true
        disposalReason:
          type: string
        disposalJournalId:
          type: string
          format: uuid
          nullable: true
        note:
          type: string
        allowedActions:
          type: array
          items:
            type: string
            enum: [edit, delete, activate, dispose]
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
    FixedAssetList:
      allOf:
        - $ref: "../components/common.yaml#/Pagination"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/FixedAsset"
    DepreciationLine:
      type: object
      required: [id, runId, assetId, assetCode, assetName, periodLabel, amount, accumulated, bookValue, journalEntryId, journalNumber]
      properties:
        id:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        assetId:
          type: string
          format: uuid
        assetCode:
          type: string
        assetName:
          type: string
        periodLabel:
          type: string
        amount:
          $ref: "../components/common.yaml#/Money"
        accumulated:
          $ref: "../components/common.yaml#/Money"
        bookValue:
          $ref: "../components/common.yaml#/Money"
        journalEntryId:
          type: string
          format: uuid
        journalNumber:
          type: string
    FixedAssetDetail:
      type: object
      required: [asset, depreciation]
      properties:
        asset:
          $ref: "#/components/schemas/FixedAsset"
        depreciation:
          type: array
          items:
            $ref: "#/components/schemas/DepreciationLine"
    FixedAssetDisposeInput:
      type: object
      required: [version, disposalDate, proceeds, reason]
      properties:
        version:
          type: integer
