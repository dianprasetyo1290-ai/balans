stockBalances:
  get:
    operationId: listStockBalances
    tags: [inventory]
    summary: Stok per Lokasi — saldo per produk × lokasi × batch × status (INV-01, WMS-01)
    description: |
      Hanya saldo > 0. `unitCost` adalah HPP rata-rata sisa cost layer batch (FIFO di dalam batch), `value` =
      qty × unitCost. Permission `inventory.stock.read`.
    parameters:
      - $ref: "../components/common.yaml#/parameters/Page"
      - $ref: "../components/common.yaml#/parameters/PageSize"
      - name: productId
        in: query
        schema:
          type: string
          format: uuid
      - name: locationId
        in: query
        description: Bisa lebih dari satu.
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: batchId
        in: query
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        description: Bisa lebih dari satu.
        schema:
          type: array
          items:
            $ref: "#/components/schemas/StockStatus"
    responses:
      "200":
        description: Saldo stok
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockBalanceList"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
stockCard:
  get:
    operationId: getStockCard
    tags: [inventory]
    summary: Kartu Stok per SKU (opsional lokasi, batch, status) dengan saldo qty & nilai berjalan (INV-01)
    parameters:
      - $ref: "../components/common.yaml#/parameters/Page"
      - $ref: "../components/common.yaml#/parameters/PageSize"
      - name: productId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: locationId
        in: query
        schema:
          type: string
          format: uuid
      - name: batchId
        in: query
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          $ref: "#/components/schemas/StockStatus"
      - name: dateFrom
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: dateTo
        in: query
        required: true
        schema:
          type: string
          format: date
    responses:
      "200":
        description: Kartu stok
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockCard"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
batches:
  get:
    operationId: listBatches
    tags: [inventory]
    summary: Batch & Kedaluwarsa — batch berurutan FEFO dengan qty per status (INV-04, INV-09)
    parameters:
      - $ref: "../components/common.yaml#/parameters/Page"
      - $ref: "../components/common.yaml#/parameters/PageSize"
      - $ref: "../components/common.yaml#/parameters/Search"
      - name: productId
        in: query
        schema:
          type: string
          format: uuid
      - name: expiryState
        in: query
        schema:
          $ref: "#/components/schemas/ExpiryState"
      - name: nearExpiryDays
        in: query
        description: Batas hari "Segera kedaluwarsa" (default 90).
        schema:
          type: integer
          minimum: 1
          maximum: 730
      - name: withStock
        in: query
        description: Default `true` — hanya batch yang masih punya stok.
        schema:
          type: boolean
    responses:
      "200":
        description: Daftar batch
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchList"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
batchSuggestions:
  get:
    operationId: suggestBatches
    tags: [inventory]
    summary: Alokasi Batch (FEFO) — saran batch untuk mengambil qty dari satu lokasi (S-215)
    description: |
      Batch stok Tersedia diurutkan kedaluwarsa terdekat; batch kedaluwarsa dan stok Karantina tidak diusulkan.
      Pemilihan batch manual yang bukan saran FEFO wajib alasan saat diposting.
    parameters:
      - name: productId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: locationId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: qty
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/StockQuantity"
    responses:
      "200":
        description: Saran batch
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchSuggestion"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
costLayers:
  get:
    operationId: listCostLayers
    tags: [inventory]
    summary: HPP per Batch — cost layer FIFO per penerimaan (INV-03)
    parameters:
      - $ref: "../components/common.yaml#/parameters/Page"
      - $ref: "../components/common.yaml#/parameters/PageSize"
      - name: productId
        in: query
        schema:
          type: string
          format: uuid
      - name: batchId
        in: query
        schema:
          type: string
          format: uuid
      - name: openOnly
        in: query
        description: Hanya layer yang masih bersisa.
        schema:
          type: boolean
    responses:
      "200":
        description: Cost layer
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CostLayerList"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
costLayerConsumptions:
  parameters:
    - $ref: "../components/common.yaml#/parameters/Id"
  get:
    operationId: listCostLayerConsumptions
    tags: [inventory]
    summary: Jejak konsumsi HPP satu cost layer (RPT-04)
    responses:
      "200":
        description: Jejak konsumsi
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CostLayerConsumptionList"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
bundleAvailability:
  get:
    operationId: listBundleAvailability
    tags: [inventory]
    summary: Stok tersedia bundel virtual = min(floor(stok komponen ÷ qty)) (S-115, MD-03)
    description: |
      Stok komponen = stok Tersedia di lokasi `locationId`, atau di semua lokasi yang bisa dijual bila kosong.
    parameters:
      - name: bundleId
        in: query
        required: true
        description: Maks. 200.
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: locationId
        in: query
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Stok tersedia per bundel
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BundleAvailabilityList"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
internalUsages:
  get:
    operationId: listInternalUsages
    tags: [inventory]
    summary: Pemakaian Internal — daftar (INV-05, HR-02)
    description: Permission `inventory.internal_usage.read`.
    parameters:
      - $ref: "../components/common.yaml#/parameters/Page"
      - $ref: "../components/common.yaml#/parameters/PageSize"
      - $ref: "../components/common.yaml#/parameters/Search"
      - name: status
        in: query
        schema:
          $ref: "#/components/schemas/InventoryDocStatus"
      - name: purpose
        in: query
        schema:
          $ref: "#/components/schemas/InternalUsagePurpose"
    responses:
      "200":
        description: Daftar Pemakaian Internal
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalUsageList"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
  post:
    operationId: createInternalUsage
    tags: [inventory]
    summary: Membuat draft Pemakaian Internal (S-221, S-227)
    description: |
      Tujuan marketing/sampling sales/event wajib kode kampanye (A-11); sampel karyawan tanpa kampanye (A-12). Event
      wajib lokasi Event dan tanggal selesai; batas pencatatan sisa = H+1. Permission `inventory.internal_usage.write`.
    parameters:
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InternalUsageInput"
    responses:
      "201":
        description: Draft dibuat
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalUsage"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
internalUsage:
  get:
    operationId: getInternalUsage
    tags: [inventory]
    summary: Detail Pemakaian Internal beserta batch yang keluar dan aksi yang diizinkan
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
    responses:
      "200":
        description: Pemakaian Internal
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalUsage"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
  put:
    operationId: updateInternalUsage
    tags: [inventory]
    summary: Mengubah draft Pemakaian Internal
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InternalUsageUpdate"
    responses:
      "200":
        description: Draft diperbarui
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalUsage"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
internalUsageAction:
  post:
    operationId: runInternalUsageAction
    tags: [inventory]
    summary: Aksi Pemakaian Internal (submit, revise, release, handover, post, cancel)
    description: |
      `submit` (S) memberi nomor PU dan mengajukan approval `internal_usage` sebesar taksiran HPP FEFO; `release` (P,
      Logistik Leader) mengalokasikan stok asal FEFO; `handover` (W, divisi peminta) mengonfirmasi serah terima —
      non-event: stok keluar + jurnal A-11/A-12, event: stok pindah ke lokasi Event tanpa jurnal; `post` (P) event
      setelah sisa dicatat: qty terpakai keluar dari lokasi Event + jurnal A-11; `revise`, `cancel` (W).
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
      - name: action
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/InternalUsageAction"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/common.yaml#/VersionInput"
    responses:
      "200":
        description: Aksi dijalankan
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalUsage"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
internalUsageSettle:
  post:
    operationId: settleInternalUsage
    tags: [inventory]
    summary: Mencatat sisa barang event (maks. H+1); sisa kembali ke Inbound berstatus Karantina
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InternalUsageSettleInput"
    responses:
      "200":
        description: Sisa dicatat
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalUsage"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
internalUsageOptions:
  get:
    operationId: listInternalUsageDimensionOptions
    tags: [inventory]
    summary: Divisi atau kampanye aktif untuk form Pemakaian Internal
    parameters:
      - name: kind
        in: path
        required: true
        schema:
          type: string
          enum: [division, campaign]
    responses:
      "200":
        description: Pilihan dimensi
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryDimensionOptionList"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
repackings:
  get:
    operationId: listRepackings
    tags: [inventory]
    summary: Repacking — daftar (INV-06)
    parameters:
      - $ref: "../components/common.yaml#/parameters/Page"
      - $ref: "../components/common.yaml#/parameters/PageSize"
      - $ref: "../components/common.yaml#/parameters/Search"
      - name: status
        in: query
        schema:
          $ref: "#/components/schemas/InventoryDocStatus"
    responses:
      "200":
        description: Daftar Repacking
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepackingList"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
  post:
    operationId: createRepacking
    tags: [inventory]
    summary: Membuat draft Repacking (S-222)
    description: |
      Bahan: barang retur (Produk Jadi dari lokasi Retur) dan packaging baru (dari lokasi RM); tepat satu baris hasil FG
      dengan batch baru di lokasi FG Non-Ecommerce. Permission `inventory.repacking.write`.
    parameters:
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RepackingInput"
    responses:
      "201":
        description: Draft dibuat
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Repacking"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
repacking:
  get:
    operationId: getRepacking
    tags: [inventory]
    summary: Detail Repacking
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
    responses:
      "200":
        description: Repacking
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Repacking"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
  put:
    operationId: updateRepacking
    tags: [inventory]
    summary: Mengubah draft Repacking
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RepackingUpdate"
    responses:
      "200":
        description: Draft diperbarui
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Repacking"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
repackingAction:
  post:
    operationId: runRepackingAction
    tags: [inventory]
    summary: Aksi Repacking (start, post, cancel)
    description: |
      `start` (P) memberi nomor RPK dan mengalokasikan bahan; `post` (P) mengeluarkan bahan (HPP FIFO), menerima FG batch
      baru bernilai HPP retur + packaging, dan menjurnal A-26 (Dr 1311; Cr 1314, Cr 1301); `cancel` (W) melepas alokasi.
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
      - name: action
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/RepackingAction"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/common.yaml#/VersionInput"
    responses:
      "200":
        description: Aksi dijalankan
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Repacking"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
disposals:
  get:
    operationId: listDisposals
    tags: [inventory]
    summary: Pemusnahan — daftar (INV-12)
    parameters:
      - $ref: "../components/common.yaml#/parameters/Page"
      - $ref: "../components/common.yaml#/parameters/PageSize"
      - $ref: "../components/common.yaml#/parameters/Search"
      - name: status
        in: query
        schema:
          $ref: "#/components/schemas/InventoryDocStatus"
      - name: reason
        in: query
        schema:
          $ref: "#/components/schemas/DisposalReason"
    responses:
      "200":
        description: Daftar Pemusnahan
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisposalList"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
  post:
    operationId: createDisposal
    tags: [inventory]
    summary: Membuat draft Pemusnahan (S-223)
    description: |
      Alasan `return` hanya dari lokasi Retur (A-26 Dr 6403, Cr 1314); `expired`/`damaged` dari lokasi FG, E-commerce,
      Petty Stock, Inbound, atau Event (A-27 Dr 6402, Cr 1311). Foto berita acara diunggah lebih dulu ke filestore
      (`ownerType=disposal`). Permission `inventory.disposal.write`.
    parameters:
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DisposalInput"
    responses:
      "201":
        description: Draft dibuat
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Disposal"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
disposal:
  get:
    operationId: getDisposal
    tags: [inventory]
    summary: Detail Pemusnahan (juga isi Berita Acara cetak)
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
    responses:
      "200":
        description: Pemusnahan
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Disposal"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
  put:
    operationId: updateDisposal
    tags: [inventory]
    summary: Mengubah draft Pemusnahan
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DisposalUpdate"
    responses:
      "200":
        description: Draft diperbarui
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Disposal"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
disposalReport:
  put:
    operationId: updateDisposalReport
    tags: [inventory]
    summary: Mengisi Berita Acara Pemusnahan (tanggal, metode, saksi, foto) sebelum posting
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DisposalReportInput"
    responses:
      "200":
        description: Berita acara diperbarui
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Disposal"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
disposalAction:
  post:
    operationId: runDisposalAction
    tags: [inventory]
    summary: Aksi Pemusnahan (submit, revise, post, cancel)
    description: |
      `submit` (S) memberi nomor MUS dan mengajukan approval `disposal` (Head Logistik → Head F&A → Direksi bila > Rp10 jt)
      sebesar taksiran HPP; `post` (P) wajib berita acara lengkap (metode, ≥ 1 saksi, ≥ 1 foto), mengeluarkan stok, dan
      menjurnal A-26/A-27.
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
      - name: action
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/DisposalAction"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/common.yaml#/VersionInput"
    responses:
      "200":
        description: Aksi dijalankan
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Disposal"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
returnDispositions:
  get:
    operationId: listReturnDispositions
    tags: [inventory]
    summary: Disposisi Retur — daftar (WMS-07)
    description: Permission `warehouse.return_disposition.read`.
    parameters:
      - $ref: "../components/common.yaml#/parameters/Page"
      - $ref: "../components/common.yaml#/parameters/PageSize"
      - $ref: "../components/common.yaml#/parameters/Search"
      - name: status
        in: query
        schema:
          $ref: "#/components/schemas/InventoryDocStatus"
    responses:
      "200":
        description: Daftar Disposisi Retur
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnDispositionDocumentList"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
  post:
    operationId: createReturnDisposition
    tags: [inventory]
    summary: Membuat draft Disposisi Retur dari barang di Gudang Retur (S-220)
    description: |
      Per baris: hasil QC dan disposisi; disposisi kosong diisi usulan alasan retur. Permission
      `warehouse.return_disposition.write`.
    parameters:
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ReturnDispositionDocumentInput"
    responses:
      "201":
        description: Draft dibuat
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnDispositionDocument"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
returnDisposition:
  get:
    operationId: getReturnDisposition
    tags: [inventory]
    summary: Detail Disposisi Retur
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
    responses:
      "200":
        description: Disposisi Retur
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnDispositionDocument"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
  put:
    operationId: updateReturnDisposition
    tags: [inventory]
    summary: Mengubah draft Disposisi Retur
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ReturnDispositionDocumentUpdate"
    responses:
      "200":
        description: Draft diperbarui
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnDispositionDocument"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
returnDispositionAction:
  post:
    operationId: runReturnDispositionAction
    tags: [inventory]
    summary: Aksi Disposisi Retur (submit, revise, post, cancel)
    description: |
      `submit` (S) memberi nomor DRT dan mengajukan approval `return_disposition` (flag `has_disposal`, nominal = nilai
      pemusnahan); `post` (W) mengeksekusi per baris: restock → FG, reprocess → GM (jurnal A-26), repack → draft
      Repacking, sampel → Pemakaian Internal disetujui, musnah → Pemusnahan disetujui.
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
      - name: action
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ReturnDispositionAction"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/common.yaml#/VersionInput"
    responses:
      "200":
        description: Aksi dijalankan
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnDispositionDocument"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
recostRuns:
  get:
    operationId: listRecostRuns
    tags: [inventory]
    summary: Riwayat recost HPP akibat penerimaan bertanggal mundur (S-224)
    parameters:
      - $ref: "../components/common.yaml#/parameters/Page"
      - $ref: "../components/common.yaml#/parameters/PageSize"
      - name: productId
        in: query
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Riwayat recost
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecostRunList"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
components:
  schemas:
    StockStatus:
      type: string
      description: "`available` Tersedia, `quarantine` Karantina, `in_transit` Dalam Pengiriman, `reserved` Dialokasikan."
      enum: [available, quarantine, in_transit, reserved]
    ExpiryState:
      type: string
      description: "`expired` Kedaluwarsa, `near_expiry` Segera kedaluwarsa, `ok` Aman, `no_expiry` Tanpa kedaluwarsa."
      enum: [expired, near_expiry, ok, no_expiry]
    StockMovementType:
      type: string
      enum: [receive, issue, move_out, move_in]
    StockQuantity:
      type: string
      description: Kuantitas desimal (maks. 3 angka di belakang koma) sebagai string; bisa negatif di kartu stok.
      pattern: "^-?[0-9]{1,15}(\\.[0-9]{1,3})?$"
      example: "12.000"
    UnitCost:
      type: string
      description: HPP per unit 4 desimal sebagai string.
      example: "12500.0000"
    StockProductRef:
      type: object
      required: [id, sku, name, uom]
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        uom:
          type: string
    StockLocationRef:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        warehouseName:
          type: string
    StockBalance:
      type: object
      required: [product, location, status, statusLabel, qty, unitCost, value, updatedAt]
      properties:
        product:
          $ref: "#/components/schemas/StockProductRef"
        location:
          $ref: "#/components/schemas/StockLocationRef"
        batchId:
          type: string
          format: uuid
        batchNumber:
          type: string
        productionDate:
          $ref: "../components/common.yaml#/BusinessDate"
        expiryDate:
          $ref: "../components/common.yaml#/BusinessDate"
        expiryState:
          $ref: "#/components/schemas/ExpiryState"
        status:
          $ref: "#/components/schemas/StockStatus"
        statusLabel:
          type: string
        qty:
          $ref: "#/components/schemas/StockQuantity"
        unitCost:
          $ref: "#/components/schemas/UnitCost"
        value:
          $ref: "../components/common.yaml#/Money"
        updatedAt:
          type: string
          format: date-time
    StockBalanceList:
      allOf:
        - $ref: "../components/common.yaml#/Pagination"
        - type: object
          required: [items, totalQty]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/StockBalance"
            totalQty:
              $ref: "#/components/schemas/StockQuantity"
    StockCardLine:
      type: object
      required: [movementId, businessDate, createdAt, sourceType, sourceId, sourceLabel, movementType, movementTypeLabel,
        location, status, statusLabel, qtyIn, qtyOut, unitCost, costAmount, runningQty, runningValue, note]
      properties:
        movementId:
          type: string
          format: uuid
        businessDate:
          $ref: "../components/common.yaml#/BusinessDate"
        createdAt:
          type: string
          format: date-time
        sourceType:
          type: string
        sourceId:
          type: string
          format: uuid
        sourceLabel:
          type: string
        movementType:
          $ref: "#/components/schemas/StockMovementType"
        movementTypeLabel:
          type: string
        location:
          $ref: "#/components/schemas/StockLocationRef"
        batchId:
          type: string
          format: uuid
        batchNumber:
          type: string
        status:
          $ref: "#/components/schemas/StockStatus"
        statusLabel:
          type: string
        qtyIn:
          $ref: "#/components/schemas/StockQuantity"
        qtyOut:
          $ref: "#/components/schemas/StockQuantity"
        unitCost:
          $ref: "#/components/schemas/UnitCost"
        costAmount:
          $ref: "../components/common.yaml#/Money"
        runningQty:
          $ref: "#/components/schemas/StockQuantity"
        runningValue:
          $ref: "../components/common.yaml#/Money"
        batchReason:
          type: string
        note:
          type: string
    StockCard:
      allOf:
        - $ref: "../components/common.yaml#/Pagination"
        - type: object
          required: [product, openingQty, openingValue, qtyIn, qtyOut, closingQty, closingValue, items]
          properties:
            product:
              $ref: "#/components/schemas/StockProductRef"
            openingQty:
              $ref: "#/components/schemas/StockQuantity"
            openingValue:
              $ref: "../components/common.yaml#/Money"
            qtyIn:
              $ref: "#/components/schemas/StockQuantity"
            qtyOut:
              $ref: "#/components/schemas/StockQuantity"
            closingQty:
              $ref: "#/components/schemas/StockQuantity"
            closingValue:
              $ref: "../components/common.yaml#/Money"
            items:
              type: array
              items:
                $ref: "#/components/schemas/StockCardLine"
    BatchSummary:
      type: object
      required: [id, product, batchNumber, expiryState, qtyAvailable, qtyQuarantine, qtyInTransit, qtyReserved, qtyTotal, createdAt]
      properties:
        id:
          type: string
          format: uuid
        product:
          $ref: "#/components/schemas/StockProductRef"
        batchNumber:
          type: string
        productionDate:
          $ref: "../components/common.yaml#/BusinessDate"
        expiryDate:
          $ref: "../components/common.yaml#/BusinessDate"
        daysToExpiry:
          type: integer
          description: Sisa hari sampai kedaluwarsa (negatif = sudah lewat).
        expiryState:
          $ref: "#/components/schemas/ExpiryState"
        qtyAvailable:
          $ref: "#/components/schemas/StockQuantity"
        qtyQuarantine:
          $ref: "#/components/schemas/StockQuantity"
        qtyInTransit:
          $ref: "#/components/schemas/StockQuantity"
        qtyReserved:
          $ref: "#/components/schemas/StockQuantity"
        qtyTotal:
          $ref: "#/components/schemas/StockQuantity"
        createdAt:
          type: string
          format: date-time
    BatchList:
      allOf:
        - $ref: "../components/common.yaml#/Pagination"
        - type: object
          required: [items, nearExpiryDays]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/BatchSummary"
            nearExpiryDays:
              type: integer
    SuggestedBatch:
      type: object
      required: [batchNumber, availableQty, suggestedQty]
      properties:
        batchId:
          type: string
          format: uuid
        batchNumber:
          type: string
        productionDate:
          $ref: "../components/common.yaml#/BusinessDate"
        expiryDate:
          $ref: "../components/common.yaml#/BusinessDate"
        availableQty:
          $ref: "#/components/schemas/StockQuantity"
        suggestedQty:
          $ref: "#/components/schemas/StockQuantity"
    BatchSuggestion:
      type: object
      required: [product, location, requestedQty, allocatedQty, shortfallQty, quarantineQty, items, expired]
      properties:
        product:
          $ref: "#/components/schemas/StockProductRef"
        location:
          $ref: "#/components/schemas/StockLocationRef"
        requestedQty:
          $ref: "#/components/schemas/StockQuantity"
        allocatedQty:
          $ref: "#/components/schemas/StockQuantity"
        shortfallQty:
          $ref: "#/components/schemas/StockQuantity"
        quarantineQty:
          $ref: "#/components/schemas/StockQuantity"
        items:
          type: array
          description: Batch Tersedia yang belum kedaluwarsa dalam urutan FEFO; suggestedQty 0 = tidak perlu diambil.
          items:
            $ref: "#/components/schemas/SuggestedBatch"
        expired:
          type: array
          description: Batch Tersedia yang sudah kedaluwarsa (tidak diusulkan).
          items:
            $ref: "#/components/schemas/SuggestedBatch"
    CostLayer:
      type: object
      required: [id, product, sourceType, sourceId, sourceLabel, businessDate, receivedQty, remainingQty, consumedQty,
        unitCost, remainingValue, createdAt]
      properties:
        id:
          type: string
          format: uuid
        product:
          $ref: "#/components/schemas/StockProductRef"
        batchId:
          type: string
          format: uuid
        batchNumber:
          type: string
        expiryDate:
          $ref: "../components/common.yaml#/BusinessDate"
        sourceType:
          type: string
        sourceId:
          type: string
          format: uuid
        sourceLabel:
          type: string
        businessDate:
          $ref: "../components/common.yaml#/BusinessDate"
        receivedQty:
          $ref: "#/components/schemas/StockQuantity"
        remainingQty:
          $ref: "#/components/schemas/StockQuantity"
        consumedQty:
          $ref: "#/components/schemas/StockQuantity"
        unitCost:
          $ref: "#/components/schemas/UnitCost"
        remainingValue:
          $ref: "../components/common.yaml#/Money"
        createdAt:
          type: string
          format: date-time
    CostLayerList:
      allOf:
        - $ref: "../components/common.yaml#/Pagination"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/CostLayer"
    CostLayerConsumption:
      type: object
      required: [id, movementId, businessDate, sourceType, sourceId, sourceLabel, location, qty, unitCost, amount]
      properties:
        id:
          type: string
          format: uuid
        movementId:
          type: string
          format: uuid
        businessDate:
          $ref: "../components/common.yaml#/BusinessDate"
        sourceType:
          type: string
        sourceId:
          type: string
          format: uuid
        sourceLabel:
          type: string
        location:
          $ref: "#/components/schemas/StockLocationRef"
        qty:
          $ref: "#/components/schemas/StockQuantity"
        unitCost:
          $ref: "#/components/schemas/UnitCost"
        amount:
          $ref: "../components/common.yaml#/Money"
