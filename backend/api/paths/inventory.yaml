          type: string
          format: uuid
        availableQty:
          $ref: "#/components/schemas/StockQuantity"
        components:
          type: array
          items:
            $ref: "#/components/schemas/BundleComponentAvailability"
    BundleAvailabilityList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BundleAvailability"
    InventoryDocStatus:
      type: string
      description: Status dokumen persediaan (Desain Status Dokumen bagian 1).
      enum: [draft, pending_approval, approved, rejected, in_progress, awaiting_settlement, posted, cancelled]
    InventoryDocAction:
      type: string
      description: Aksi yang boleh dilakukan user pada dokumen (allowedActions).
      enum: [edit, submit, revise, release, handover, settle, start, report, post, cancel]
    InternalUsagePurpose:
      type: string
      description: "`marketing` Marketing, `event` Event, `employee_sample` Sampel Karyawan, `sales_sampling` Sampling Sales."
      enum: [marketing, event, employee_sample, sales_sampling]
    InternalUsageAction:
      type: string
      enum: [submit, revise, release, handover, post, cancel]
    RepackingAction:
      type: string
      enum: [start, post, cancel]
    DisposalAction:
      type: string
      enum: [submit, revise, post, cancel]
    ReturnDispositionAction:
      type: string
      enum: [submit, revise, post, cancel]
    DisposalReason:
      type: string
      description: "`expired` Kedaluwarsa, `damaged` Rusak, `return` Barang Retur."
      enum: [expired, damaged, return]
    RepackDirection:
      type: string
      enum: [input, output]
    InventoryDocStockStatus:
      type: string
      description: Status stok baris dokumen (Tersedia atau Karantina).
      enum: [available, quarantine]
