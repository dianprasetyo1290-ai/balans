      type: object
      required: [id, number]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
        expiryDate:
          $ref: "../components/common.yaml#/BusinessDate"
    InventoryDimensionRef:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
    InventoryDimensionOption:
      allOf:
        - $ref: "#/components/schemas/InventoryDimensionRef"
