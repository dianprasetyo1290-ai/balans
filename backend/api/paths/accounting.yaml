    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SubChannelInput"
    responses:
      "201":
        description: Sub-channel dibuat
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Dimension"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
subChannel:
