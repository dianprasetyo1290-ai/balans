accounts:
  get:
    operationId: listAccounts
    tags: [accounting]
    summary: Chart of Accounts urut kode
    description: Butuh `accounting.account.read`. Tanpa `includeInactive` hanya akun aktif.
    parameters:
      - name: includeInactive
        in: query
        schema:
          type: boolean
          default: false
    responses:
      "200":
        description: Akun COA
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Account"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
  post:
    operationId: createAccount
    tags: [accounting]
    summary: Menambah akun COA (S-126)
    description: |
      Kode 4 digit, digit pertama = kelompok 1–7, unik permanen (`DUPLICATE_CODE`, termasuk akun yang sudah dihapus).
      Induk harus akun judul (tidak bisa diposting) dalam kelompok yang sama.
    parameters:
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AccountInput"
    responses:
      "201":
        description: Akun dibuat
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Account"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
account:
  get:
    operationId: getAccount
    tags: [accounting]
    summary: Detail akun
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
    responses:
      "200":
        description: Akun
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Account"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
  put:
    operationId: updateAccount
    tags: [accounting]
    summary: Mengubah akun
    description: |
      Kode tidak berubah. Saldo normal akun yang sudah dipakai jurnal tidak bisa diubah; akun terpakai tidak bisa
      dijadikan akun induk; akun yang punya sub-akun harus tetap akun induk.
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AccountUpdate"
    responses:
      "200":
        description: Akun diperbarui
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Account"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
  delete:
    operationId: deleteAccount
    tags: [accounting]
    summary: Menghapus akun yang belum dipakai (soft delete)
    description: Akun yang sudah dipakai jurnal atau posting rule, atau masih punya sub-akun, ditolak `INVALID_STATE_TRANSITION`.
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
      - $ref: "#/components/parameters/Version"
    responses:
      "204":
        description: Akun dihapus
      default:
        $ref: "../components/common.yaml#/responses/Problem"
channels:
  get:
    operationId: listChannels
    tags: [accounting]
    summary: Master channel (dimensi C)
    parameters:
      - $ref: "#/components/parameters/IncludeInactive"
    responses:
      "200":
        description: Channel
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Dimension"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
  post:
    operationId: createChannel
    tags: [accounting]
    summary: Menambah channel
    parameters:
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DimensionInput"
    responses:
      "201":
        description: Channel dibuat
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Dimension"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
channel:
  put:
    operationId: updateChannel
    tags: [accounting]
    summary: Mengubah channel (kode tetap)
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DimensionUpdate"
    responses:
      "200":
        description: Channel diperbarui
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Dimension"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
  delete:
    operationId: deleteChannel
    tags: [accounting]
    summary: Menghapus channel yang belum dipakai jurnal dan tanpa sub-channel
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
