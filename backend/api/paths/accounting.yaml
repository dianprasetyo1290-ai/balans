    operationId: updateSubChannel
    tags: [accounting]
    summary: Mengubah sub-channel (kode dan channel tetap)
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SubChannelUpdate"
    responses:
      "200":
        description: Sub-channel diperbarui
        content:
