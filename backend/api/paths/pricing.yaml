priceLists:
  get:
    operationId: listPriceLists
    tags: [pricing]
    summary: Data Master › Daftar Harga
    description: |
      Butuh `pricing.price_list.read` (atau `pricing.price_list.approve` untuk approver). Harga Dasar & HET selalu
      paling atas. `deleted=true` hanya menampilkan daftar harga terhapus (untuk dipulihkan Admin Sistem).
    parameters:
      - $ref: "../components/common.yaml#/parameters/Search"
      - name: priceListType
        in: query
        schema:
          $ref: "#/components/schemas/PriceListType"
      - name: includeInactive
        in: query
        schema:
          type: boolean
          default: false
      - name: deleted
        in: query
        schema:
          type: boolean
          default: false
    responses:
      "200":
        description: Daftar harga beserta versi yang berlaku, versi terjadwal, dan versi yang sedang disiapkan
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/PriceList"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
  post:
    operationId: createPriceList
    tags: [pricing]
    summary: Menambah daftar harga
    description: Harga diisi lewat versi yang diajukan untuk approval (Head Sales → Head Finance & Accounting).
    parameters:
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PriceListInput"
    responses:
      "201":
        description: Daftar harga dibuat
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceListDetail"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
priceListOptions:
  get:
    operationId: listPriceListOptions
    tags: [pricing]
    summary: Pilihan daftar harga aktif (acuan persentase, harga bertingkat)
    responses:
      "200":
        description: Daftar harga aktif yang belum dihapus
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/PriceListOption"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
priceList:
  parameters:
    - $ref: "../components/common.yaml#/parameters/Id"
  get:
    operationId: getPriceList
    tags: [pricing]
    summary: Detail daftar harga dan riwayat versi
    responses:
      "200":
        description: Daftar harga
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceListDetail"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
  put:
    operationId: updatePriceList
    tags: [pricing]
    summary: Mengubah header daftar harga (kode dan jenis tetap)
    parameters:
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PriceListUpdate"
    responses:
      "200":
        description: Daftar harga diperbarui
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceListDetail"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
  delete:
    operationId: deletePriceList
    tags: [pricing]
    summary: Menghapus (soft delete) daftar harga
    description: Harga Dasar & HET tidak bisa dihapus. Transaksi lama tetap menyimpan harga dan versinya.
    parameters:
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
      - $ref: "#/components/parameters/PricingVersion"
    responses:
      "204":
        description: Daftar harga dihapus
      default:
        $ref: "../components/common.yaml#/responses/Problem"
priceListRestore:
  parameters:
    - $ref: "../components/common.yaml#/parameters/Id"
  post:
    operationId: restorePriceList
    tags: [pricing]
    summary: Memulihkan daftar harga yang dihapus (hanya Admin Sistem)
    parameters:
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/common.yaml#/VersionInput"
    responses:
      "200":
        description: Daftar harga dipulihkan
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceListDetail"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
priceListVersions:
  parameters:
    - $ref: "../components/common.yaml#/parameters/Id"
  post:
    operationId: createPriceListVersion
    tags: [pricing]
    summary: Menyiapkan versi draft baru
    description: |
      `copyFromVersionId` menyalin harga versi lain bila `items` kosong. Paling banyak satu versi draft/diajukan per
      daftar harga. Tanggal mulai berlaku tidak boleh sebelum hari ini.
    parameters:
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PriceListVersionInput"
    responses:
      "201":
        description: Versi draft dibuat
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceListVersion"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
priceListVersion:
  parameters:
    - $ref: "../components/common.yaml#/parameters/Id"
  get:
    operationId: getPriceListVersion
    tags: [pricing]
    summary: Detail versi beserta harga per produk
    responses:
      "200":
        description: Versi daftar harga
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceListVersion"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
  put:
    operationId: updatePriceListVersion
    tags: [pricing]
    summary: Mengubah versi draft (seluruh item diganti)
    parameters:
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PriceListVersionUpdate"
    responses:
      "200":
        description: Versi diperbarui
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceListVersion"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
priceListVersionSubmit:
  parameters:
    - $ref: "../components/common.yaml#/parameters/Id"
  post:
    operationId: submitPriceListVersion
    tags: [pricing]
    summary: Mengajukan versi untuk approval price_list_version
    description: Versi berlaku setelah disetujui Head Sales lalu Head Finance & Accounting.
    parameters:
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/common.yaml#/VersionInput"
    responses:
      "200":
        description: Versi diajukan
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceListVersion"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
priceListVersionWithdraw:
  parameters:
    - $ref: "../components/common.yaml#/parameters/Id"
  post:
    operationId: withdrawPriceListVersion
    tags: [pricing]
    summary: Menarik kembali pengajuan menjadi draft
    parameters:
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/common.yaml#/VersionInput"
    responses:
      "200":
        description: Pengajuan ditarik
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceListVersion"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
priceListVersionCancel:
  parameters:
    - $ref: "../components/common.yaml#/parameters/Id"
  post:
    operationId: cancelPriceListVersion
    tags: [pricing]
    summary: Membatalkan versi draft
    parameters:
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/common.yaml#/VersionInput"
    responses:
      "200":
        description: Versi dibatalkan
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceListVersion"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
specialPrices:
  get:
    operationId: listSpecialPrices
    tags: [pricing]
    summary: Data Master › Aturan Harga › Harga Khusus
    parameters:
      - name: partyType
        in: query
        schema:
          $ref: "#/components/schemas/SpecialPricePartyType"
      - name: partyId
        in: query
        schema:
          type: string
          format: uuid
      - name: productId
        in: query
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/PricingIncludeEnded"
    responses:
      "200":
        description: Harga khusus
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/SpecialPrice"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
  post:
    operationId: createSpecialPrice
    tags: [pricing]
    summary: Menambah harga khusus pelanggan/mitra
    description: Harga khusus lama tanpa tanggal berakhir untuk pihak & produk yang sama ditutup otomatis.
    parameters:
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SpecialPriceInput"
    responses:
      "201":
        description: Harga khusus dibuat
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecialPrice"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
specialPrice:
  parameters:
    - $ref: "../components/common.yaml#/parameters/Id"
  delete:
    operationId: deleteSpecialPrice
    tags: [pricing]
    summary: Menghapus harga khusus yang belum pernah berlaku
    parameters:
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
      - $ref: "#/components/parameters/PricingVersion"
    responses:
      "204":
        description: Harga khusus dihapus
      default:
        $ref: "../components/common.yaml#/responses/Problem"
specialPriceEnd:
  parameters:
    - $ref: "../components/common.yaml#/parameters/Id"
  post:
    operationId: endSpecialPrice
    tags: [pricing]
    summary: Mengisi tanggal berakhir harga khusus
    parameters:
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PricingEndInput"
    responses:
      "200":
        description: Harga khusus diakhiri
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecialPrice"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
promotions:
  get:
    operationId: listPromotions
    tags: [pricing]
    summary: Data Master › Aturan Harga › Promo
    parameters:
      - $ref: "../components/common.yaml#/parameters/Search"
      - name: channelId
        in: query
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/PricingIncludeEnded"
      - name: deleted
        in: query
        schema:
          type: boolean
          default: false
    responses:
      "200":
        description: Promo tanpa item, terbaru dulu
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Promotion"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
  post:
    operationId: createPromotion
    tags: [pricing]
    summary: Menambah promo periode
    parameters:
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PromotionInput"
    responses:
      "201":
        description: Promo dibuat
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Promotion"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
promotion:
  parameters:
    - $ref: "../components/common.yaml#/parameters/Id"
  get:
    operationId: getPromotion
    tags: [pricing]
    summary: Detail promo beserta item
    responses:
      "200":
        description: Promo
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Promotion"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
  put:
    operationId: updatePromotion
    tags: [pricing]
    summary: Mengubah promo
    description: |
      Promo yang sudah berjalan hanya boleh diubah nama, keterangan, status, dan tanggal selesai (paling cepat
      kemarin); `items` harus sama dengan yang tersimpan atau dikosongkan.
    parameters:
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PromotionUpdate"
    responses:
      "200":
        description: Promo diperbarui
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Promotion"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
  delete:
    operationId: deletePromotion
    tags: [pricing]
    summary: Menghapus promo yang belum berjalan
    parameters:
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
      - $ref: "#/components/parameters/PricingVersion"
    responses:
      "204":
        description: Promo dihapus
      default:
        $ref: "../components/common.yaml#/responses/Problem"
tieredPrices:
  get:
    operationId: listTieredPrices
    tags: [pricing]
    summary: Data Master › Aturan Harga › Harga Bertingkat
    parameters:
      - name: productId
        in: query
        schema:
          type: string
          format: uuid
      - name: priceListId
        in: query
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/PricingIncludeEnded"
    responses:
      "200":
        description: Harga bertingkat
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/TieredPrice"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
  post:
    operationId: createTieredPrice
    tags: [pricing]
    summary: Menambah harga bertingkat per qty minimum
    parameters:
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TieredPriceInput"
    responses:
      "201":
        description: Harga bertingkat dibuat
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TieredPrice"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
tieredPrice:
  parameters:
    - $ref: "../components/common.yaml#/parameters/Id"
  delete:
    operationId: deleteTieredPrice
    tags: [pricing]
    summary: Menghapus harga bertingkat yang belum pernah berlaku
    parameters:
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
      - $ref: "#/components/parameters/PricingVersion"
    responses:
      "204":
        description: Harga bertingkat dihapus
      default:
        $ref: "../components/common.yaml#/responses/Problem"
tieredPriceEnd:
  parameters:
    - $ref: "../components/common.yaml#/parameters/Id"
  post:
    operationId: endTieredPrice
    tags: [pricing]
    summary: Mengisi tanggal berakhir harga bertingkat
    parameters:
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PricingEndInput"
    responses:
      "200":
        description: Harga bertingkat diakhiri
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TieredPrice"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
discountLimits:
  get:
    operationId: listDiscountLimits
    tags: [pricing]
    summary: Penjualan › Harga & Diskon › Batas Diskon per Role
    parameters:
      - $ref: "#/components/parameters/PricingIncludeEnded"
    responses:
      "200":
        description: Batas diskon per role
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/DiscountLimit"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
  post:
    operationId: createDiscountLimit
    tags: [pricing]
    summary: Menetapkan batas diskon role mulai tanggal tertentu
    description: Batas lama tanpa tanggal berakhir ditutup otomatis sehari sebelum batas baru berlaku.
    parameters:
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DiscountLimitInput"
    responses:
      "201":
        description: Batas diskon dibuat
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscountLimit"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
discountLimitRoles:
  get:
    operationId: listDiscountLimitRoles
    tags: [pricing]
    summary: Pilihan role untuk batas diskon
    responses:
      "200":
        description: Role pembuat dokumen penjualan
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/DiscountLimitRole"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
discountLimit:
  parameters:
    - $ref: "../components/common.yaml#/parameters/Id"
  delete:
    operationId: deleteDiscountLimit
    tags: [pricing]
    summary: Menghapus batas diskon yang belum pernah berlaku
    parameters:
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
      - $ref: "#/components/parameters/PricingVersion"
    responses:
      "204":
        description: Batas diskon dihapus
      default:
        $ref: "../components/common.yaml#/responses/Problem"
discountLimitEnd:
  parameters:
    - $ref: "../components/common.yaml#/parameters/Id"
  post:
    operationId: endDiscountLimit
    tags: [pricing]
    summary: Mengisi tanggal berakhir batas diskon
    parameters:
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PricingEndInput"
    responses:
      "200":
        description: Batas diskon diakhiri
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscountLimit"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
priceQuote:
  post:
    operationId: quotePrice
    tags: [pricing]
    summary: Simulasi harga (resolver 5 aturan BRD 5.18)
    description: |
      Menjalankan resolver yang sama dengan transaksi: harga khusus → promo → harga bertingkat → daftar harga
      channel/mitra/karyawan → Harga Dasar & HET, berdasarkan tanggal transaksi. Tidak menyimpan data, sehingga
      tidak memakai Idempotency-Key.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PriceQuoteRequest"
    responses:
      "200":
        description: Harga dan aturan yang dipakai
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceQuote"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
discountCheck:
  post:
    operationId: checkDiscount
    tags: [pricing]
    summary: Simulasi diskon manual terhadap batas diskon role user yang login
    description: |
      Subtotal dokumen = total bruto baris dikurangi diskon baris. Diskon di atas batas berarti Sales Order butuh
      approval `sales_order_discount` (Head Sales). Tidak menyimpan data.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DiscountCheckRequest"
    responses:
      "200":
        description: Hasil pemeriksaan diskon
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscountCheckResult"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
components:
  parameters:
    PricingVersion:
      name: version
      in: query
      required: true
      description: Versi terakhir yang dilihat user (optimistic locking).
      schema:
        type: integer
    PricingIncludeEnded:
      name: includeEnded
      in: query
      description: Tampilkan juga data yang periodenya sudah berakhir (riwayat).
      schema:
        type: boolean
        default: false
  schemas:
    PriceListType:
      type: string
      description: |
        Cakupan daftar harga (BRD 5.18): `base` Harga Dasar & HET, `channel` per channel/sub-channel, `partner` per
        mitra, `reseller` per level reseller (Fase 2), `employee` harga karyawan, `vending` per channel vending/mesin.
      enum: [base, channel, partner, reseller, employee, vending]
    PriceListBasis:
      type: string
      description: "`fixed` harga per produk; `percent` persentase dari daftar harga acuan."
      enum: [fixed, percent]
    PriceListVersionStatus:
      type: string
      enum: [draft, pending_approval, active, rejected, cancelled]
    PricingPeriodStatus:
      type: string
      description: Posisi periode berlaku terhadap hari ini.
      enum: [scheduled, active, expired]
    PricingPercent:
      type: string
      description: Persen desimal maks. 4 angka di belakang koma, mis. `12.5`.
      pattern: "^[0-9]{1,4}(\\.[0-9]{1,4})?$"
      example: "10"
    PricingQuantity:
      type: string
      description: Kuantitas desimal maks. 3 angka di belakang koma.
      pattern: "^[0-9]{1,15}(\\.[0-9]{1,3})?$"
      example: "12"
    PriceListVersionSummary:
      type: object
      required: [id, versionNo, status, validFrom, itemCount, notes, updatedAt, version]
      properties:
        id:
          type: string
          format: uuid
        versionNo:
          type: integer
        status:
          $ref: "#/components/schemas/PriceListVersionStatus"
        validFrom:
          $ref: "../components/common.yaml#/BusinessDate"
        validTo:
          allOf:
            - $ref: "../components/common.yaml#/BusinessDate"
          nullable: true
        percent:
          allOf:
            - $ref: "#/components/schemas/PricingPercent"
          nullable: true
        itemCount:
          type: integer
        notes:
          type: string
        submittedAt:
          type: string
          format: date-time
          nullable: true
        decidedAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
    PriceListOption:
      type: object
      required: [id, code, name, priceListType, basis]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        priceListType:
          $ref: "#/components/schemas/PriceListType"
        basis:
          $ref: "#/components/schemas/PriceListBasis"
    PriceList:
      type: object
      required: [id, code, name, priceListType, resellerLevel, basis, description, isActive, updatedAt, version]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: MT-BELI-PUTUS
