procurementInboundLocations:
  get:
    operationId: listProcurementInboundLocations
    tags: [procurement]
    summary: Lokasi Inbound aktif untuk form Penerimaan Barang
    responses:
      "200":
        description: Lokasi Inbound aktif
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "./procurement.yaml#/components/schemas/PurchaseLocationRef"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
goodsReceipts:
  get:
    operationId: listGoodsReceipts
    tags: [procurement]
    summary: Daftar Penerimaan Barang (S-206, S-207)
    parameters:
      - $ref: "../components/common.yaml#/parameters/Page"
      - $ref: "../components/common.yaml#/parameters/PageSize"
      - $ref: "../components/common.yaml#/parameters/Search"
      - name: status
        in: query
        schema:
          $ref: "#/components/schemas/GoodsReceiptStatus"
      - name: orderType
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            $ref: "../components/common.yaml#/PurchaseOrderType"
      - name: purchaseOrderId
        in: query
        schema:
          type: string
          format: uuid
      - name: supplierId
        in: query
        schema:
          type: string
          format: uuid
      - name: dateFrom
        in: query
        schema:
          $ref: "../components/common.yaml#/BusinessDate"
      - name: dateTo
        in: query
        schema:
          $ref: "../components/common.yaml#/BusinessDate"
    responses:
      "200":
        description: Penerimaan terbaru lebih dulu
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoodsReceiptList"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
  post:
    operationId: createGoodsReceipt
    tags: [procurement]
    summary: Menyimpan draft Penerimaan Barang untuk PO Disetujui/Diterima Sebagian
    parameters:
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GoodsReceiptInput"
    responses:
      "201":
        description: Draft dibuat
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoodsReceipt"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
goodsReceipt:
  get:
    operationId: getGoodsReceipt
    tags: [procurement]
    summary: Detail Penerimaan Barang
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
    responses:
      "200":
        description: Penerimaan Barang
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoodsReceipt"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
  put:
    operationId: updateGoodsReceipt
    tags: [procurement]
    summary: Mengubah draft Penerimaan Barang
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GoodsReceiptUpdate"
    responses:
      "200":
        description: Draft diperbarui
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoodsReceipt"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
goodsReceiptPost:
  post:
    operationId: postGoodsReceipt
    tags: [procurement]
    summary: Posting Penerimaan Barang (stok Inbound Karantina, jurnal A-01/A-03)
    description: |
      Nomor `GR/TAHUN/BULAN/NOMOR`; PO maklon/reprocess mengeluarkan packaging/bahan terpakai (baik + reject) dari
      lokasi maklon dengan HPP FIFO; HPP per unit = nilai batch ÷ qty baik; stok baik masuk lokasi Inbound berstatus
      Karantina; jurnal A-01 atau A-03; qty diterima PO dan dokumen Inbound/QC, semuanya di satu transaksi.
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/common.yaml#/VersionInput"
    responses:
      "200":
        description: Diposting
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoodsReceipt"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
goodsReceiptCancel:
  post:
    operationId: cancelGoodsReceipt
    tags: [procurement]
    summary: Batalkan Penerimaan Barang
    description: |
      Draft (hak tulis) atau Diposting yang belum ditagih/diretur dan belum di-QC (hak batal, alasan wajib): stok dan
      jurnal dibalik di transaksi yang sama.
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "./procurement.yaml#/components/schemas/PurchaseCancelInput"
    responses:
      "200":
        description: Dibatalkan
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoodsReceipt"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
billableReceipts:
  get:
    operationId: listBillableReceipts
    tags: [procurement]
    summary: Baris Penerimaan Barang PO yang belum ditagih (form Tagihan Pemasok)
    parameters:
      - name: purchaseOrderId
        in: query
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Baris GR yang masih bisa ditagih beserta default PPh, termin, sisa uang muka, dan toleransi
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillableReceipts"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
supplierBills:
  get:
    operationId: listSupplierBills
    tags: [procurement]
    summary: Daftar Tagihan Pemasok (S-208)
    parameters:
      - $ref: "../components/common.yaml#/parameters/Page"
      - $ref: "../components/common.yaml#/parameters/PageSize"
      - $ref: "../components/common.yaml#/parameters/Search"
      - name: status
        in: query
        schema:
          $ref: "#/components/schemas/SupplierBillStatus"
      - name: matchStatus
        in: query
        schema:
          $ref: "#/components/schemas/SupplierBillMatchStatus"
      - name: purchaseOrderId
        in: query
        schema:
          type: string
          format: uuid
      - name: supplierId
        in: query
        schema:
          type: string
          format: uuid
      - name: dateFrom
        in: query
        schema:
          $ref: "../components/common.yaml#/BusinessDate"
      - name: dateTo
        in: query
        schema:
          $ref: "../components/common.yaml#/BusinessDate"
    responses:
      "200":
        description: Tagihan terbaru lebih dulu
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierBillList"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
  post:
    operationId: createSupplierBill
    tags: [procurement]
    summary: Menyimpan draft tagihan pemasok dan menampilkan hasil 3-way match
    parameters:
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SupplierBillInput"
    responses:
      "201":
        description: Draft dibuat
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierBill"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
supplierBill:
  get:
    operationId: getSupplierBill
    tags: [procurement]
    summary: Detail tagihan pemasok
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
    responses:
      "200":
        description: Tagihan pemasok
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierBill"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
  put:
    operationId: updateSupplierBill
    tags: [procurement]
    summary: Mengubah draft tagihan pemasok
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SupplierBillUpdate"
    responses:
      "200":
        description: Draft diperbarui
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierBill"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
supplierBillPost:
  post:
    operationId: postSupplierBill
    tags: [procurement]
    summary: Posting tagihan pemasok (3-way match, jurnal A-18)
    description: |
      Dalam toleransi (qty 0%, harga 1%): jurnal A-18 (Dr 2102 + selisih harga 5103, Cr 2101 dan utang PPh sesuai
      PPh default pemasok), uang muka PO dipotong otomatis (A-19 `advance_applied`), qty ditagih PO/GR, dan utang
      terbentuk. Di luar toleransi: Menunggu Persetujuan `supplier_bill_exception` (Head F&A), pembayaran diblokir.
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/common.yaml#/VersionInput"
    responses:
      "200":
        description: Diposting atau menunggu persetujuan selisih
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierBill"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
supplierBillRevise:
  post:
    operationId: reviseSupplierBill
    tags: [procurement]
    summary: Kembalikan tagihan yang ditolak ke Draft
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/common.yaml#/VersionInput"
    responses:
      "200":
        description: Kembali Draft
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierBill"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
supplierBillCancel:
  post:
    operationId: cancelSupplierBill
    tags: [procurement]
    summary: Batalkan tagihan Draft atau Ditolak
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "./procurement.yaml#/components/schemas/PurchaseCancelInput"
    responses:
      "200":
        description: Dibatalkan
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierBill"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
returnableReceipts:
  get:
    operationId: listReturnableReceipts
    tags: [procurement]
    summary: Baris Penerimaan Barang PO yang masih bisa diretur (form Retur Pembelian)
    parameters:
      - name: purchaseOrderId
        in: query
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Baris GR yang masih bisa diretur
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnableReceipts"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
purchaseReturns:
  get:
    operationId: listPurchaseReturns
    tags: [procurement]
    summary: Daftar Retur Pembelian & nota debit (S-210)
    parameters:
      - $ref: "../components/common.yaml#/parameters/Page"
      - $ref: "../components/common.yaml#/parameters/PageSize"
      - $ref: "../components/common.yaml#/parameters/Search"
      - name: status
        in: query
        schema:
          $ref: "#/components/schemas/PurchaseReturnStatus"
      - name: origin
        in: query
        schema:
          $ref: "#/components/schemas/PurchaseReturnOrigin"
      - name: purchaseOrderId
        in: query
        schema:
          type: string
          format: uuid
      - name: supplierId
        in: query
        schema:
          type: string
          format: uuid
      - name: dateFrom
        in: query
        schema:
          $ref: "../components/common.yaml#/BusinessDate"
      - name: dateTo
        in: query
        schema:
          $ref: "../components/common.yaml#/BusinessDate"
    responses:
      "200":
        description: Retur terbaru lebih dulu
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseReturnList"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
  post:
    operationId: createPurchaseReturn
    tags: [procurement]
    summary: Menyimpan draft retur pembelian manual
    description: Retur manual butuh persetujuan Head Logistik sebelum diposting; retur asal QC dibuat modul gudang.
    parameters:
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PurchaseReturnInput"
    responses:
      "201":
        description: Draft dibuat
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseReturn"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
purchaseReturn:
  get:
    operationId: getPurchaseReturn
    tags: [procurement]
    summary: Detail retur pembelian
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
    responses:
      "200":
        description: Retur pembelian
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseReturn"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
  put:
    operationId: updatePurchaseReturn
    tags: [procurement]
    summary: Mengubah draft retur pembelian
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PurchaseReturnUpdate"
    responses:
      "200":
        description: Draft diperbarui
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseReturn"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
purchaseReturnSubmit:
  post:
    operationId: submitPurchaseReturn
    tags: [procurement]
    summary: Ajukan retur pembelian ke Head Logistik (nomor RB)
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/common.yaml#/VersionInput"
    responses:
      "200":
        description: Menunggu persetujuan
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseReturn"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
purchaseReturnPost:
  post:
    operationId: postPurchaseReturn
    tags: [procurement]
    summary: Posting retur pembelian (nota debit DN, jurnal A-02)
    description: |
      Barang keluar dari lokasi/status asal dengan HPP FIFO; bagian yang belum ditagih mengurangi 2102 (qty diterima PO
      ikut berkurang), bagian yang sudah ditagih mengurangi utang 2101 lewat nota debit.
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/common.yaml#/VersionInput"
    responses:
      "200":
        description: Diposting
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseReturn"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
purchaseReturnRevise:
  post:
    operationId: revisePurchaseReturn
    tags: [procurement]
    summary: Kembalikan retur yang ditolak ke Draft
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/common.yaml#/VersionInput"
    responses:
      "200":
        description: Kembali Draft
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseReturn"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
purchaseReturnCancel:
  post:
    operationId: cancelPurchaseReturn
    tags: [procurement]
    summary: Batalkan retur Draft atau Disetujui
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "./procurement.yaml#/components/schemas/PurchaseCancelInput"
    responses:
      "200":
        description: Dibatalkan
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseReturn"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
goodsReceivedNotInvoiced:
  get:
    operationId: getGoodsReceivedNotInvoiced
    tags: [procurement]
    summary: Laporan Barang Diterima Belum Ditagih per PO/GR (S-209)
    description: Saldo per baris GR dan rekonsiliasi ke saldo akun 2102 (total sub-ledger, saldo buku besar, selisih).
    parameters:
      - $ref: "../components/common.yaml#/parameters/Search"
      - name: supplierId
        in: query
        schema:
          type: string
          format: uuid
      - name: purchaseOrderId
        in: query
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Laporan per hari ini
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoodsReceivedNotInvoicedReport"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
components:
  schemas:
    PurchaseUnitCost:
      type: string
      description: HPP per unit, maks. 4 angka di belakang koma.
      example: "12500.0000"
    PurchasePercent:
      type: string
      description: Persentase desimal maks. 4 angka di belakang koma, mis. "2" untuk 2%.
      pattern: "^-?[0-9]{1,5}(\\.[0-9]{1,4})?$"
      example: "2.0000"
    PurchaseStockStatus:
      type: string
      description: Status stok asal retur.
      enum: [quarantine, available]
    GoodsReceiptStatus:
      type: string
      enum: [draft, posted, cancelled]
    RejectDisposition:
      type: string
      description: |
        `absorbed` reject ditanggung Balans (ikut ditagih, nilai diserap ke HPP barang baik); `return_to_supplier`
        ditolak di tempat dan diganti pemasok (tidak masuk stok maupun tagihan).
      enum: [absorbed, return_to_supplier]
    GoodsReceiptSummary:
      type: object
      required:
        - id
        - purchaseOrderId
        - purchaseOrderNumber
        - orderType
        - supplierId
        - supplierName
        - businessDate
        - deliveryNote
        - inventoryAmount
        - grniAmount
        - status
        - createdAt
        - updatedAt
        - version
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          nullable: true
          description: Nomor GR, diisi saat diposting.
        purchaseOrderId:
          type: string
          format: uuid
        purchaseOrderNumber:
          type: string
        orderType:
          $ref: "../components/common.yaml#/PurchaseOrderType"
        supplierId:
          type: string
          format: uuid
        supplierName:
          type: string
        businessDate:
          $ref: "../components/common.yaml#/BusinessDate"
        deliveryNote:
          type: string
        inventoryAmount:
          $ref: "../components/common.yaml#/Money"
        grniAmount:
          $ref: "../components/common.yaml#/Money"
        status:
          $ref: "#/components/schemas/GoodsReceiptStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
    GoodsReceiptLine:
      type: object
      required:
        - id
        - lineNo
        - purchaseOrderLineId
        - product
        - orderedQty
        - goodQty
        - rejectQty
        - rejectDisposition
        - batchNumber
        - unitPrice
        - grniQty
        - grniAmount
        - materialCostAmount
        - inventoryAmount
        - unitCost
        - inventoryAccountCode
        - billedQty
        - returnedQty
        - openQty
        - note
      properties:
        id:
          type: string
          format: uuid
        lineNo:
          type: integer
        purchaseOrderLineId:
          type: string
          format: uuid
        product:
          $ref: "./procurement.yaml#/components/schemas/PurchaseProductRef"
        orderedQty:
          $ref: "./procurement.yaml#/components/schemas/PurchaseQuantity"
        goodQty:
          $ref: "./procurement.yaml#/components/schemas/PurchaseQuantity"
        rejectQty:
          $ref: "./procurement.yaml#/components/schemas/PurchaseQuantity"
        rejectDisposition:
          $ref: "#/components/schemas/RejectDisposition"
        batchNumber:
          type: string
        productionDate:
          allOf:
            - $ref: "../components/common.yaml#/BusinessDate"
          nullable: true
        expiryDate:
          allOf:
            - $ref: "../components/common.yaml#/BusinessDate"
          nullable: true
        batchId:
          type: string
          format: uuid
          nullable: true
        unitPrice:
          $ref: "../components/common.yaml#/Money"
        grniQty:
          $ref: "./procurement.yaml#/components/schemas/PurchaseQuantity"
        grniAmount:
          $ref: "../components/common.yaml#/Money"
        materialCostAmount:
          $ref: "../components/common.yaml#/Money"
        inventoryAmount:
          $ref: "../components/common.yaml#/Money"
        unitCost:
          $ref: "#/components/schemas/PurchaseUnitCost"
        inventoryAccountCode:
          type: string
        billedQty:
          $ref: "./procurement.yaml#/components/schemas/PurchaseQuantity"
        returnedQty:
          $ref: "./procurement.yaml#/components/schemas/PurchaseQuantity"
        openQty:
          $ref: "./procurement.yaml#/components/schemas/PurchaseQuantity"
        note:
          type: string
    GoodsReceiptMaterial:
      type: object
      required: [id, lineNo, product, usedGoodQty, usedRejectQty, costAmount, accountCode, note]
      properties:
        id:
          type: string
          format: uuid
        lineNo:
          type: integer
        product:
          $ref: "./procurement.yaml#/components/schemas/PurchaseProductRef"
        usedGoodQty:
          $ref: "./procurement.yaml#/components/schemas/PurchaseQuantity"
        usedRejectQty:
          $ref: "./procurement.yaml#/components/schemas/PurchaseQuantity"
        costAmount:
          $ref: "../components/common.yaml#/Money"
        accountCode:
          type: string
        note:
          type: string
    GoodsReceipt:
      allOf:
        - $ref: "#/components/schemas/GoodsReceiptSummary"
        - type: object
          required:
            - divisionId
            - divisionName
            - location
            - note
            - materialAmount
            - cancelReason
            - createdByName
            - lines
            - materials
            - allowedActions
          properties:
            divisionId:
              type: string
              format: uuid
            divisionName:
              type: string
            location:
              $ref: "./procurement.yaml#/components/schemas/PurchaseLocationRef"
            tollLocation:
              allOf:
