# Kas & Bank, Rekonsiliasi Bank, Biaya Operasional, Kas Kecil, Pajak & Bukti Potong (R1.4: S-401, S-402, S-404 – S-407).
# Tag `accounting`; handler di backend/internal/accounting/http/finance*.go.
cashBankAccounts:
  get:
    operationId: listCashBankAccounts
    tags:
    - accounting
    summary: Kas & Bank › Rekening
    description: Butuh `accounting.payment.read` (atau hak baca rekonsiliasi, kas kecil, pajak, verifikasi biaya untuk dropdown). Nomor
      rekening tersamar.
    parameters:
    - name: includeInactive
      in: query
      schema:
        type: boolean
        default: false
    - name: deleted
      in: query
      schema:
        type: boolean
        default: false
      description: Daftar Dihapus
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CashBankAccount'
      default:
        $ref: ../components/common.yaml#/responses/Problem
  post:
    operationId: createCashBankAccount
    tags:
    - accounting
    summary: Menambah rekening kas/bank
    description: Akun GL wajib akun Kas & Bank 11xx yang bisa diposting (bukan 1102 Kas Kecil); satu akun hanya untuk satu rekening.
      Nomor rekening disimpan terenkripsi.
    parameters:
    - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CashBankAccountInput'
    responses:
      '201':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashBankAccount'
      default:
        $ref: ../components/common.yaml#/responses/Problem
cashBankAccount:
  get:
    operationId: getCashBankAccount
    tags:
    - accounting
    summary: Detail rekening (nomor rekening lengkap)
    parameters:
    - $ref: ../components/common.yaml#/parameters/Id
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashBankAccount'
      default:
        $ref: ../components/common.yaml#/responses/Problem
  put:
    operationId: updateCashBankAccount
    tags:
    - accounting
    summary: Mengubah rekening
    description: Akun GL tidak bisa diganti setelah rekening dipakai transaksi.
    parameters:
    - $ref: ../components/common.yaml#/parameters/Id
    - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CashBankAccountUpdate'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashBankAccount'
      default:
        $ref: ../components/common.yaml#/responses/Problem
  delete:
    operationId: deleteCashBankAccount
    tags:
    - accounting
    summary: Menghapus rekening (soft delete)
    parameters:
    - $ref: ../components/common.yaml#/parameters/Id
    - $ref: '#/components/parameters/Version'
    - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    responses:
      '204':
        description: Rekening dihapus
      default:
        $ref: ../components/common.yaml#/responses/Problem
cashBankAccountRestore:
  post:
    operationId: restoreCashBankAccount
    tags:
    - accounting
    summary: Memulihkan rekening terhapus (Admin Sistem)
    parameters:
    - $ref: ../components/common.yaml#/parameters/Id
    - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/common.yaml#/VersionInput
    responses:
      '204':
        description: Rekening dipulihkan
      default:
        $ref: ../components/common.yaml#/responses/Problem
cashBankMutations:
  get:
    operationId: listCashBankMutations
    tags:
    - accounting
    summary: Mutasi rekening dengan saldo berjalan
    description: 'Baris jurnal akun GL rekening (semua sumber: pembayaran, kas kecil, pajak, jurnal umum) urut tanggal; `balance` =
      saldo awal + kumulatif.'
    parameters:
    - $ref: ../components/common.yaml#/parameters/Id
    - name: dateFrom
      in: query
      schema:
        $ref: ../components/common.yaml#/BusinessDate
      required: true
    - name: dateTo
      in: query
      schema:
        $ref: ../components/common.yaml#/BusinessDate
      required: true
    - $ref: ../components/common.yaml#/parameters/Page
    - $ref: ../components/common.yaml#/parameters/PageSize
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankMutationList'
      default:
        $ref: ../components/common.yaml#/responses/Problem
cashPayments:
  get:
    operationId: listCashPayments
    tags:
    - accounting
    summary: Kas & Bank › Pembayaran masuk/keluar
    parameters:
    - $ref: ../components/common.yaml#/parameters/Page
    - $ref: ../components/common.yaml#/parameters/PageSize
    - $ref: ../components/common.yaml#/parameters/Search
    - name: bankAccountId
      in: query
      schema:
        type: string
        format: uuid
    - name: direction
      in: query
      schema:
        $ref: ../components/common.yaml#/PaymentDirection
    - name: status
      in: query
      schema:
        $ref: '#/components/schemas/CashPaymentStatus'
    - name: dateFrom
      in: query
      schema:
        $ref: ../components/common.yaml#/BusinessDate
    - name: dateTo
      in: query
      schema:
        $ref: ../components/common.yaml#/BusinessDate
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashPaymentList'
      default:
        $ref: ../components/common.yaml#/responses/Problem
  post:
    operationId: createCashPayment
    tags:
    - accounting
    summary: Menyimpan draft pembayaran manual
    description: Akun lawan wajib akun yang boleh dipakai jurnal manual (bukan akun kontrol piutang/utang).
    parameters:
    - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CashPaymentInput'
    responses:
      '201':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashPayment'
      default:
        $ref: ../components/common.yaml#/responses/Problem
cashPayment:
  get:
    operationId: getCashPayment
    tags:
    - accounting
    summary: Detail pembayaran
    parameters:
    - $ref: ../components/common.yaml#/parameters/Id
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashPayment'
      default:
        $ref: ../components/common.yaml#/responses/Problem
  put:
    operationId: updateCashPayment
    tags:
    - accounting
    summary: Mengubah draft pembayaran
    parameters:
    - $ref: ../components/common.yaml#/parameters/Id
    - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CashPaymentUpdate'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashPayment'
      default:
        $ref: ../components/common.yaml#/responses/Problem
cashPaymentPost:
  post:
    operationId: postCashPayment
    tags:
    - accounting
    summary: Posting pembayaran (nomor BYR, jurnal A-PB)
    description: Pembayaran keluar butuh re-autentikasi `accounting.payment.post` (★, `AUTH_REAUTH_REQUIRED`).
    parameters:
    - $ref: ../components/common.yaml#/parameters/Id
    - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/common.yaml#/VersionInput
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashPayment'
      default:
        $ref: ../components/common.yaml#/responses/Problem
cashPaymentCancel:
  post:
    operationId: cancelCashPayment
    tags:
    - accounting
    summary: Membatalkan pembayaran
    description: Draft dibatalkan biasa; pembayaran manual Diposting yang belum direkonsiliasi dibatalkan dengan jurnal pembalik.
    parameters:
    - $ref: ../components/common.yaml#/parameters/Id
    - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FinanceCancelInput'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashPayment'
      default:
        $ref: ../components/common.yaml#/responses/Problem
bankStatements:
  get:
    operationId: listBankStatements
    tags:
    - accounting
    summary: Rekonsiliasi Bank › File mutasi
    parameters:
    - $ref: ../components/common.yaml#/parameters/Page
    - $ref: ../components/common.yaml#/parameters/PageSize
    - name: bankAccountId
      in: query
      schema:
        type: string
        format: uuid
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankStatementList'
      default:
        $ref: ../components/common.yaml#/responses/Problem
  post:
    operationId: importBankStatement
    tags:
    - accounting
    summary: Impor file mutasi rekening (CSV/Excel)
    description: Unggah file lebih dulu ke filestore dengan ownerType `bank_statement`. Kolom dikenali dari judul umum (Tanggal, Keterangan,
      Referensi, Debit/Kredit atau Nominal + D/K, Saldo). Pencocokan otomatis dijalankan setelah impor. Butuh `accounting.bank_reconciliation.import`.
    parameters:
    - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BankStatementImportInput'
    responses:
      '201':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankStatementDetail'
      default:
        $ref: ../components/common.yaml#/responses/Problem
bankStatement:
  get:
    operationId: getBankStatement
    tags:
    - accounting
    summary: Detail file mutasi beserta baris dan usulan
    parameters:
    - $ref: ../components/common.yaml#/parameters/Id
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankStatementDetail'
      default:
        $ref: ../components/common.yaml#/responses/Problem
bankStatementAutoMatch:
  post:
    operationId: autoMatchBankStatement
    tags:
    - accounting
    summary: Jalankan ulang pencocokan otomatis
    description: 'Aturan berurutan: referensi persis → nominal + tanggal (±3 hari) → manual. Usulan lama baris belum direkonsiliasi
      diganti.'
    parameters:
    - $ref: ../components/common.yaml#/parameters/Id
    - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankStatementDetail'
      default:
        $ref: ../components/common.yaml#/responses/Problem
bankStatementConfirm:
  post:
    operationId: confirmBankStatementSuggestions
    tags:
    - accounting
    summary: Konfirmasi semua usulan pencocokan
    parameters:
    - $ref: ../components/common.yaml#/parameters/Id
    - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankConfirmResult'
      default:
        $ref: ../components/common.yaml#/responses/Problem
bankStatementLineCandidates:
  get:
    operationId: listBankStatementLineCandidates
    tags:
    - accounting
    summary: Calon pasangan manual satu baris mutasi
    parameters:
    - $ref: ../components/common.yaml#/parameters/Id
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/BankMatchCandidate'
      default:
        $ref: ../components/common.yaml#/responses/Problem
bankStatementLineConfirm:
  post:
    operationId: confirmBankStatementLine
    tags:
    - accounting
    summary: Konfirmasi usulan satu baris
    parameters:
    - $ref: ../components/common.yaml#/parameters/Id
    - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/common.yaml#/VersionInput
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankStatementLine'
      default:
        $ref: ../components/common.yaml#/responses/Problem
bankStatementLineMatch:
  post:
    operationId: matchBankStatementLine
    tags:
    - accounting
    summary: Cocokkan manual
    description: Isi `journalLineId` (baris jurnal akun rekening, nominal sama) atau `source` + `documentId` (dokumen terbuka penyedia
      kandidat; pembayaran BYR dibuat otomatis).
    parameters:
    - $ref: ../components/common.yaml#/parameters/Id
    - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BankLineMatchInput'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankStatementLine'
      default:
        $ref: ../components/common.yaml#/responses/Problem
bankStatementLineEntry:
  post:
    operationId: createBankStatementLineEntry
    tags:
    - accounting
    summary: Buat jurnal dari baris tak cocok
    description: Membuat pembayaran Diposting (A-PB) ke akun lawan (mis. 7202 Beban Bank, 7101 Pendapatan Lain-lain) lalu menandai baris
      direkonsiliasi.
    parameters:
    - $ref: ../components/common.yaml#/parameters/Id
    - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BankLineEntryInput'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankStatementLine'
      default:
        $ref: ../components/common.yaml#/responses/Problem
bankStatementLineUnmatch:
  post:
    operationId: unmatchBankStatementLine
    tags:
    - accounting
    summary: Lepas pencocokan
    parameters:
    - $ref: ../components/common.yaml#/parameters/Id
    - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/common.yaml#/VersionInput
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankStatementLine'
      default:
        $ref: ../components/common.yaml#/responses/Problem
expenseClaimOptions:
  get:
    operationId: getExpenseClaimOptions
    tags:
    - accounting
    summary: Pilihan form pengajuan (divisi, kampanye, jenis biaya)
    description: Butuh `accounting.expense_claim.read` saja agar semua divisi bisa mengajukan.
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseClaimOptions'
      default:
        $ref: ../components/common.yaml#/responses/Problem
expenseClaims:
  get:
    operationId: listExpenseClaims
    tags:
    - accounting
    summary: Biaya Operasional › Pengajuan biaya
    description: Pengaju tanpa hak verifikasi/approve hanya melihat pengajuannya sendiri.
    parameters:
    - $ref: ../components/common.yaml#/parameters/Page
    - $ref: ../components/common.yaml#/parameters/PageSize
    - $ref: ../components/common.yaml#/parameters/Search
    - name: status
      in: query
      schema:
        $ref: '#/components/schemas/ExpenseClaimStatus'
    - name: divisionId
      in: query
      schema:
        type: string
        format: uuid
    - name: dateFrom
      in: query
      schema:
        $ref: ../components/common.yaml#/BusinessDate
    - name: dateTo
      in: query
      schema:
        $ref: ../components/common.yaml#/BusinessDate
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseClaimList'
      default:
        $ref: ../components/common.yaml#/responses/Problem
  post:
    operationId: createExpenseClaim
    tags:
    - accounting
    summary: Menyimpan draft pengajuan biaya
    parameters:
    - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExpenseClaimInput'
    responses:
      '201':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseClaimDetail'
      default:
        $ref: ../components/common.yaml#/responses/Problem
expenseClaim:
  get:
    operationId: getExpenseClaim
    tags:
    - accounting
    summary: Detail pengajuan biaya
    parameters:
    - $ref: ../components/common.yaml#/parameters/Id
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseClaimDetail'
      default:
        $ref: ../components/common.yaml#/responses/Problem
  put:
    operationId: updateExpenseClaim
    tags:
    - accounting
    summary: Mengubah draft (hanya pengaju)
    parameters:
    - $ref: ../components/common.yaml#/parameters/Id
    - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExpenseClaimUpdate'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseClaimDetail'
      default:
        $ref: ../components/common.yaml#/responses/Problem
expenseClaimSubmit:
  post:
    operationId: submitExpenseClaim
    tags:
    - accounting
    summary: Ajukan (nomor EXP, approval `expense_claim`)
    description: Bukti wajib untuk jenis biaya yang mewajibkan; kampanye wajib untuk jenis biaya bertanda kampanye. Approval berjenjang
      per nominal & divisi.
    parameters:
    - $ref: ../components/common.yaml#/parameters/Id
    - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/common.yaml#/VersionInput
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseClaimDetail'
      default:
        $ref: ../components/common.yaml#/responses/Problem
expenseClaimRevise:
  post:
    operationId: reviseExpenseClaim
    tags:
    - accounting
    summary: Revisi pengajuan ditolak menjadi draft
    parameters:
    - $ref: ../components/common.yaml#/parameters/Id
    - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/common.yaml#/VersionInput
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseClaimDetail'
      default:
        $ref: ../components/common.yaml#/responses/Problem
expenseClaimCancel:
  post:
    operationId: cancelExpenseClaim
    tags:
    - accounting
    summary: Batalkan draft/pengajuan ditolak
    parameters:
    - $ref: ../components/common.yaml#/parameters/Id
    - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FinanceCancelInput'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseClaimDetail'
      default:
        $ref: ../components/common.yaml#/responses/Problem
expenseClaimVerifyPreview:
  post:
    operationId: previewExpenseClaimVerification
    tags:
    - accounting
    summary: Pratinjau PPh verifikasi F&A
    description: Menghitung PPh per jenis + objek pajak dengan tarif berlaku hari ini tanpa menyimpan. Butuh `accounting.expense_claim.post`.
    parameters:
    - $ref: ../components/common.yaml#/parameters/Id
    - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExpenseClaimVerifyInput'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseClaimVerifyPreview'
      default:
        $ref: ../components/common.yaml#/responses/Problem
expenseClaimVerify:
  post:
    operationId: verifyExpenseClaim
    tags:
    - accounting
    summary: Verifikasi F&A (bukti + PPh, jurnal A-15)
    description: 'Pengajuan Disetujui → Menunggu Pembayaran. Jurnal A-15: Dr beban jenis biaya / Cr 2103 Utang Biaya + utang PPh; data
      bukti potong dicatat.'
    parameters:
    - $ref: ../components/common.yaml#/parameters/Id
    - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExpenseClaimVerifyInput'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseClaimDetail'
      default:
        $ref: ../components/common.yaml#/responses/Problem
expenseClaimPay:
  post:
    operationId: payExpenseClaim
    tags:
    - accounting
    summary: Bayar pengajuan (BYR, A-PB Dr 2103 / Cr bank)
    description: Butuh re-autentikasi `accounting.payment.post` (★).
    parameters:
    - $ref: ../components/common.yaml#/parameters/Id
    - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExpenseClaimPayInput'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseClaimDetail'
      default:
        $ref: ../components/common.yaml#/responses/Problem
pettyCashFunds:
  get:
    operationId: listPettyCashFunds
    tags:
    - accounting
    summary: Kas Kecil › Dana kas kecil (rekap saldo)
    parameters:
    - name: includeInactive
      in: query
      schema:
        type: boolean
        default: false
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PettyCashFundList'
      default:
        $ref: ../components/common.yaml#/responses/Problem
  post:
    operationId: createPettyCashFund
    tags:
    - accounting
    summary: Menambah dana kas kecil
    description: Saldo awal nol; diisi lewat pengisian kembali.
    parameters:
    - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PettyCashFundInput'
    responses:
      '201':
        description: OK
        content:
