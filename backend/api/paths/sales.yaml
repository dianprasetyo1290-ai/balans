        schema:
          $ref: "../components/common.yaml#/SalesOrderType"
    responses:
      "200":
        description: Lokasi aktif
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/SalesLocationRef"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
salesCashBankAccounts:
  get:
    operationId: listSalesCashBankAccounts
    tags: [sales]
    summary: Akun Kas & Bank (11xx) untuk konfirmasi pembayaran
    responses:
      "200":
        description: Akun Kas & Bank aktif
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/SalesAccountOption"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
proformaInvoices:
  get:
    operationId: listProformaInvoices
    tags: [sales]
    summary: Daftar Proforma Invoice
    parameters:
      - $ref: "../components/common.yaml#/parameters/Page"
      - $ref: "../components/common.yaml#/parameters/PageSize"
      - $ref: "../components/common.yaml#/parameters/Search"
      - name: status
        in: query
        schema:
          $ref: "../components/common.yaml#/SalesDocumentStatus"
    responses:
      "200":
        description: PI terbaru lebih dulu
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProformaInvoiceList"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
proformaInvoice:
  get:
    operationId: getProformaInvoice
    tags: [sales]
    summary: Detail Proforma Invoice beserta Sales Order (cetak PI)
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
    responses:
      "200":
        description: Proforma Invoice
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProformaInvoiceDetail"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
proformaInvoiceConfirmPayment:
  post:
    operationId: confirmProformaPayment
    tags: [sales]
    summary: Konfirmasi pembayaran Proforma Invoice (F&A)
    description: |
      Invoice final `INV/…` terbit Lunas dengan jurnal A-05, pembayaran `BYR/…` tercatat dan dialokasikan ke
      invoice (A-PB: Dr Kas/Bank, Cr Piutang Usaha), Sales Order menjadi Diproses (siap dikirim). PI yang lewat
      masa berlaku ditolak.
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProformaPaymentInput"
    responses:
      "200":
        description: PI Lunas
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProformaInvoiceDetail"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
salesInvoices:
  get:
    operationId: listSalesInvoices
    tags: [sales]
    summary: Daftar invoice (Penjualan › Invoice, Keuangan & Akuntansi › Piutang Usaha)
    parameters:
      - $ref: "../components/common.yaml#/parameters/Page"
      - $ref: "../components/common.yaml#/parameters/PageSize"
      - $ref: "../components/common.yaml#/parameters/Sort"
      - $ref: "../components/common.yaml#/parameters/Search"
      - name: status
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            $ref: "../components/common.yaml#/SalesDocumentStatus"
      - name: partyType
        in: query
        schema:
          $ref: "#/components/schemas/SalesPartyType"
      - name: partyId
        in: query
        schema:
          type: string
          format: uuid
      - name: dateFrom
        in: query
        schema:
          $ref: "../components/common.yaml#/BusinessDate"
      - name: dateTo
        in: query
        schema:
          $ref: "../components/common.yaml#/BusinessDate"
      - name: overdue
        in: query
        description: Hanya invoice terbuka yang lewat jatuh tempo hari ini.
        schema:
          type: boolean
    responses:
      "200":
        description: Invoice terbaru lebih dulu
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalesInvoiceList"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
salesInvoice:
  get:
    operationId: getSalesInvoice
    tags: [sales]
    summary: Detail invoice beserta riwayat pembayaran (cetak invoice NON-PKP)
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
    responses:
      "200":
        description: Invoice
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalesInvoice"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
salesInvoiceShareText:
  get:
    operationId: getSalesInvoiceShareText
    tags: [sales]
    summary: Teks invoice siap tempel ke WhatsApp
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
    responses:
      "200":
        description: Teks invoice
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalesShareText"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
customerPayments:
  get:
    operationId: listCustomerPayments
    tags: [sales]
    summary: Daftar pembayaran pelanggan (Piutang Usaha)
    parameters:
      - $ref: "../components/common.yaml#/parameters/Page"
      - $ref: "../components/common.yaml#/parameters/PageSize"
      - $ref: "../components/common.yaml#/parameters/Search"
      - name: status
        in: query
        schema:
          $ref: "../components/common.yaml#/SalesDocumentStatus"
      - name: partyType
        in: query
        schema:
          $ref: "#/components/schemas/SalesPartyType"
      - name: partyId
        in: query
        schema:
          type: string
          format: uuid
      - name: dateFrom
        in: query
        schema:
          $ref: "../components/common.yaml#/BusinessDate"
      - name: dateTo
        in: query
        schema:
          $ref: "../components/common.yaml#/BusinessDate"
    responses:
      "200":
        description: Pembayaran terbaru lebih dulu
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerPaymentList"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
  post:
    operationId: createCustomerPayment
    tags: [sales]
    summary: Catat pembayaran pelanggan (alokasi ke satu atau banyak invoice) ★
    description: |
      Pembayaran sebagian diperbolehkan; jumlah alokasi harus sama dengan nominal pembayaran. Nomor `BYR/…` dan
      jurnal A-PB (Dr akun Kas & Bank, Cr Piutang Usaha 1201, pihak = pelanggan/mitra). Butuh
      `accounting.payment.post` dan re-autentikasi 5 menit.
    parameters:
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CustomerPaymentInput"
    responses:
      "201":
        description: Pembayaran diposting
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerPayment"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
customerPayment:
  get:
    operationId: getCustomerPayment
    tags: [sales]
    summary: Detail pembayaran pelanggan
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
    responses:
      "200":
        description: Pembayaran
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerPayment"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
customerPaymentCancel:
  post:
    operationId: cancelCustomerPayment
    tags: [sales]
    summary: Batalkan pembayaran pelanggan ★ (jurnal A-PB dibalik, piutang invoice dikembalikan)
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SalesCancelInput"
    responses:
      "200":
        description: Pembayaran dibatalkan
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerPayment"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
receivableAging:
  get:
    operationId: getReceivableAging
    tags: [sales]
    summary: Laporan Piutang — umur piutang per pelanggan/mitra
    parameters:
      - name: asOf
        in: query
        description: Tanggal posisi (default hari ini).
        schema:
          $ref: "../components/common.yaml#/BusinessDate"
      - name: partyType
        in: query
        schema:
          $ref: "#/components/schemas/SalesPartyType"
    responses:
      "200":
        description: Umur piutang
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceivableAgingReport"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
components:
  schemas:
    MidtransNotification:
      type: object
      description: Payload HTTP notification Midtrans (nama field milik Midtrans).
      required: [order_id, status_code, gross_amount, signature_key, transaction_status, transaction_id]
      properties:
        order_id:
          type: string
        status_code:
          type: string
        gross_amount:
          type: string
        signature_key:
          type: string
        transaction_status:
          type: string
        transaction_id:
          type: string
        fraud_status:
          type: string
    WebhookAck:
      type: object
      required: [received, duplicate]
      properties:
        received:
          type: boolean
        duplicate:
          type: boolean
    ReturnReasonAppliesTo:
      type: string
      description: Dokumen yang memakai alasan ini.
      enum: [sales_return, purchase_return, both]
    ReturnReasonScope:
      type: string
      enum: [sales_return, purchase_return]
    ReturnDisposition:
      type: string
      description: Disposisi barang retur (Disposisi Retur, WMS-07).
      enum: [restock, repack, reprocess, marketing_sample, dispose]
    ReturnReason:
      type: object
      required: [id, code, name, appliesTo, description, isActive, updatedAt, version]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: DAMAGED_SHIPPING
        name:
          type: string
        appliesTo:
          $ref: "#/components/schemas/ReturnReasonAppliesTo"
        defaultDisposition:
          allOf:
            - $ref: "#/components/schemas/ReturnDisposition"
          nullable: true
          description: Usulan awal disposisi; staf gudang tetap memilih saat QC.
        description:
          type: string
        isActive:
          type: boolean
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
    ReturnReasonFields:
      type: object
      required: [name, appliesTo, isActive]
      properties:
        name:
          type: string
          maxLength: 150
        appliesTo:
          $ref: "#/components/schemas/ReturnReasonAppliesTo"
        defaultDisposition:
          allOf:
            - $ref: "#/components/schemas/ReturnDisposition"
          nullable: true
        description:
          type: string
          maxLength: 500
        isActive:
          type: boolean
    ReturnReasonInput:
      allOf:
        - $ref: "#/components/schemas/ReturnReasonFields"
        - type: object
          required: [code]
          properties:
            code:
              type: string
              example: DAMAGED_SHIPPING
    ReturnReasonUpdate:
      allOf:
        - $ref: "#/components/schemas/ReturnReasonFields"
        - $ref: "../components/common.yaml#/VersionInput"
    SalesQuantity:
      type: string
      description: Kuantitas desimal maks. 3 angka di belakang koma sebagai string.
      pattern: "^[0-9]{1,15}(\\.[0-9]{1,3})?$"
      example: "12.000"
    SalesPartyType:
      type: string
      description: Jenis pihak invoice/pembayaran.
      enum: [customer, partner]
    SalesPaymentMode:
      type: string
      description: "`prepaid` = Proforma Invoice lalu invoice lunas; `credit` = tempo (MT/B2B), invoice terbit saat konfirmasi."
      enum: [prepaid, credit]
    CustomerPaymentMethod:
      type: string
      enum: [bank_transfer, cash]
    SalesDiscount:
      type: object
      required: [kind, value]
      properties:
        kind:
          $ref: "../components/common.yaml#/DiscountKind"
        value:
          type: string
          description: Persen (maks. 4 desimal) atau nominal rupiah.
          example: "5"
    SalesProductRef:
      type: object
      required: [id, sku, name, uom]
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        uom:
          type: string
    SalesLocationRef:
      type: object
      required: [id, code, name, locationType]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        locationType:
          type: string
    SalesChannelOption:
      type: object
      required: [id, kind, code, name]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [channel, sub_channel]
