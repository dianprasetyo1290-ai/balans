midtransWebhook:
  post:
    operationId: receiveMidtransWebhook
    security: []
    tags: [sales]
    summary: Notifikasi pembayaran Midtrans
    description: |
      Signature diverifikasi sebelum payload disimpan. Event disimpan di webhook_events (dedup per event)
      dan diproses job payment_webhook.process yang mengonfirmasi ulang status ke Midtrans
      (Technical Guideline 7.4, 9.3). Endpoint ini tidak memakai Idempotency-Key.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MidtransNotification"
    responses:
      "200":
        description: Event diterima atau sudah pernah diterima
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookAck"
      "400":
        description: Payload tidak bisa dibaca
        content:
          application/problem+json:
            schema:
              $ref: "../components/problem.yaml#/Problem"
      "403":
        description: Signature tidak valid
        content:
          application/problem+json:
            schema:
              $ref: "../components/problem.yaml#/Problem"
returnReasons:
  get:
    operationId: listReturnReasons
    tags: [sales]
    summary: Data Master › Alasan Retur
    description: |
      Butuh `sales.return_reason.read`, `sales.sales_return.read`, atau `procurement.purchase_return.read`
      (dropdown dokumen retur). Filter `appliesTo` mengembalikan alasan untuk jenis itu dan alasan `both`.
    parameters:
      - name: includeInactive
        in: query
        schema:
          type: boolean
          default: false
      - name: appliesTo
        in: query
        schema:
          $ref: "#/components/schemas/ReturnReasonScope"
      - $ref: "../components/common.yaml#/parameters/Search"
    responses:
      "200":
        description: Alasan retur urut kode
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/ReturnReason"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
  post:
    operationId: createReturnReason
    tags: [sales]
    summary: Menambah alasan retur
    description: Kode unik permanen.
    parameters:
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ReturnReasonInput"
    responses:
      "201":
        description: Alasan retur dibuat
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnReason"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
returnReason:
  put:
    operationId: updateReturnReason
    tags: [sales]
    summary: Mengubah alasan retur (kode tetap)
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ReturnReasonUpdate"
    responses:
      "200":
        description: Alasan retur diperbarui
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnReason"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
  delete:
    operationId: deleteReturnReason
    tags: [sales]
    summary: Menghapus (soft delete) alasan retur
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
      - name: version
        in: query
        required: true
        description: Versi terakhir yang dilihat user (optimistic locking).
        schema:
          type: integer
    responses:
      "204":
        description: Alasan retur dihapus
      default:
        $ref: "../components/common.yaml#/responses/Problem"
salesOrders:
  get:
    operationId: listSalesOrders
    tags: [sales]
    summary: Daftar Sales Order semua channel (Sales Order, Modern Trade, Penjualan Marketplace, WA/IG, Karyawan)
    description: |
      Hanya jenis pesanan yang boleh dilihat user: marketplace butuh `sales.marketplace_order.read`, jenis lain
      `sales.sales_order.read`.
    parameters:
      - $ref: "../components/common.yaml#/parameters/Page"
      - $ref: "../components/common.yaml#/parameters/PageSize"
      - $ref: "../components/common.yaml#/parameters/Sort"
      - $ref: "../components/common.yaml#/parameters/Search"
      - name: status
        in: query
        schema:
          $ref: "../components/common.yaml#/SalesDocumentStatus"
      - name: orderType
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            $ref: "../components/common.yaml#/SalesOrderType"
      - name: channelId
        in: query
        schema:
          type: string
          format: uuid
      - name: subChannelId
        in: query
        schema:
          type: string
          format: uuid
      - name: dateFrom
        in: query
        schema:
          $ref: "../components/common.yaml#/BusinessDate"
      - name: dateTo
        in: query
        schema:
          $ref: "../components/common.yaml#/BusinessDate"
    responses:
      "200":
        description: Pesanan terbaru lebih dulu
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalesOrderList"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
  post:
    operationId: createSalesOrder
    tags: [sales]
    summary: Menyimpan draft Sales Order, atau mencatat penjualan marketplace (S-301, S-306, S-307, S-308)
    description: |
      Harga satuan diambil resolver harga (harga khusus → promo → bertingkat → daftar harga channel/mitra/karyawan
      → Harga Dasar) pada tanggal pesanan; aturan & versi disimpan per baris. Diskon manual per baris/dokumen
      (persen atau nominal). NON-PKP: tanpa PPN. Marketplace (`orderType=marketplace`) langsung tercatat Diproses
      dengan E-commerce Stock dialokasikan; nomor order marketplace unik per marketplace; harga baris boleh diisi
      dari marketplace (`unitPrice`).
    parameters:
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SalesOrderInput"
    responses:
      "201":
        description: Pesanan dibuat
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalesOrder"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
salesOrder:
  get:
    operationId: getSalesOrder
    tags: [sales]
    summary: Detail Sales Order beserta alokasi batch, Proforma, invoice, dan pengiriman
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
    responses:
      "200":
        description: Sales Order
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalesOrder"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
  put:
    operationId: updateSalesOrder
    tags: [sales]
    summary: Mengubah draft Sales Order (jenis pesanan tetap; harga dihitung ulang)
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SalesOrderUpdate"
    responses:
      "200":
        description: Draft diperbarui
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalesOrder"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
salesOrderConfirm:
  post:
    operationId: confirmSalesOrder
    tags: [sales]
    summary: Konfirmasi Sales Order
    description: |
      Harga dihitung ulang, nomor `SO/TAHUN/BULAN/NOMOR` diberikan, stok dialokasikan FEFO dari lokasi asal
      (bundel dipecah ke komponen). Diskon di atas batas role → Menunggu Persetujuan (`sales_order_discount`, Head
      Sales). Selain itu: prepaid → Proforma Invoice terbit (Menunggu Pembayaran); tempo → invoice terbit dan
      jurnal A-05 (Diproses).
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/common.yaml#/VersionInput"
    responses:
      "200":
        description: Pesanan dikonfirmasi
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalesOrder"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
salesOrderCancel:
  post:
    operationId: cancelSalesOrder
    tags: [sales]
    summary: Batalkan Sales Order yang belum dikirim
    description: |
      Alasan wajib selain draft. Approval diskon dibatalkan, alokasi stok dilepas, Proforma dibatalkan, invoice
      tempo tanpa pembayaran dibatalkan dengan jurnal balik A-05.
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SalesCancelInput"
    responses:
      "200":
        description: Pesanan dibatalkan
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalesOrder"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
salesOrderPaymentProof:
  post:
    operationId: uploadSalesOrderPaymentProof
    tags: [sales]
    summary: Unggah bukti bayar pelanggan (pesanan Menunggu Pembayaran)
    description: |
      File diunggah dulu lewat `/api/v1/files` dengan `ownerType=sales.payment_proof` (JPG/PNG/WebP/PDF), lalu
      ditautkan ke pesanan. F&A mengonfirmasi pembayaran di Proforma Invoice.
    parameters:
      - $ref: "../components/common.yaml#/parameters/Id"
      - $ref: "../components/common.yaml#/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SalesPaymentProofInput"
    responses:
      "200":
        description: Bukti bayar tercatat
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalesOrder"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
salesChannelOptions:
  get:
    operationId: listSalesChannelOptions
    tags: [sales]
    summary: Channel & sub-channel aktif untuk form pesanan
    responses:
      "200":
        description: Channel dan sub-channel
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/SalesChannelOption"
      default:
        $ref: "../components/common.yaml#/responses/Problem"
salesLocationOptions:
