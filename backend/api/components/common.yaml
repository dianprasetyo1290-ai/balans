Pagination:
  type: object
  description: Metadata pagination standar (Technical Guideline 8.2).
  required: [page, pageSize, totalItems, totalPages]
  properties:
    page:
      type: integer
      minimum: 1
    pageSize:
      type: integer
      minimum: 1
      maximum: 200
    totalItems:
      type: integer
      format: int64
    totalPages:
      type: integer
AuditFields:
  type: object
  required: [createdAt, updatedAt, version]
  properties:
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    version:
      type: integer
      description: Dipakai optimistic locking; kirim kembali saat update (Technical Guideline 7.2).
Money:
  type: string
  description: Nominal Rupiah sebagai string desimal 2 angka di belakang koma (Technical Guideline 10.5).
  pattern: "^-?[0-9]{1,16}(\\.[0-9]{1,2})?$"
  example: "1250000.00"
BusinessDate:
  type: string
  format: date
  description: Tanggal bisnis WIB tanpa jam (YYYY-MM-DD).
  example: "2026-10-19"
WithholdingType:
  type: string
  description: Jenis PPh yang dipotong (pemasok, jenis biaya); tarif di master tarif PPh.
  enum: [none, pph21, pph23, pph4_2]
PriceRule:
  type: string
  description: |
    Aturan harga yang menghasilkan harga baris transaksi (BRD 5.18, disimpan sebagai `price_rule`): harga khusus,
    promo, harga bertingkat, daftar harga channel/mitra/karyawan, atau Harga Dasar & HET.
  enum: [special_price, promotion, tiered_price, price_list, base_price]
DiscountKind:
  type: string
  description: Bentuk diskon manual (MD-05) — persen dari dasar atau nominal rupiah.
  enum: [percent, amount]
VersionInput:
  type: object
  required: [version]
  properties:
    version:
      type: integer
      description: Versi terakhir yang dilihat user (optimistic locking).
parameters:
  Page:
    name: page
    in: query
    schema:
      type: integer
      minimum: 1
      default: 1
  PageSize:
    name: pageSize
    in: query
    schema:
      type: integer
      minimum: 1
      maximum: 200
      default: 50
  Sort:
    name: sort
    in: query
    description: Daftar field dipisah koma; awalan minus untuk descending, mis. `-createdAt,sku`.
    schema:
      type: string
  Search:
    name: q
    in: query
    schema:
      type: string
  IdempotencyKey:
    name: Idempotency-Key
    in: header
    required: true
    description: UUID per percobaan submit (Technical Guideline 7.1).
    schema:
      type: string
      format: uuid
  Id:
    name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
responses:
  Problem:
    description: Error standar (problem+json)
    content:
      application/problem+json:
        schema:
          $ref: "./problem.yaml#/Problem"
