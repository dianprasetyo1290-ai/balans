# CI untuk setiap pull request (Technical Guideline 14.3). Branch main diproteksi: PR wajib hijau.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'scripts/**'
            frontend:
              - 'web-erp/**'
              - 'backend/api/**'
            deploy:
              - 'deploy/**'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    env:
      BALANS_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: 1.30.0

      - name: Hasil generate sama dengan yang di-commit
        working-directory: .
        run: |
          bash scripts/generate.sh
          git diff --exit-code -- backend web-erp/src/lib/api/schema.gen.ts \
            || (echo "::error::Jalankan scripts/generate.sh lalu commit hasilnya" && exit 1)

      - name: Lint kontrak OpenAPI
        run: >
          pnpm --package=@redocly/cli@2.55.0 dlx redocly lint api/openapi.yaml
          --skip-rule operation-4xx-response --skip-rule info-license --skip-rule no-server-example.com

      - name: Lint (termasuk depguard batas modul)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: backend

      - name: Test (Postgres asli lewat testcontainers)
        run: go test -race -count=1 ./...

      - name: Gate coverage 80%
        working-directory: .
        run: bash scripts/coverage-gate.sh

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web-erp
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: web-erp/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high

  deploy-config:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Shellcheck skrip operasi
        run: shellcheck deploy/scripts/*.sh deploy/postgres/*.sh deploy/monitoring/*.sh
      - name: Validasi Compose
        working-directory: deploy
        env:
          REGISTRY: ghcr.io/example
          IMAGE_TAG: ci
          POSTGRES_IMAGE_TAG: ci
          ENV_FILE: env.example
        run: |
          docker compose -f compose.yaml -f compose.production.yaml config --quiet
          docker compose -f compose.yaml -f compose.staging.yaml config --quiet
          ENV_FILE=edge.env.example docker compose -f compose.edge.yaml config --quiet
      - name: Validasi Caddyfile
        run: |
          docker run --rm -e ACME_EMAIL=ci@example.com -e STAGING_BASIC_AUTH_USER=ci \
            -e 'STAGING_BASIC_AUTH_HASH=$2a$14$Zkx19XLiW6VYouLHR5NmfOFU0z2GTNmpkT/5qqR7hx4IjWJPDhjvG' \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.4-alpine caddy validate --config /etc/caddy/Caddyfile
          docker run --rm -v "$PWD/web-erp/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.4-alpine caddy validate --config /etc/caddy/Caddyfile
