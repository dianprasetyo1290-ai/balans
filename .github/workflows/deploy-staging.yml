# Merge ke main → build image bertag SHA → push GHCR → deploy staging → smoke test E2E
# (Technical Guideline 14.3). Image yang sama dipakai production lewat retag.
name: deploy-staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

# Deploy hanya berjalan setelah VPS siap: set variabel repo DEPLOY_ENABLED=true (Settings → Variables).
jobs:
  build:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        run: |
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "registry=${REGISTRY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image backend
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.registry }}/balans-api:${{ steps.meta.outputs.tag }}
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Image web-erp
        uses: docker/build-push-action@v7
        with:
          context: .
          file: web-erp/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.registry }}/balans-web-erp:${{ steps.meta.outputs.tag }}
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
            SENTRY_DSN=${{ vars.WEB_ERP_SENTRY_DSN }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: staging
      url: https://erp-staging.findyourbalans.com
    steps:
      - uses: actions/checkout@v7
      - name: Siapkan SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Kirim konfigurasi deploy
        run: rsync -az --delete deploy/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/balans/deploy/"
      - name: Deploy
        run: ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "bash /opt/balans/deploy/scripts/deploy.sh staging ${{ needs.build.outputs.tag }}"

  e2e:
    needs: deploy
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web-erp
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: web-erp/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Smoke test staging
        env:
          E2E_BASE_URL: https://erp-staging.findyourbalans.com
          E2E_BASIC_AUTH: ${{ secrets.STAGING_BASIC_AUTH }}
        run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web-erp/playwright-report
          retention-days: 14
